<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FOLDER 1 LOCKED</title>
<style>body{margin:0;background:#0f172a;color:#fff;font-family:sans-serif;padding:15px}input,textarea{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:none;background:#1e293b;color:#fff}button{width:100%;padding:13px;border:none;border-radius:10px;font-weight:bold;margin-top:8px}.box{border:2px dashed #f59e0b;padding:15px;border-radius:12px;background:#1e293b}</style></head><body>
<h2>📁 FOLDER 1 - IMEFUNGWA</h2>
<div class="box">
<p style="font-size:12px;color:#94a3b8">Hii ndio Folder 1. Video zote ukiweka hapa zinaenda moja kwa moja TV na zinacheza smooth autoplay. Viewers HAWAZIONI folder hii, ni wewe tu!</p>
<input id="t" placeholder="Jina la video">
<textarea id="desc" placeholder="Maelezo"></textarea>
<input id="l" placeholder="Link ya YouTube">
<button onclick="addV()" style="background:#f59e0b">📥 WEKA NDANI YA FOLDER 1</button>
<button onclick="clearAll()" style="background:#ff0000">🗑 FUTA ZOTE ZA KITAMBO</button>
</div>
<div id="list" style="margin-top:15px"></div>
<a href="index.html" style="color:orange">→ Fungua TV</a>
<script>
function getV(){return JSON.parse(localStorage.getItem('ale_videos')||'[]')}
function saveV(v){localStorage.setItem('ale_videos',JSON.stringify(v))}
function getId(u){let m=u.match(/(?:youtu\.be\/|v=|embed\/)([^&?\/]+)/);return m?m[1].slice(0,11):u.trim().slice(0,11)}
function addV(){let a=t.value.trim(),b=desc.value.trim(),c=l.value.trim();if(!a||!c)return alert('Weka jina na link');let id=getId(c);let v=getV();v.push({id:id,title:a,desc:b,cat:'Muziki'});saveV(v);t.value='';desc.value='';l.value='';show();alert('Imeingia Folder 1!')}
function delV(i){let v=getV();v.splice(i,1);saveV(v);show();}
function clearAll(){if(confirm('Futa zote?')){localStorage.removeItem('ale_videos');show()}}
function show(){let v=getV();let h='Videos kwenye Folder 1: '+v.length+'<br>';for(let i=v.length-1;i>=0;i--){h+='<div style=background:#1e293b;padding:8px;margin:6px 0;border-radius:8px><b>'+v[i].title+'</b><br><button onclick=delV('+i+') style=background:red;width:auto;padding:4px> Futa </button></div>'}list.innerHTML=h}
show();
</script></body></html>
