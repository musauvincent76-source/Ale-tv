<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ALE ADMIN</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#111;padding:20px;color:#fff}.box{background:#000;border:2px solid #ff6600;border-radius:12px;padding:20px;max-width:400px;margin:auto}input{width:100%;padding:14px;border-radius:8px;border:1px solid #333;background:#222;color:#fff;margin:8px 0;font-size:14px}button{width:100%;padding:14px;background:#ff6600;color:#fff;border:0;border-radius:8px;font-weight:900;font-size:16px;margin-top:10px}#msg{background:#0a0;color:#fff;padding:10px;border-radius:8px;margin-top:10px;display:none;text-align:center}</style></head><body>
<div class="box">
<h2 style="color:#ff6600;text-align:center">ALE TV ADMIN</h2>
<p style="font-size:12px;color:#888;text-align:center;margin:10px 0">Weka YouTube Link hapa</p>
<input id="yt" placeholder="https://youtu.be/... au https://youtube.com/watch?v=...">
<input id="desc" placeholder="Maelezo - mfano: ALE vs GOR">
<button onclick="save()">SAVE & PLAY KWENYE TV</button>
<div id="msg">✅ IMESAVIWA! Fungua TV sasa!</div>
<p style="font-size:11px;color:#666;margin-top:15px;text-align:center">TV Link: /index.html<br>Ita-update yenyewe baada ya sec 2</p>
</div>
<script>
function getId(v){if(!v)return'';v=v.trim();if(v.length==11&&!v.includes('/'))return v;if(v.includes('youtu.be/'))return v.split('youtu.be/')[1].split(/[?&#]/)[0];try{let u=new URL(v);if(u.searchParams.get('v'))return u.searchParams.get('v');}catch{}let m=v.match(/([a-zA-Z0-9_-]{11})/);return m?m[1]:'';}
function save(){
let y=document.getElementById('yt').value;let d=document.getElementById('desc').value;
let id=getId(y);if(!id){alert('Link mbaya! Weka YouTube link sahihi');return;}
localStorage.setItem('aletv_live_now',JSON.stringify({ytid:id,desc:d||'ALE TV LIVE',title:d}));
localStorage.setItem('ale_zero_v1',JSON.stringify({videos:[{id:id,desc:d}]}));
document.getElementById('msg').style.display='block';
setTimeout(()=>{document.getElementById('msg').style.display='none';},3000);
}
</script></body></html>
