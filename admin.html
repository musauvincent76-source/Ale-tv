<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALE ADMIN GEK</title>
<script src="https://cdn.tailwindcss.com"></script>
</head><body class="bg-[#0a0a0a] text-white p-4">
<div class="max-w-2xl mx-auto">

<div class="flex justify-between items-center mb-6">
<h1 class="text-xl font-black">ALE <span class="text-orange-500">GEK ADMIN</span></h1>
<a href="/" target="_blank" class="bg-white text-black px-5 py-2 rounded-full text-xs font-black">📺 ONA TV</a>
</div>

<div class="bg-[#18181b] border border-zinc-800 rounded-2xl p-5">
<input id="link" placeholder="Paste YouTube link hapa..." class="w-full bg-black border border-zinc-800 rounded-xl px-4 py-3 text-sm outline-none focus:border-orange-500">
<div id="status" class="text-[11px] mt-2 text-zinc-500">👉 Weka link...</div>

<div id="preview" class="hidden mt-4 flex gap-3 bg-black p-3 rounded-xl border border-zinc-800">
<img id="thumb" class="w-20 h-14 rounded object-cover">
<div class="flex-1"><p id="pTitle" class="text-xs font-bold"></p><p id="pChannel" class="text-[10px] text-zinc-500"></p></div>
</div>

<input id="title" placeholder="Title (ita-auto)" class="w-full bg-black border border-zinc-800 rounded-xl px-4 py-3 text-sm mt-4">
<input id="cat" value="BURUDANI" class="w-full bg-black border border-zinc-800 rounded-xl px-4 py-3 text-sm mt-3">
<textarea id="desc" rows="3" placeholder="Description (ita-auto)" class="w-full bg-black border border-zinc-800 rounded-xl px-4 py-3 text-sm mt-3"></textarea>

<button onclick="save()" id="btn" class="w-full bg-orange-500 text-black font-black py-3 rounded-xl mt-4 text-sm">⚡ GEK & HIFADHI</button>
<p id="msg" class="text-xs text-center mt-3"></p>
</div>

<div class="mt-6">
<h2 class="text-xs font-black text-zinc-500 mb-2">🔴 LIVE KWA TV - HIZI NDIZO ZITA-SCROLL CHINI</h2>
<div id="list" class="space-y-2"></div>
</div>

</div>

<script>
let currentId=null;

function getId(u){
 let m=u.match(/(?:v=|youtu.be\/|shorts\/|embed\/)([a-zA-Z0-9_-]{11})/);
 return m?m[1]:null;
}

// GEK AUTOMATIC - inavuta title/desc kutoka YouTube
async function gekYouTube(id){
 try{
  document.getElementById('status').innerText='⏳ Na-GEK...';
  // YouTube oEmbed - FREE, hakuna API key
  let res=await fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${id}&format=json`);
  let data=await res.json();

  document.getElementById('title').value=data.title;
  document.getElementById('desc').value=data.title + " | " + data.author_name;
  document.getElementById('pTitle').innerText=data.title;
  document.getElementById('pChannel').innerText=data.author_name;
  document.getElementById('thumb').src=`https://img.youtube.com/vi/${id}/mqdefault.jpg`;
  document.getElementById('preview').classList.remove('hidden');
  document.getElementById('status').innerHTML=`✅ <span class="text-green-400">Ime-GEK! ${data.title}</span>`;
  document.getElementById('status').innerHTML+=`<br><span class="text-[10px]">Ita-reflect kwenye TV ticker chini 👇</span>`;
 }catch(e){
  document.getElementById('status').innerText='⚠️ Ime-GEK thumb tu, weka title mwenyewe';
  document.getElementById('thumb').src=`https://img.youtube.com/vi/${id}/mqdefault.jpg`;
  document.getElementById('preview').classList.remove('hidden');
 }
}

document.getElementById('link').addEventListener('input', (e)=>{
 let id=getId(e.target.value.trim());
 if(id && id!==currentId){
  currentId=id;
  gekYouTube(id);
 }
});

// LOCAL STORAGE - ndio TV inasoma
function save(){
 let id=currentId;
 let t=document.getElementById('title').value.trim();
 let d=document.getElementById('desc').value.trim();
 let c=document.getElementById('cat').value;
 if(!id||!t){ document.getElementById('msg').innerText='❌ Weka link kwanza'; return; }

 let vids=JSON.parse(localStorage.getItem('ale_videos')||'[]');
 vids.unshift({id:id, title:t, cat:c, desc:d, createdAt:Date.now()});
 localStorage.setItem('ale_videos', JSON.stringify(vids));

 document.getElementById('msg').innerText='🔥 Imehifadhi! Itaonekana kwenye TV ticker chini sasa!';
 document.getElementById('link').value='';
 document.getElementById('title').value='';
 document.getElementById('desc').value='';
 document.getElementById('preview').classList.add('hidden');
 render();
}

function render(){
 let vids=JSON.parse(localStorage.getItem('ale_videos')||'[]');
 let el=document.getElementById('list');
 el.innerHTML='';
 vids.forEach((v,i)=>{
  el.innerHTML+=`<div class="bg-[#18181b] border border-zinc-800 rounded-xl p-2 flex gap-2 items-center">
  <img src="https://img.youtube.com/vi/${v.id}/mqdefault.jpg" class="w-14 h-9 rounded">
  <div class="flex-1"><b class="text-[11px]">${v.title}</b><p class="text-[9px] text-zinc-500 truncate">${v.desc}</p></div>
  <button onclick="del(${i})" class="text-[10px] bg-red-900 px-2 py-1 rounded">FUTA</button></div>`;
 });
}
window.del=(i)=>{ let vids=JSON.parse(localStorage.getItem('ale_videos')||'[]'); vids.splice(i,1); localStorage.setItem('ale_videos', JSON.stringify(vids)); render(); }
render();
</script>
</body></html>
