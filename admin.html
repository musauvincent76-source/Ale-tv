<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ALE ADMIN LIVE</title><style>body{margin:0;background:#111;color:#fff;font-family:sans-serif;padding:10px}.card{background:#1a1a1a;padding:12px;border-radius:10px;margin-bottom:10px;border:1px solid #333}input,textarea{width:100%;padding:8px;border-radius:6px;border:1px solid #333;background:#000;color:#fff;margin:4px 0}button{padding:8px 12px;border-radius:6px;border:0;font-weight:900;cursor:pointer}.btn{background:#f59e0b;color:#000;width:100%;margin-top:6px}.small{font-size:12px;color:#aaa}</style></head><body>
<h2 style="color:#f59e0b">🔥 ALE ADMIN - LIVE LINK SUPPORT</h2>
<div class="card">
<small class="small">YouTube Link (kawaida au LIVE) - paste yote</small>
<input id="link" placeholder="https://www.youtube.com/watch?v=... au https://youtu.be/... au LIVE link">
<small class="small">Au ID tu</small>
<input id="id" placeholder="ID itajijaza yenyewe">
<input id="title" placeholder="Title">
<input id="cat" placeholder="Category - mfano LIVE / NEWS">
<textarea id="desc" placeholder="Description"></textarea>
<label><input type="checkbox" id="isLive"> ✅ Hii ni LIVE (hakuna elapsed)</label><br>
<button class="btn" onclick="save()">💾 SAVE & BROADCAST WORLDWIDE</button>
</div>
<div class="card"><button onclick="delAll()" style="background:red;color:#fff;width:100%">🗑️ FUTA ZOTE</button></div>
<div id="list"></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";import{getDatabase,ref,set,push,onValue,remove}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
const cfg={apiKey:"AIzaSyDuf-Is10hDtjNJU7hzDqJmLT2czSXzODg",authDomain:"ale-tv.firebaseapp.com",databaseURL:"https://ale-tv-default-rtdb.firebaseio.com",projectId:"ale-tv"};const app=initializeApp(cfg);const db=getDatabase(app);
function extractId(url){
 if(!url)return "";
 // kama ni ID tu bila https
 if(url.length===11 &&!url.includes('/'))return url;
 try{
   let u=url.trim();
   if(u.includes('youtu.be/'))return u.split('youtu.be/')[1].split(/[?&]/)[0];
   if(u.includes('watch?v='))return u.split('watch?v=')[1].split(/[?&]/)[0];
   if(u.includes('/live/'))return u.split('/live/')[1].split(/[?&]/)[0];
   if(u.includes('/shorts/'))return u.split('/shorts/')[1].split(/[?&]/)[0];
   if(u.includes('youtube.com/embed/'))return u.split('embed/')[1].split(/[?&]/)[0];
 }catch(e){}
 return url;
}
document.getElementById('link').addEventListener('input',(e)=>{
 let id=extractId(e.target.value);
 if(id)document.getElementById('id').value=id;
 if(e.target.value.includes('live')||e.target.value.includes('LIVE'))document.getElementById('isLive').checked=true;
});
window.save=async()=>{
 let vid=document.getElementById('id').value.trim()||extractId(document.getElementById('link').value.trim());
 if(!vid)return alert('Weka Link ya YouTube');
 let data={id:vid,title:document.getElementById('title').value||'ALE TV LIVE',cat:document.getElementById('cat').value||'LIVE',desc:document.getElementById('desc').value||'',isLive:document.getElementById('isLive').checked,createdAt:Date.now(),created:Date.now()};
 let r=push(ref(db,'videos'));await set(r,data);
 alert('Imeenda LIVE dunia nzima! WORLD SYNC');
 document.getElementById('link').value='';document.getElementById('id').value='';
}
window.restart=async(k)=>{
 await set(ref(db,'videos/'+k+'/createdAt'),Date.now());
 await set(ref(db,'videos/'+k+'/created'),Date.now());
 alert('Imerudi mwanzo kwa kila mtu!');
}
window.delOne=async(k)=>{if(confirm('Futa?'))await remove(ref(db,'videos/'+k));}
window.delAll=async()=>{if(confirm('Futa zote?')){onValue(ref(db,'videos'),async s=>{let d=s.val();if(!d)return;for(let k in d){await remove(ref(db,'videos/'+k));}},{onlyOnce:true});}}
onValue(ref(db,'videos'),s=>{
 let d=s.val();let h='';
 if(!d){document.getElementById('list').innerHTML='Hakuna video';return;}
 Object.entries(d).sort((a,b)=>(b[1].createdAt||0)-(a[1].createdAt||0)).forEach(([k,v])=>{
   h+=`<div class="card"><b>${v.title}</b><br><small>${v.id} ${v.isLive?'🔴 LIVE':''}</small><br><div style="margin-top:6px;display:flex;gap:5px"><button onclick="restart('${k}')" style="background:#f59e0b;color:#000">🔄 RESTART</button><button onclick="delOne('${k}')" style="background:red;color:#fff">Futa</button></div></div>`;
 });
 document.getElementById('list').innerHTML=h;
});
</script></body></html>
