<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MTAANI WHATSAPP</title>
<style>
body{margin:0;background:#111b21;font-family:Arial}
.header{background:#202c33;color:#fff;padding:10px;display:flex;align-items:center;gap:10px;position:fixed;top:0;width:100%;z-index:10}
.header img{width:38px;height:38px;border-radius:50%}
#chat{margin-top:60px;margin-bottom:70px;height:calc(100vh - 130px);overflow:auto;padding:12px;background:#0b141a url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png')}
.msg{max-width:78%;padding:8px 10px;border-radius:8px;margin:6px 0;font-size:14.2px;clear:both;position:relative;word-wrap:break-word}
.me{background:#005c4b;color:#e9edef;float:right;border-top-right-radius:0}
.bot{background:#202c33;color:#e9edef;float:left;border-top-left-radius:0}
.time{font-size:10px;color:#8696a0;float:right;margin:6px 0 0 8px}
.row{width:100%;overflow:hidden}
.footer{background:#202c33;padding:8px;display:flex;gap:8px;position:fixed;bottom:0;width:100%;box-sizing:border-box}
.footer input{flex:1;padding:12px 16px;border-radius:22px;border:none;background:#2a3942;color:#fff;outline:none}
.footer button{background:#00a884;border:none;width:48px;height:48px;border-radius:50%;color:#fff;font-size:22px}
.dots span{width:5px;height:5px;background:#8696a0;border-radius:50%;display:inline-block;margin:0 2px;animation:dunda 1.2s infinite}
@keyframes dunda{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
</style>
</head>
<body>

<div class="header">
<img src="https://i.pravatar.cc/100?img=12">
<div><b>MTAANI NETWORK</b><br><small style="color:#00a884" id="status">online</small></div>
</div>

<div id="chat"></div>

<div class="footer">
<input id="input" placeholder="Message">
<button onclick="jibu()">➤</button>
</div>

<script>
const chat=document.getElementById('chat');
const statusEl=document.getElementById('status');
let last=-1;
const majibu=[
"Poa mkuu! Umesema '{m}' 😎 Mimi niko hapa, tuongee tu!",
"Haha '{m}'? We ni mtaa! Niko rada, niambie zaidi?",
"Eeh '{m}' - hiyo nimei-note! Uko aje leo mkuu?",
"Nimekupata! '{m}' - Hapa MTAANI tunapambana tu, maisha ya Rongai!",
"Sawa mkuu '{m}' - niko hapa kama rafiki, si robot ya kurudia!",
"Yoh '{m}'! Hiyo ni deep, umenifungua akili!",
"Mambo ya '{m}'? Poa sana, jaribu tu usiogope, mtaa inakusupport!",
"We! '{m}' - umenichekesha 😂 Lakini ukweli, mtaa inajua hizo!",
"Niko nawe 100% '{m}' - tuongee free, niko hapa kukusikiza!",
"Eh '{m}'? Nimeelewa, pole kama ni shida, tutaongea tu!"
];

function now(){return new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});}
function add(who,text,typing=false){
let row=document.createElement('div'); row.className='row';
let div=document.createElement('div'); div.className='msg '+(who=='Wewe'?'me':'bot');
if(typing){div.id='typing'; div.innerHTML=`<span class="dots"><span></span><span></span><span></span></span>`}
else{div.innerHTML=`${text}<span class="time">${now()} ✓✓</span>`}
row.appendChild(div); chat.appendChild(row); chat.scrollTop=chat.scrollHeight;
}

function jibu(){
let raw=document.getElementById('input').value.trim(); if(!raw) return;
add('Wewe',raw); document.getElementById('input').value='';
statusEl.innerText='typing...'; add('Bot','',true);

setTimeout(()=>{
document.getElementById('typing')?.parentElement.remove();
statusEl.innerText='online';
let low=raw.toLowerCase();
let rep="";
if(low.includes('tv')) rep="TV iko LIVE hapa https://musauvincent76-source.github.io/Ale-tv/ ⚽!";
else if(low.includes('carpet')||low.includes('bei')) rep="Carpet ziko Rongai mkuu 🛋️ 3D na fluffy, 2500 hadi 6500 na delivery!";
else{
let i; do{i=Math.floor(Math.random()*majibu.length)}while(i===last); last=i;
rep=majibu[i].replace('{m}',raw);
}
add('Bot',rep);
}, 1500+Math.random()*800);
}

add('Bot','Niaje mkuu! 😎 Karibu MTAANI WhatsApp! Andika chochote, nitajibu hapa hapa - hakuna kwenda WhatsApp app!');
document.getElementById('input').addEventListener('keypress',e=>{if(e.key==='Enter')jibu()});
</script>
</body>
</html>
