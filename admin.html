<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALE TV - Admin Auto Description</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#050a14;color:#fff;display:flex;min-height:100vh}
.sidebar{width:240px;background:linear-gradient(180deg,#0a1430,#000);padding:20px;border-right:3px solid #ff0000;position:fixed;height:100vh}
.sidebar h1{color:#ff0000;font-size:26px;font-weight:900}
.sidebar small{letter-spacing:3px;font-size:10px;opacity:.6}
.menu{margin-top:30px}
.menu a{display:flex;gap:10px;padding:13px;border-radius:12px;text-decoration:none;color:#fff;opacity:.6;margin-bottom:6px;font-size:13px}
.menu a.active{background:#ff0000;opacity:1;font-weight:800}
.main{margin-left:240px;flex:1;padding:20px}
.topbar{display:flex;justify-content:space-between;align-items:center;background:#0e1d40;padding:16px;border-radius:16px;border-left:4px solid #ff0000;margin-bottom:20px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.stat{background:linear-gradient(145deg,#0e1d40,#0a1430);padding:18px;border-radius:16px;text-align:center;border-top:3px solid #ff0000}
.stat b{font-size:28px;color:#ff0000;display:block}
.card{background:#0e1d40;border:1px solid #1a2d60;border-radius:16px;padding:20px;margin-bottom:16px}
input,select,textarea{width:100%;padding:14px;border-radius:20px;border:1px solid #234080;background:#050a14;color:#fff;margin:7px 0;outline:none}
textarea{height:90px;border-radius:16px;resize:none}
.btn{width:100%;padding:14px;border-radius:30px;border:0;background:linear-gradient(90deg,#ff0000,#ffae00);color:#fff;font-weight:900;cursor:pointer}
.item{display:flex;justify-content:space-between;align-items:center;background:#0a1430;padding:12px;border-radius:12px;margin-bottom:8px;border-left:3px solid #00ff88}
@media(max-width:700px){.sidebar{position:relative;width:100%;height:auto}.main{margin-left:0}.stats{grid-template-columns:1fr 1fr}}
</style></head><body>
<div class="sidebar">
<h1>ALE TV</h1><small>YOUR HOME OF SPORTS</small>
<div class="menu">
