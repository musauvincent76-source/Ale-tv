<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALE ADMIN</title>
<script src="https://cdn.tailwindcss.com"></script>
</head><body class="bg-[#0a0a0a] text-white p-4">
<div class="max-w-2xl mx-auto">
<h1 class="text-xl font-black mb-1">ALE TV <span class="text-orange-500">ADMIN</span></h1><p class="text-[10px] text-zinc-500 mb-6">SYSTEM MPYA - HAKUNA MAMA AFRICA</p>

<div class="bg-[#18181b] border border-zinc-800 rounded-2xl p-5">
<input id="link" placeholder="YouTube link https://youtube.com/watch?v=..." class="w-full bg-black border border-zinc-800 rounded-xl px-4 py-3 text-sm outline-none">
<div id="idShow" class="text-[10px] text-zinc-600 mt-2">ID: -</div>
<input id="title" placeholder="Title ya video *" class="w-full bg-black border border-zinc-800 rounded-xl px-4 py-3 text-sm mt-3 outline-none">
<select id="cat" class="w-full bg-black border border-zinc-800 rounded-xl px-4 py-3 text-sm mt-3"><option>BURUDANI</option><option>MUZIKI</option><option>HABARI</option><option>MAHUBIRI</option></select>
<textarea id="desc" rows="3" placeholder="Description * (lazima)" class="w-full bg-black border border-zinc-800 rounded-xl px-4 py-3 text-sm mt-3 outline-none"></textarea>
<button onclick="add()" class="w-full bg-white text-black font-black py-3 rounded-xl mt-4 text-sm">HIFADHI VIDEO</button>
<p id="msg" class="text-xs text-center mt-3 text-zinc-500"></p>
</div>

<div class="bg-[#18181b] border border-zinc-800 rounded-2xl p-4 mt-4 flex justify-between items-center">
<span id="liveSt" class="text-xs text-zinc-500">Hakuna LIVE</span><button onclick="stopL()" class="bg-zinc-800 px-3 py-1.5 rounded-full text-xs">Stop Live</button>
</div>

<div class="bg-[#18181b] border border-zinc-800 rounded-2xl p-4 mt-4">
<h2 class="text-xs font-bold text-zinc-400">PLAYLIST (<span id="cnt">0</span>)</h2><div id="list" class="mt-3 space-y-2"></div>
</div>
</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";import{getDatabase,ref,push,set,onValue,remove}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
const db=getDatabase(initializeApp({apiKey:"AIzaSyDuf-Is10hDtjNJU7hzDqJmLT2czSXzODg",authDomain:"ale-tv.firebaseapp.com",databaseURL:"https://ale-tv-default-rtdb.firebaseio.com",projectId:"ale-tv"}));
let vids=[];
const getId=u=>{let m=u.match(/(?:v=|youtu.be\/|shorts\/|embed\/)([a-zA-Z0-9_-]{11})/);return m?m[1]:/^[a-zA-Z0-9_-]{11}$/.test(u)?u:null;}
document.getElementById('link').addEventListener('input',e=>{let id=getId(e.target.value);document.getElementById('idShow').innerText=id?`✅ ID: ${id}`:`❌ Link mbovu`;});
window.add=async()=>{
 let id=getId(document.getElementById('link').value.trim());
 let t=document.getElementById('title').value.trim();
 let c=document.getElementById('cat').value;
 let d=document.getElementById('desc').value.trim();
 if(!id){document.getElementById('msg').innerText='❌ Link si sahihi';return;}
 if(t.length<3){document.getElementById('msg').innerText='❌ Title lazima';return;}
 if(d.length<5){document.getElementById('msg').innerText='❌ Description lazima';return;}
 document.getElementById('msg').innerText='⏳...';
 await push(ref(db,'videos'),{videoId:id,title:t,cat:c,desc:d,createdAt:Date.now()});
 document.getElementById('msg').innerText='✅ Imehifadhi';document.getElementById('link').value='';document.getElementById('title').value='';document.getElementById('desc').value='';
}
onValue(ref(db,'videos'),s=>{
 let data=s.val();let el=document.getElementById('list');el.innerHTML='';
 if(!data){vids=[];document.getElementById('cnt').innerText=0;return;}
 vids=Object.entries(data).map(([k,v])=>({k,...v})).sort((a,b)=>a.createdAt-b.createdAt);
 document.getElementById('cnt').innerText=vids.length;
 vids.forEach(v=>{
  el.innerHTML+=`<div class="bg-black border border-zinc-800 rounded-xl p-2 flex gap-2 items-center"><img src="https://img.youtube.com/vi/${v.videoId}/mqdefault.jpg" class="w-14 h-9 rounded object-cover"><div class="flex-1 truncate"><b class="text-xs block truncate">${v.title}</b><small class="text-[9px] text-zinc-500">${v.cat}</small></div><button onclick="go('${v.k}')" class="bg-white text-black px-2 py-1 rounded-full text-[10px] font-bold">LIVE</button><button onclick="del('${v.k}')" class="bg-zinc-800 px-2 py-1 rounded-full text-[10px]">X</button></div>`;
 });
});
window.go=async k=>{let v=vids.find(x=>x.k===k);await set(ref(db,'live'),{videoId:v.videoId,title:v.title,cat:v.cat,desc:v.desc,startAt:Date.now(),isLiveNow:true});}
window.del=async k=>{if(confirm('Futa?'))await remove(ref(db,'videos/'+k));}
window.stopL=async()=>{await remove(ref(db,'live'));}
onValue(ref(db,'live'),s=>{let v=s.val();document.getElementById('liveSt').innerText=v?`🔴 LIVE: ${v.title}`:'Hakuna LIVE';});
</script></body></html>
