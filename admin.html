<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ALE TV - Admin Dashboard</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
:root{--red:#ff0011;--dark:#050a18;--card:#101a35;--border:#1e2d5a}
body{background:var(--dark);color:#fff;min-height:100vh}
.top{position:sticky;top:0;z-index:20;background:linear-gradient(90deg,#080e26,#000);border-bottom:3px solid var(--red);padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
.top b{color:var(--red);font-size:22px;letter-spacing:1px}
.top b span{color:#fff;font-weight:300}
.top.user{background:var(--card);padding:6px 12px;border-radius:20px;border:1px solid var(--border);font-size:11px}
.tabs{padding:12px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:10px 18px;border-radius:30px;background:var(--card);border:1px solid var(--border);color:#8a9bbf;font-size:12px;font-weight:600;white-space:nowrap;cursor:pointer;transition:.2s}
.tab.active{background:var(--red);color:#fff;border-color:var(--red);box-shadow:0 0 15px rgba(255,0,17,.4)}
.wrap{padding:12px;max-width:800px;margin:auto}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px}
.kpi{background:linear-gradient(145deg,var(--card),#0a1228);border:1px solid var(--border);border-top:3px solid var(--red);border-radius:16px;padding:14px;text-align:center}
.kpi b{font-size:22px;display:block;color:#fff}
.kpi b.green{color:#00ff88}
.kpi span{font-size:9px;color:#6b7aa3;letter-spacing:1px}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px;margin-bottom:14px}
.card-title{font-size:12px;font-weight:800;letter-spacing:1.5px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card-title i{color:var(--red)}
label{font-size:10px;color:#6b7aa3;font-weight:700;letter-spacing:1px;margin-top:10px;display:block}
input,select,textarea{width:100%;padding:14px 14px;background:#050a18;border:1.5px solid var(--border);border-radius:14px;color:#fff;outline:none;margin-top:6px;font-size:14px;transition:.2s}
input:focus,textarea:focus,select:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(255,0,17,.15)}
textarea{height:90px;resize:none}
.btn{width:100%;padding:15px;border-radius:30px;border:0;background:linear-gradient(90deg,var(--red),#ffae00);color:#fff;font-weight:900;font-size:14px;letter-spacing:1px;cursor:pointer;margin-top:14px;box-shadow:0 8px 20px rgba(255,0,17,.3)}
.btn:active{transform:scale(.98)}
.msg{text-align:center;font-size:11px;font-weight:700;margin-top:10px;min-height:16px}
.item{background:#070d20;border:1px solid var(--border);border-left:4px solid #00ff88;border-radius:12px;padding:12px;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:10px}
.item.t{flex:1}
.item b{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.item small{font-size:9px;color:#6b7aa3}
.del{background:#1a0a0a;color:#ff4444;border:1px solid #3a1515;padding:7px 12px;border-radius:20px;cursor:pointer}
.empty{text-align:center;padding:30px;opacity:.4;font-size:12px}
.pill{display:inline-block;padding:3px 8px;border-radius:20px;background:#0a1430;border:1px solid var(--border);font-size:8px;margin-top:4px}
</style>
</head>
<body>

<div class="top">
<div><b>ALE <span>TV</span></b><div style="font-size:8px;letter-spacing:3px;opacity:.5;margin-top:2px">YOUR HOME OF SPORTS</div></div>
<div class="user"><i class="fa fa-circle" style="color:#00ff88;font-size:8px"></i> Alex • Admin</div>
</div>

<div class="tabs">
<div class="tab active"><i class="fa fa-table-columns"></i> Dashboard</div>
<div class="tab" onclick="window.open('index.html','_blank')"><i class="fa fa-tv"></i> ONA LIVE</div>
<div class="tab"><i class="fa fa-bullhorn"></i> TILL 3624692</div>
<div class="tab"><i class="fa fa-video"></i> <span id="countTab">0 Videos</span></div>
</div>

<div class="wrap">

<div class="grid">
<div class="kpi"><b id="kTotal">0</b><span>JUMLA VIDEO</span></div>
<div class="kpi"><b id="kLive" class="green">0</b><span>LIVE NOW</span></div>
<div class="kpi"><b>AUTO</b><span>MODE ON</span></div>
</div>

<div class="card">
<div class="card-title"><i class="fa fa-plus"></i> WEKA VIDEO MPYA - AUTO FETCH</div>
<label>YOUTUBE LINK</label>
<input id="url" placeholder="Paste YouTube link hapa... https://youtu.be/...">
<label>VIDEO TITLE (Auto)</label>
<input id="title" placeholder="Title itajijaza automatically...">
<label>DESCRIPTION (Auto)</label>
<textarea id="desc" placeholder="Description itajijaza automatically..."></textarea>
<label>CATEGORY</label>
<select id="cat">
<option value="MPIRA FOOTBALL">⚽ MPIRA FOOTBALL</option>
<option value="LIVE 24/7">🔴 LIVE 24/7</option>
<option value="HABARI">📰 HABARI</option>
<option value="BURUDANI">🎬 BURUDANI</option>
<option value="GOSPEL">🙏 GOSPEL</option>
</select>
<button class="btn" id="addBtn"><i class="fa fa-rocket"></i> WEKA LIVE SASA</button>
<div id="msg" class="msg"></div>
</div>

<div class="card">
<div class="card-title" style="justify-content:space-between"><span><i class="fa fa-list"></i> PLAYLIST YAKO</span><button onclick="load()" style="background:#050a18;color:#8a9bbf;border:1px solid var(--border);padding:6px 12px;border-radius:20px;font-size:10px"><i class="fa fa-rotate"></i> Refresh</button></div>
<div id="list"></div>
</div>

<div class="card" style="text-align:center;font-size:10px;opacity:.5;line-height:1.8">
<i class="fa fa-circle" style="color:#00ff88;font-size:8px"></i> SYSTEM ONLINE<br>
ALE TV • FINAL ONE INCH<br>
0703182307 • ale-tv.vercel.app<br>
TILL 3624692 - Alex Musau
</div>

</div>

<script>
const $ = id => document.getElementById(id);
function getYtId(u){
 if(!u) return '';
 if(u.includes('youtu.be/')) return u.split('youtu.be/')[1].split(/[?&#]/)[0];
 try{ let url=new URL(u); if(url.searchParams.get('v')) return url.searchParams.get('v'); }catch{}
 let m=u.match(/(?:v=|embed\/|shorts\/)([^&?/]+)/);
 return m?m[1]:'';
}
async function autoFetch(){
 let u=$('url').value.trim();
 let id=getYtId(u);
 if(!id) return;
 $('msg').innerHTML='<i class="fa fa-spinner fa-spin"></i> Inatafuta title...';
 $('msg').style.color='#ffae00';
 try{
   let r=await fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${id}&format=json`);
   let d=await r.json();
   $('title').value=d.title;
   $('desc').value=`${d.title}\n\n📺 ALE TV - YOUR HOME OF SPORTS\n💰 TILL 3624692 - Support ALE TV\n🔔 Subscribe & Share!\n\nauthor: ${d.author_name}`;
   $('msg').innerHTML='✅ Imejijaza automatically!';
   $('msg').style.color='#00ff88';
 }catch{
   $('title').value='ALE TV LIVE - '+id;
   $('desc').value=`LIVE on ALE TV - YOUR HOME OF SPORTS\nTILL 3624692 - Alex Musau\n0703182307`;
   $('msg').innerHTML='⚠️ Auto failed - hariri manual';
   $('msg').style.color='#ffae00';
 }
}
$('url').addEventListener('paste',()=>setTimeout(autoFetch,500));
$('url').addEventListener('change',autoFetch);
$('url').addEventListener('blur',autoFetch);

$('addBtn').onclick=()=>{
 let url=$('url').value.trim();
 let id=getYtId(url);
 if(!id){ alert('Weka YouTube link sahihi!'); return; }
 let title=$('title').value.trim() || 'ALE TV LIVE - '+id;
 let desc=$('desc').value.trim() || title+' | TILL 3624692';
 let cat=$('cat').value;
 $('msg').innerHTML='<i class="fa fa-spinner fa-spin"></i> Inapakia...';
 let vids=JSON.parse(localStorage.getItem('ale_videos')||'[]');
 vids.unshift({id:id,title:title,desc:desc,cat:cat,date:new Date().toISOString()});
 localStorage.setItem('ale_videos',JSON.stringify(vids));
 $('msg').innerHTML='✅ Imewekwa! Iko LIVE sasa kwenye TV!';
 $('msg').style.color='#00ff88';
 $('url').value=''; $('title').value=''; $('desc').value='';
 load();
 setTimeout(()=>{$('msg').innerHTML='';},3000);
};

window.load=()=>{
 let vids=JSON.parse(localStorage.getItem('ale_videos')||'[]');
 $('kTotal').innerText=vids.length;
 $('kLive').innerText=vids.length;
 $('countTab').innerText=vids.length+' Videos';
 if(!vids.length){
   $('list').innerHTML='<div class="empty"><i class="fa fa-video" style="font-size:28px;display:block;margin-bottom:10px"></i>Hakuna video bado<br>Weka YouTube link juu</div>';
   return;
 }
 $('list').innerHTML=vids.map((v,i)=>`
   <div class="item">
     <div class="t">
       <b><i class="fa fa-circle" style="color:#00ff88;font-size:8px"></i> ${v.title}</b>
       <small>${v.cat}</small> <span class="pill">${v.id}</span>
     </div>
     <button class="del" onclick="delVid(${i})"><i class="fa fa-trash"></i></button>
   </div>
 `).join('');
};
window.delVid=(i)=>{
 if(!confirm('Futa video hii?')) return;
 let vids=JSON.parse(localStorage.getItem('ale_videos')||'[]');
 vids.splice(i,1);
 localStorage.setItem('ale_videos',JSON.stringify(vids));
 load();
};
load();
</script>
</body>
</html>
