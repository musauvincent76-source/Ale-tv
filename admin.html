<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALE ADMIN NEW</title>
<style>
body{background:#000;color:#fff;font-family:Arial;padding:20px}
.box{background:#111;border:2px solid #ff6600;border-radius:15px;padding:20px;max-width:400px;margin:auto}
h2{color:#ff6600;text-align:center;margin-bottom:15px}
input{width:100%;padding:15px;background:#000;border:1px solid #333;color:#fff;border-radius:10px;font-size:16px}
button{width:100%;padding:16px;border:0;border-radius:10px;font-weight:900;font-size:16px;margin-top:12px}
#b1{background:#00ff66;color:#000}
#b2{background:#ff6600;color:#fff}
#b3{background:#222;color:#fff;border:1px solid #444}
#ok{background:#00ff66;color:#000;padding:12px;border-radius:10px;text-align:center;margin-top:12px;display:none;font-weight:900}
</style>
</head>
<body>
<div class="box">
<h2>ALE ADMIN MPYA</h2>
<p style="color:#888;font-size:12px;text-align:center;margin-bottom:10px">Weka YouTube link hapa chini</p>
<input id="link" placeholder="https://youtu.be/xxxxxxxxxxx">
<button id="b1" onclick="saving()">💾 SAVE - WEKA TV</button>
<div id="ok">✅ IMESAVIWA! TV IMEUPDATE!</div>
<button id="b2" onclick="goTV()">📺 ANGALIA TV SASA</button>
<button id="b3" onclick="futa()">🗑️ FUTA ZOTE</button>
<p id="info" style="font-size:11px;color:#555;margin-top:15px;text-align:center"></p>
</div>
<script>
function getId(v){
 v=v.trim();
 if(v.length==11 && v.indexOf('/')==-1) return v;
 if(v.indexOf('youtu.be/')>-1){return v.split('youtu.be/')[1].split('?')[0].split('&')[0];}
 try{let u=new URL(v);if(u.searchParams.get('v')) return u.searchParams.get('v');}catch(e){}
 let m=v.match(/[a-zA-Z0-9_-]{11}/); return m?m[0]:'';
}
function saving(){
 let v=document.getElementById('link').value;
 let id=getId(v);
 if(!id){alert('Weka link ya YouTube sahihi! Mfano: https://youtu.be/jNQXAC9IVRw');return;}
 localStorage.setItem('ale_tv_id', id);
 document.getElementById('ok').style.display='block';
 document.getElementById('info').innerText='Video ID: '+id+' - Imehifadhiwa!';
 setTimeout(()=>{document.getElementById('ok').style.display='none';},3000);
}
function goTV(){
 window.location.href='index.html';
}
function futa(){
 localStorage.clear();
 document.getElementById('link').value='';
 document.getElementById('info').innerText='Zote zimefutwa - Safi!';
 alert('Safi! LocalStorage imefutwa');
}
let old=localStorage.getItem('ale_tv_id');
if(old){document.getElementById('info').innerText='Iliyopo sasa: '+old; document.getElementById('link').value='https://youtu.be/'+old;}
</script>
</body>
</html>
