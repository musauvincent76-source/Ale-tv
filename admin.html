<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALE TV ADMIN</title>
<style>
body{margin:0;background:#111;color:#fff;font-family:sans-serif;padding:12px}
h2{color:#f59e0b;text-align:center}
.card{background:#1a1a1a;padding:12px;border-radius:10px;margin:10px 0;border:1px solid #333}
input,select,textarea{width:100%;padding:10px;margin:6px 0;background:#000;color:#fff;border:1px solid #444;border-radius:6px}
button{padding:10px 15px;border:none;border-radius:6px;font-weight:bold;cursor:pointer;margin:3px}
.btn-add{background:#f59e0b;color:#000;width:100%}
.btn-del{background:#ff0000;color:#fff}
.btn-ticker{background:#00ff88;color:#000;width:100%}
.list-item{background:#222;padding:8px;border-radius:6px;margin:5px 0;display:flex;justify-content:space-between;align-items:center}
.stats{display:flex;gap:10px;text-align:center}
.stats div{background:#222;flex:1;padding:10px;border-radius:8px}
.stats b{color:#f59e0b;font-size:18px;display:block}
.preview-logo{width:100px;height:100px;object-fit:contain;background:#000;border:1px dashed #f59e0b;border-radius:8px;display:block;margin:10px auto}
.folder-badge{background:#f59e0b;color:#000;padding:2px 6px;border-radius:4px;font-size:10px;font-weight:bold}
</style></head><body>
<h2>🔥 ALE TV ADMIN - FOLDERS 🔥</h2>

<div class="stats">
<div><b id="totalV">0</b>Videos</div>
<div><b id="folder1">0</b>Folder 1</div>
<div><b id="time">00:00</b>Now</div>
</div>

<div class="card">
<h3>🖼️ Logo Upload</h3>
<img id="logoPrev" class="preview-logo" src="">
<input type="file" id="logoFile" accept="image/*" onchange="uploadLogo(this)">
<button onclick="removeLogo()" style="background:#333;color:#fff;width:100%">❌ Toa Logo</button>
</div>

<div class="card">
<h3>➕ Weka Video Kwenye Folder</h3>
<input id="ytLink" placeholder="YouTube Link au ID">
<input id="vTitle" placeholder="Title ya video">
<textarea id="vDesc" placeholder="Description"></textarea>
<select id="vFolder" style="background:#f59e0b;color:#000;font-weight:bold">
<option value="1">📁 FOLDER 1 - Main TV (LIVE)</option>
<option value="2">📁 FOLDER 2 - Backup</option>
<option value="3">📁 FOLDER 3 - Special</option>
<option value="4">📁 FOLDER 4 - Archive</option>
</select>
<select id="vCat"><option>BURUDANI</option><option>HABARI</option><option>MICHEZO</option><option>DINI</option><option>ELIMU</option><option>MZIKI</option></select>
<div style="display:flex;gap:5px">
<input id="schedTime" type="time" style="flex:1">
<select id="schedDay" style="flex:1"><option value="all">Kila Siku</option><option value="1">Jumatatu</option><option value="2">Jumanne</option><option value="3">Jumatano</option><option value="4">Alhamisi</option><option value="5">Ijumaa</option><option value="6">Jumamosi</option><option value="0">Jumapili</option></select>
</div>
<small style="color:#888">⏰ Schedule optional - Weka saa icheze</small>
<button class="btn-add" onclick="addVideo()">💾 SAVE KWA FOLDER</button>
</div>

<div class="card">
<h3>📢 Ticker Custom</h3>
<input id="tickerCustom" placeholder="Andika habari ya chini...">
<button class="btn-ticker" onclick="saveTicker()">🔄 UPDATE TICKER</button>
<p style="font-size:11px;color:#888">Current: <span id="curTicker">-</span></p>
</div>

<div class="card">
<h3>📋 Folders Zote</h3>
<div style="margin-bottom:10px">
<button onclick="filterFolder('all')" style="background:#f59e0b;color:#000">ALL</button>
<button onclick="filterFolder('1')" style="background:#222;color:#fff">FOLDER 1</button>
<button onclick="filterFolder('2')" style="background:#222;color:#fff">FOLDER 2</button>
<button onclick="filterFolder('3')" style="background:#222;color:#fff">FOLDER 3</button>
<button onclick="filterFolder('4')" style="background:#222;color:#fff">FOLDER 4</button>
</div>
<div id="list"></div>
<button onclick="clearAll()" style="background:#333;color:#fff;width:100%;margin-top:10px">🗑️ Futa Zote</button>
</div>

<script>
let currentFilter='all';
function getV(){return JSON.parse(localStorage.getItem('ale_videos')||'[]')}
function saveV(v){localStorage.setItem('ale_videos',JSON.stringify(v))}
function extractId(url){if(!url) return ''; if(url.length==11) return url; let m=url.match(/(?:v=|youtu\.be\/|embed\/)([A-Za-z0-9_-]{11})/); return m?m[1]:url;}
function uploadLogo(input){
 let file=input.files[0]; if(!file) return;
 let reader=new FileReader();
 reader.onload=function(e){localStorage.setItem('ale_logo',e.target.result); document.getElementById('logoPrev').src=e.target.result; alert('Logo imewekwa!');}
 reader.readAsDataURL(file);
}
function removeLogo(){localStorage.removeItem('ale_logo'); document.getElementById('logoPrev').src=''; alert('Logo imetolewa');}
function addVideo(){
 let id=extractId(document.getElementById('ytLink').value.trim());
 if(id.length!=11){alert('Link mbaya mkuu!');return}
 let v=getV();
 v.push({id:id,title:document.getElementById('vTitle').value||'ALE TV Video',desc:document.getElementById('vDesc').value||'',cat:document.getElementById('vCat').value,folder:document.getElementById('vFolder').value,time:document.getElementById('schedTime').value||'',day:document.getElementById('schedDay').value});
 saveV(v); alert('Imewekwa kwa FOLDER '+document.getElementById('vFolder').value+'!'); location.reload();
}
function saveTicker(){localStorage.setItem('ale_ticker_custom',document.getElementById('tickerCustom').value); alert('Ticker updated!'); document.getElementById('curTicker').innerText=localStorage.getItem('ale_ticker_custom');}
function filterFolder(f){currentFilter=f; render();}
function render(){
 let
