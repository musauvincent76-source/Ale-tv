<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALE TV - Admin</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#050a14;color:#fff}
.login{height:100vh;display:flex;justify-content:center;align-items:center;background:#000}
.box{background:#101a33;padding:30px;border-radius:16px;width:92%;max-width:400px;border:2px solid #ff6600;text-align:center}
.header{background:#000;padding:14px 20px;display:flex;justify-content:space-between;border-bottom:3px solid #ff6600}
.main{padding:20px;max-width:600px;margin:auto}
.card{background:#101f45;border-radius:14px;padding:20px;margin:15px 0;border:1px solid #1e2f5a}
input,select{width:100%;padding:14px;border-radius:8px;border:1px solid #333;background:#0a1430;color:#fff;margin:8px 0;font-size:14px}
.btn{width:100%;padding:14px;background:#ff6600;color:#fff;border:0;border-radius:8px;font-weight:bold;font-size:15px;margin-top:10px}
.btn-yt{width:100%;padding:14px;background:red;color:#fff;border:0;border-radius:8px;font-weight:900;margin-top:10px}
#prog{height:10px;background:#ff6600;width:0%;margin-top:12px;border-radius:10px;transition:.3s}
.or{text-align:center;margin:15px 0;opacity:.4;font-weight:bold}
</style></head><body>
<div id="login" class="login"><div class="box">
<h1 style="color:#ff6600;font-size:30px">ALE TV</h1><p style="letter-spacing:3px;font-size:11px">YOUR HOME OF SPORTS</p><br>
<h2 style="color:#ff6600">🔐 ADMIN LOGIN</h2><br>
<input id="pass" type="password" placeholder="Password">
<button class="btn" onclick="login()">INGIA ADMIN</button>
<p style="margin-top:12px;font-size:11px;opacity:.5">Password: 0703182307</p>
</div></div>

<div id="panel" style="display:none">
<div class="header"><div><h2 style="color:#ff6600">ALE TV</h2><small style="letter-spacing:2px">YOUR HOME OF SPORTS</small></div><div style="text-align:right"><b>Alex Musau</b><br><small style="color:#ff6600">0703182307</small></div></div>
<div class="main">

<div class="card">
<h3>🔴 Upload kwa ALE TV</h3>
<input id="title" placeholder="Title - mf: Arsenal vs Man United LIVE">
<select id="cat"><option>MPIRA FOOTBALL</option><option>LIVE 24/7</option><option>HABARI</option><option>BURUDANI</option></select>

<p style="margin-top:15px;font-size:13px;color:#ff6600;font-weight:bold">CHAGUO 1: Weka YouTube Link (Rahisi zaidi)</p>
<input id="ytLink" placeholder="https://www.youtube.com/watch?v=xxxx">
<button class="btn-yt" id="ytBtn">📺 WEKA YOUTUBE LIVE</button>

<div class="or">— AU —</div>

<p style="font-size:13px;color:#ff6600;font-weight:bold">CHAGUO 2: Upload File ya Video</p>
<input type="file" id="file" accept="video/*">
<div id="prog"></div><p id="status" style="margin-top:8px;font-size:13px"></p>
<button class="btn" id="upBtn" style="background:#444">📁 UPLOAD FILE</button>

</div>

<div class="card" style="text-align:center">
<p>🌐 <b style="color:#ff6600">ale-tv.vercel.app</b></p>
<a href="/" style="color:#ff6600;text-decoration:none;margin-top:10px;display:block">→ Rudi Homepage</a>
</div>

</div></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore, collection, addDoc, serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {getStorage, ref, uploadBytesResumable, getDownloadURL} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

const firebaseConfig = {
  apiKey: "WEKA API KEY YAKO HAPA",
  authDomain: "aletv-xxxx.firebaseapp.com",
  projectId: "aletv-xxxx",
  storageBucket: "aletv-xxxx.appspot.com",
  messagingSenderId: "123",
  appId: "1:123:web:xxx"
};
const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const storage=getStorage(app);

window.login=()=>{
 if(document.getElementById('pass').value==='0703182307'){
  document.getElementById('login').style.display='none';
  document.getElementById('panel').style.display='block';
 } else alert('Password: 0703182307');
};

// YOUTUBE
document.getElementById('ytBtn').onclick=async()=>{
 const title=document.getElementById('title').value;
 const cat=document.getElementById('cat').value;
 let yt=document.getElementById('ytLink').value.trim();
 if(!title||!yt) return alert('Weka title na YouTube link!');
 let id='';
 if(yt.includes('v=')) id=yt.split('v=')[1].split('&')[0];
 else if(yt.includes('youtu.be/')) id=yt.split('youtu.be/')[1].split('?')[0];
 else id=yt;
 const embed=`https://www.youtube.com/embed/${id}`;
 await addDoc(collection(db,'videos'),{title,category:cat,videoUrl:embed,type:'youtube',createdAt:serverTimestamp()});
 alert('✅ YouTube Iko LIVE kwenye ALE TV!');
 location.reload();
};

// FILE
document.getElementById('upBtn').onclick=()=>{
 const title=document.getElementById('title').value;
 const cat=document.getElementById('cat').value;
 const file=document.getElementById('file').files[0];
 if(!title||!file) return alert('Weka title na file!');
 const st=document.getElementById('status');
 const storageRef=ref(storage,'videos/'+Date.now()+'_'+file.name);
 const task=uploadBytesResumable(storageRef,file);
 task.on('state_changed', s=>{
  const p=(s.bytesTransferred/s.totalBytes)*100;
  document.getElementById('prog').style.width=p+'%';
  st.innerText='Uploading '+Math.round(p)+'%';
 }, e=>alert(e.message), async()=>{
  const url=await getDownloadURL(task.snapshot.ref);
  await addDoc(collection(db,'videos'),{title,category:cat,videoUrl:url,type:'file',createdAt:serverTimestamp()});
  st.innerText='✅ Ime-upload LIVE!';
  alert('Video Iko LIVE!');
 });
};
</script>
</body></html>
