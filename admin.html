<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALE ADMIN</title>
<script src="https://cdn.tailwindcss.com"></script>
</head><body class="bg-[#f8fafc] text-slate-900 p-4">
<div class="max-w-2xl mx-auto">

<div class="flex justify-between items-center mb-6 bg-gradient-to-r from-indigo-600 to-violet-600 rounded-2xl p-4 text-white">
<div><h1 class="text-xl font-black">ALE TV ADMIN</h1><p class="text-[10px] opacity-80">AUTO MODE - COLOR MPYA</p></div>
<a href="/" target="_blank" class="bg-white text-indigo-600 px-5 py-2.5 rounded-full text-xs font-black">📺 ONA TV</a>
</div>

<div class="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm">
<label class="text-[11px] font-bold text-indigo-600">YOUTUBE LINK * - WEKA LINK TITLE NA DESC ZITAJAZA AUTO</label>
<input id="link" placeholder="https://youtube.com/watch?v=..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm mt-2 outline-none focus:border-indigo-500 focus:bg-white">
<div id="idShow" class="text-[11px] text-slate-500 mt-2 flex items-center gap-2">ID: -</div>

<input id="title" placeholder="Title (itajaza auto)" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm mt-4 outline-none focus:border-indigo-500">
<select id="cat" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm mt-3"><option>BURUDANI</option><option>MUZIKI</option><option>HABARI</option><option>MAHUBIRI</option><option>MICHEZO</option></select>
<textarea id="desc" rows="4" placeholder="Description (itajaza auto kutoka YouTube)" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm mt-3 outline-none focus:border-indigo-500"></textarea>

<button onclick="add()" class="w-full bg-gradient-to-r from-indigo-600 to-violet-600 text-white font-black py-3.5 rounded-xl mt-5 text-sm shadow-lg">HIFADHI VIDEO</button>
<p id="msg" class="text-xs text-center mt-3"></p>
</div>

<div class="bg-white border border-slate-200 rounded-2xl p-4 mt-4 flex justify-between items-center shadow-sm">
<span id="liveSt" class="text-xs text-slate-600">Hakuna LIVE</span><div class="flex gap-2"><a href="/" target="_blank" class="bg-slate-900 text-white px-3 py-1.5 rounded-full text-[10px] font-bold">ONA LIVE</a><button onclick="stopL()" class="bg-slate-100 px-3 py-1.5 rounded-full text-xs">Stop</button></div>
</div>

<div class="bg-white border border-slate-200 rounded-2xl p-4 mt-4 shadow-sm">
<h2 class="text-xs font-bold text-slate-500">PLAYLIST (<span id="cnt">0</span>)</h2><div id="list" class="mt-3 space-y-2"></div>
</div>
</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";import{getDatabase,ref,push,set,onValue,remove}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
const db=getDatabase(initializeApp({apiKey:"AIzaSyDuf-Is10hDtjNJU7hzDqJmLT2czSXzODg",authDomain:"ale-tv.firebaseapp.com",databaseURL:"https://ale-tv-default-rtdb.firebaseio.com",projectId:"ale-tv"}));
let vids=[];
const getId=u=>{let m=u.match(/(?:v=|youtu.be\/|shorts\/|embed\/)([a-zA-Z0-9_-]{11})/);return m?m[1]:/^[a-zA-Z0-9_-]{11}$/.test(u)?u:null;}

window.autoFetch=async(id)=>{
 try{
  document.getElementById('idShow').innerHTML=`<span class="animate-pulse">⏳ Inatafuta Title...</span>`;
  let res=await fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${id}&format=json`);
  let data=await res.json();
  document.getElementById('title').value=data.title;
  document.getElementById('desc').value=`${data.title}\n\nChannel: ${data.author_name}\n\nOfficial Video from YouTube - ${data.title}`;
  document.getElementById('idShow').innerHTML=`✅ <b>${data.title}</b> - ID: ${id}`;
  document.getElementById('msg').innerText='✅ Title na Description zimejazwa auto!';
  document.getElementById('msg').className='text-xs text-center mt-3 text-green-600';
 }catch{
  document.getElementById('idShow').innerText=`ID: ${id} - (Title auto imeshindwa, andika manual)`;
 }
}

document.getElementById('link').addEventListener('input',e=>{
 let id=getId(e.target.value.trim());
 if(id && id.length===11){ autoFetch(id); }
});

window.add=async()=>{
 let id=getId(document.getElementById('link').value.trim());
 let t=document.getElementById('title').value.trim();
 let c=document.getElementById('cat').value;
 let d=document.getElementById('desc').value.trim();
 if(!id){document.getElementById('msg').innerText='❌ Link si sahihi';return;}
 if(t.length<3){document.getElementById('msg').innerText='❌ Title bado tupu';return;}
 if(d.length<5){document.getElementById('msg').innerText='❌ Description bado tupu';return;}
 document.getElementById('msg').innerText='⏳ Inahifadhi...';
 await push(ref(db,'videos'),{videoId:id,title:t,cat:c,desc:d,createdAt:Date.now()});
 document.getElementById('msg').innerText='✅ Imehifadhi na itaonekana TV';
 document.getElementById('link').value='';document.getElementById('title').value='';document.getElementById('desc').value='';document.getElementById('idShow').innerText='ID: -';
}
onValue(ref(db,'videos'),s=>{
 let data=s.val();let el=document.getElementById('list');el.innerHTML='';
 if(!data){vids=[];document.getElementById('cnt').innerText=0;return;}
 vids=Object.entries(data).map(([k,v])=>({k,...v})).sort((a,b)=>a.createdAt-b.createdAt);
 document.getElementById('cnt').innerText=vids.length;
 vids.forEach(v=>{
  el.innerHTML+=`<div class="bg-slate-50 border border-slate-200 rounded-xl p-2 flex gap-2 items-center"><img src="https://img.youtube.com/vi/${v.videoId}/mqdefault.jpg" class="w-14 h-9 rounded object-cover"><div class="flex-1 truncate"><b class="text-xs block truncate text-slate-800">${v.title}</b><small class="text-[9px] text-slate-500">${v.cat}</small></div><button onclick="go('${v.k}')" class="bg-indigo-600 text-white px-3 py-1 rounded-full text-[10px] font-bold">LIVE</button><button onclick="del('${v.k}')" class="bg-slate-200 px-2 py-1 rounded-full text-[10px]">X</button></div>`;
 });
});
window.go=async k=>{let v=vids.find(x=>x.k===k);await set(ref(db,'live'),{videoId:v.videoId,title:v.title,cat:v.cat,desc:v.desc,startAt:Date.now(),isLiveNow:true});window.open('/','_blank');}
window.del=async k=>{if(confirm('Futa?'))await remove(ref(db,'videos/'+k));}
window.stopL=async()=>{await remove(ref(db,'live'));}
onValue(ref(db,'live'),s=>{let v=s.val();document.getElementById('liveSt').innerText=v?`🔴 LIVE: ${v.title}`:'Hakuna LIVE';});
</script></body></html>
