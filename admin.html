<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ALE ADMIN DASHBOARD</title><style>
*{box-sizing:border-box;margin:0;padding:0}body{background:#0a0a0a;color:#fff;font-family:Arial}
.header{background:linear-gradient(90deg,#ff8c00,#ffae42);color:#000;padding:12px 14px;font-weight:900;display:flex;justify-content:space-between;align-items:center}
.tabs{display:flex;gap:6px;padding:8px;background:#111;position:sticky;top:0;z-index:10}
.tab{flex:1;padding:10px;text-align:center;background:#222;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer}
.tab.active{background:#ff8c00;color:#000}
.panel{display:none;padding:10px}.panel.active{display:block}
.tvPreview{border:3px solid #ff8c00;border-radius:12px;overflow:hidden;height:200px;background:#000;position:relative}
.tvPreview iframe,.tvPreview video{width:100%;height:100%;border:0}
.liveBtn{padding:4px 8px;border-radius:5px;font-size:10px;font-weight:900;position:absolute;top:6px;left:6px;z-index:2}
input,textarea,select{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #333;background:#161616;color:#fff}
button{padding:12px;border-radius:10px;border:0;font-weight:900;cursor:pointer}
.btnOrange{background:#ff8c00;color:#000;width:100%;margin-top:8px}
.btnDark{background:#222;color:#fff}
.card{background:#161616;border:1px solid #222;border-radius:10px;padding:10px;margin:8px 0;display:flex;gap:10px;align-items:center}
.thumb{width:70px;height:45px;background:#000;border-radius:6px;overflow:hidden;flex-shrink:0}
.thumb img{width:100%;height:100%;object-fit:cover}
.small{font-size:11px;color:#888}
</style></head><body>
<div class="header"><span>ALE ADMIN</span><span style="background:#000;color:#ff8c00;padding:4px 10px;border-radius:20px;font-size:11px" id="status">OFFLINE</span></div>

<div class="tabs">
<div class="tab active" onclick="openTab('dash',this)">DASHBOARD + TV</div>
<div class="tab" onclick="openTab('playlist',this)">PLAYLIST</div>
<div class="tab" onclick="openTab('settings',this)">SETTINGS</div>
</div>

<!-- DASHBOARD -->
<div id="dash" class="panel active">
<div class="tvPreview" id="tvBox"><span class="liveBtn" style="background:red;color:#fff">● PREVIEW</span><div id="preview" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#444">TV Preview</div></div>

<div style="margin-top:10px;background:#111;padding:10px;border-radius:10px">
<label style="font-size:12px;color:#ff8c00;font-weight:900">1. WEKA LINK (YouTube au Facebook Live)</label>
<input id="link" placeholder="https://youtu.be/xxxx au https://facebook.com/.../videos/..." oninput="autoFetch()">
<div id="autoInfo" class="small" style="margin:4px 0;color:#0f0"></div>
<input id="title" placeholder="Title - itajazwa auto">
<textarea id="desc" placeholder="Description - itajazwa auto" rows="2"></textarea>
<select id="cat"><option>Burudani</option><option>Habari</option><option>Muziki</option><option>Live</option><option>Michezo</option></select>

<div style="display:flex;gap:6px;margin-top:8px">
<button class="btnOrange" style="flex:1" onclick="goLive(false)">▶ PLAY VIDEO</button>
<button class="btnOrange" style="flex:1;background:#e60000;color:#fff" onclick="goLive(true)">● GO LIVE (YouTube/FB Live)</button>
</div>
<button class="btnDark" style="width:100%;margin-top:6px" onclick="stopLive()">⏹ STOP</button>
</div>

<div id="nowPlaying" style="margin-top:10px"></div>
</div>

<!-- PLAYLIST -->
<div id="playlist" class="panel"><div id="list"></div></div>

<!-- SETTINGS -->
<div id="settings" class="panel">
<div style="background:#111;padding:10px;border-radius:10px">
<label class="small">TV Name</label><input id="sName" value="ALE TV HD">
<label class="small">Ticker Text (inascroll chini)</label><textarea id="sTicker" rows="3">ALE TV HD - BURUDANI NON-STOP 24/7 - WATU WOTE WANAONA VIDEO MOJA</textarea>
<label class="small">Allow Facebook Live Links</label><select id="sFb"><option value="yes">YES - Ruhusu FB Live</option><option value="no">NO</option></select>
<button class="btnOrange" onclick="saveSettings()">SAVE SETTINGS</button>
</div>
</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";import{getDatabase,ref,push,set,onValue,remove,update}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
const db=getDatabase(initializeApp({apiKey:"AIzaSyDuf-Is10hDtjNJU7hzDqJmLT2czSXzODg",authDomain:"ale-tv.firebaseapp.com",databaseURL:"https://ale-tv-default-rtdb.firebaseio.com",projectId:"ale-tv"}));

window.openTab=(id,el)=>{document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active')); document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); document.getElementById(id).classList.add('active'); el.classList.add('active');}

function getYTId(u){let m=u.match(/(?:youtu\.be\/|v=|embed\/|watch\?v=)([a-zA-Z0-9_-]{11})/); return m?m[1]:null;}
function isFb(u){return u.includes('facebook.com')||u.includes('fb.watch');}

window.autoFetch=async()=>{
 let url=document.getElementById('link').value.trim(); if(!url) return;
 let id=getYTId(url);
 let info=document.getElementById('autoInfo');
 if(id){
   info.innerText='⏳ Inatafuta description kutoka YouTube...';
   try{
     let res=await fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${id}&format=json`);
     let data=await res.json();
     document.getElementById('title').value=data.title||'';
     document.getElementById('desc').value=`${data.title} - ${data.author_name} | ALE TV HD`;
     info.innerText=`✅ Imeauto: ${data.title.substring(0,40)}...`;
     document.getElementById('preview').innerHTML=`<img src="https://i.ytimg.com/vi/${id}/hqdefault.jpg" style="width:100%;height:100%;object-fit:cover">`;
   }catch{info.innerText='⚠️ Imefail auto, weka title mwenyewe'; document.getElementById('title').value='ALE TV - '+id;}
 }else if(isFb(url)){
   info.innerText='✅ Facebook Live link detected - itacheza kama FB';
   document.getElementById('title').value='Facebook Live - ALE TV';
   document.getElementById('preview').innerHTML=`<div style="padding:40px;text-align:center">FB LIVE PREVIEW<br><small>${url.substring(0,30)}</small></div>`;
 }
}

window.goLive=async(isLiveNow)=>{
 let url=document.getElementById('link').value.trim(); if(!url) return alert('Weka link');
 let id=getYTId(url); let title=document.getElementById('title').value||'ALE TV'; let desc=document.getElementById('desc').value||''; let cat=document.getElementById('cat').value;
 let payload={title,desc,cat,url,startAt:Date.now(),isLiveNow:!!isLiveNow,type:isFb(url)?'facebook':'youtube',videoId:id||''};
 await set(ref(db,'live'),payload);
 // pia weka playlist
 await set(push(ref(db,'videos')),{...payload,createdAt:Date.now()});
 alert(isLiveNow?'🔴 LIVE IMEANZA! Watu wote wanaona sasa':'▶ VIDEO IMETUMWA LIVE!');
}

window.stopLive=async()=>{await remove(ref(db,'live')); alert('⏹ TV imesimama'); document.getElementById('status').innerText='OFFLINE';}

window.saveSettings=async()=>{await set(ref(db,'settings'),{name:document.getElementById('sName').value,ticker:document.getElementById('sTicker').value,allowFb:document.getElementById('sFb').value}); alert('Settings saved');}

onValue(ref(db,'live'),s=>{
 let v=s.val(); document.getElementById('status').innerText=v?'● LIVE ON AIR':'OFFLINE'; document.getElementById('status').style.background=v?'red':'#000'; document.getElementById('status').style.color=v?'#fff':'#ff8c00';
 if(v){document.getElementById('nowPlaying').innerHTML=`<div class="card"><div class="thumb"><img src="${v.videoId?'https://i.ytimg.com/vi/'+v.videoId+'/hqdefault.jpg':''}"></div><div><b>${v.title}</b><br><span class="small">${v.isLiveNow?'🔴 LIVE':'▶ PLAYING'} • ${v.cat}</span></div></div>`;
   document.getElementById('preview').innerHTML=v.type==='facebook'?`<div style="padding:20px;text-align:center">FB LIVE ON AIR</div>`:`<iframe src="https://www.youtube.com/embed/${v.videoId}?autoplay=1&mute=1&controls=0" style="width:100%;height:100%;border:0"></iframe>`;
 }
});

onValue(ref(db,'videos'),s=>{
 let d=s.val(); if(!d){document.getElementById('list').innerHTML='<p style="text-align:center;color:#555;padding:20px">Hakuna videos</p>';return;}
 let html=''; Object.entries(d).sort((a,b)=>b[1].createdAt-a[1].createdAt).forEach(([k,v])=>{
   html+=`<div class="card"><div class="thumb"><img src="${v.videoId?'https://i.ytimg.com/vi/'+v.videoId+'/hqdefault.jpg':'https://via.placeholder.com/70x45?text=FB'}"></div><div style="flex:1"><b style="font-size:13px">${v.title}</b><br><span class="small">${v.cat} • ${v.isLiveNow?'LIVE':'VIDEO'}</span></div><button onclick="reLive('${k}')" style="background:#ff8c00;color:#000;padding:6px 10px;border-radius:6px;border:0;font-size:11px">LIVE</button><button onclick="delV('${k}')" style="background:red;color:#fff;padding:6px 10px;border-radius:6px;border:0;margin-left:4px">X</button></div>`;
 }); document.getElementById('list').innerHTML=html;
});

window.reLive=async(k)=>{let snap=await new Promise(r=>onValue(ref(db,'videos/'+k),s=>r(s.val()),{onlyOnce:true})); if(snap){await set(ref(db,'live'),{...snap,startAt:Date.now()}); alert('Imerudishwa LIVE');}}
window.delV=async(k)=>{if(confirm('Futa?')) await remove(ref(db,'videos/'+k));}

onValue(ref(db,'settings'),s=>{let d=s.val(); if(d){document.getElementById('sName').value=d.name||''; document.getElementById('sTicker').value=d.ticker||'';}})
</script></body></html>
