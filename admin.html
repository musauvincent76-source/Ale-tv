<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALE TV ADMIN</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{background:#0f0f0f;font-family:Inter,Arial}.card{background:#18181b;border:1px solid #27272a}</style>
</head><body class="text-white min-h-screen p-4">
<div class="max-w-3xl mx-auto">

<div class="flex justify-between items-center mb-6">
<h1 class="font-black text-xl">ALE <span class="text-orange-500">TV</span> <span class="text-xs font-normal text-zinc-500 ml-2">ADMIN MINIMAL</span></h1>
<a href="/" target="_blank" class="bg-white text-black px-4 py-2 rounded-full text-xs font-bold">ONA TV →</a>
</div>

<!-- FORM -->
<div class="card rounded-2xl p-5 mb-5">
<h2 class="text-xs font-bold tracking-widest text-zinc-400 mb-4">WEKA VIDEO MPYA</h2>

<label class="text-[10px] text-zinc-500 font-bold">YOUTUBE LINK *</label>
<input id="link" placeholder="https://youtube.com/watch?v=..." class="w-full bg-black border border-zinc-800 rounded-xl px-4 py-3 text-sm mt-1 outline-none focus:border-white" oninput="check()">
<div id="preview" class="text-[10px] mt-2 text-zinc-600">ID: bado</div>

<div class="grid grid-cols-2 gap-3 mt-4">
<div><label class="text-[10px] text-zinc-500 font-bold">TITLE *</label><input id="title" placeholder="Jina la video" class="w-full bg-black border border-zinc-800 rounded-xl px-3 py-3 text-sm mt-1 outline-none focus:border-white"></div>
<div><label class="text-[10px] text-zinc-500 font-bold">CATEGORY</label><select id="cat" class="w-full bg-black border border-zinc-800 rounded-xl px-3 py-3 text-sm mt-1 outline-none"><option>BURUDANI</option><option>MUZIKI</option><option>HABARI</option><option>MAHUBIRI</option></select></div>
</div>

<label class="text-[10px] text-zinc-500 font-bold mt-4 block">DESCRIPTION * (hii ndio inaondoa Mama Africa)</label>
<textarea id="desc" rows="3" placeholder="Maelezo kamili..." class="w-full bg-black border border-zinc-800 rounded-xl px-4 py-3 text-sm mt-1 outline-none focus:border-white"></textarea>

<button onclick="save()" class="w-full bg-white text-black font-black py-3 rounded-xl text-sm mt-5 hover:bg-zinc-200">HIFADHI VIDEO</button>
<p id="msg" class="text-xs text-center mt-3"></p>
</div>

<!-- LIVE -->
<div class="card rounded-2xl p-4 mb-5 flex justify-between items-center">
<div><p class="text-[10px] text-zinc-500 font-bold tracking-widest">LIVE STATUS</p><p id="liveNow" class="text-xs mt-1 text-zinc-400">Hakuna LIVE</p></div>
<button onclick="stopLive()" class="bg-zinc-800 px-4 py-2 rounded-full text-xs">Stop Live</button>
</div>

<!-- LIST -->
<div class="card rounded-2xl p-5">
<h2 class="text-xs font-bold tracking-widest text-zinc-400 mb-3">PLAYLIST (<span id="count">0</span>)</h2>
<div id="list" class="space-y-2"></div>
</div>

</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";import{getDatabase,ref,push,set,onValue,remove}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
const db=getDatabase(initializeApp({apiKey:"AIzaSyDuf-Is10hDtjNJU7hzDqJmLT2czSXzODg",authDomain:"ale-tv.firebaseapp.com",databaseURL:"https://ale-tv-default-rtdb.firebaseio.com",projectId:"ale-tv"}));
let videos=[];

function getId(url){
 let m=url.match(/(?:v=|youtu\.be\/|shorts\/|embed\/)([a-zA-Z0-9_-]{11})/);
 if(m) return m[1];
 if(/^[a-zA-Z0-9_-]{11}$/.test(url)) return url;
 return null;
}
window.check=()=>{
 let id=getId(document.getElementById('link').value);
 document.getElementById('preview').innerText=id?`✅ ID: ${id} - Sawa`:`❌ Link si sahihi`;
 document.getElementById('preview').className=id?'text-[10px] mt-2 text-green-400':'text-[10px] mt-2 text-red-400';
 return id;
}
window.save=async()=>{
 let videoId=check();
 let title=document.getElementById('title').value.trim();
 let cat=document.getElementById('cat').value;
 let desc=document.getElementById('desc').value.trim();
 if(!videoId){ document.getElementById('msg').innerText='❌ Weka link sahihi'; return; }
 if(title.length<3){ document.getElementById('msg').innerText='❌ Title lazima'; return; }
 if(desc.length<5){ document.getElementById('msg').innerText='❌ Description lazima uandike'; return; }
 document.getElementById('msg').innerText='⏳ Inahifadhi...';
 await push(ref(db,'videos'),{videoId,title,cat,desc,createdAt:Date.now()});
 document.getElementById('msg').innerText='✅ Imehifadhi!';
 document.getElementById('link').value='';document.getElementById('title').value='';document.getElementById('desc').value='';
}

onValue(ref(db,'videos'),s=>{
 let d=s.val(); let el=document.getElementById('list'); el.innerHTML='';
 if(!d){ videos=[]; document.getElementById('count').innerText=0; el.innerHTML='<p class="text-xs text-zinc-600 text-center py-4">Hakuna video</p>'; return; }
 videos=Object.entries(d).map(([k,v])=>({k,...v})).sort((a,b)=>a.createdAt-b.createdAt);
 document.getElementById('count').innerText=videos.length;
 videos.forEach(v=>{
  el.innerHTML+=`<div class="bg-black border border-zinc-800 rounded-xl p-3 flex gap-3 items-center">
  <img src="https://img.youtube.com/vi/${v.videoId}/mqdefault.jpg" class="w-16 h-10 object-cover rounded bg-zinc-900">
  <div class="flex-1 overflow-hidden"><b class="text-xs truncate block">${v.title}</b><small class="text-[10px] text-zinc-500">${v.cat}</small></div>
  <button onclick="live('${v.k}')" class="bg-white text-black px-3 py-1.5 rounded-full text-[10px] font-bold">LIVE</button>
  <button onclick="delV('${v.k}')" class="bg-zinc-800 px-2 py-1.5 rounded-full text-[10px]">X</button>
  </div>`;
 });
});
window.live=async(k)=>{
 let v=videos.find(x=>x.k===k); await set(ref(db,'live'),{videoId:v.videoId,title:v.title,cat:v.cat,desc:v.desc,startAt:Date.now(),isLiveNow:true});
 alert('LIVE imeanza');
}
window.delV=async(k)=>{ if(confirm('Futa?')) await remove(ref(db,'videos/'+k)); }
window.stopLive=async()=>{ await remove(ref(db,'live')); }
onValue(ref(db,'live'),s=>{
 let v=s.val(); document.getElementById('liveNow').innerText=v?`🔴 ${v.title}`:'Hakuna LIVE';
});
</script></body></html>
