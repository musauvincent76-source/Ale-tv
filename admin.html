<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALE TV ADMIN</title>
<style>
body{margin:0;background:#111;color:#fff;font-family:sans-serif;padding:15px}
h2{color:#f59e0b;text-align:center}
.card{background:#1a1a1a;padding:15px;border-radius:10px;margin-bottom:15px;border:1px solid #333}
input,select,textarea{width:100%;padding:10px;margin:6px 0;background:#000;color:#fff;border:1px solid #444;border-radius:6px;box-sizing:border-box}
button{width:100%;padding:12px;background:#f59e0b;color:#000;font-weight:900;border:0;border-radius:6px;cursor:pointer;margin-top:8px}
button:hover{background:#ffb84d}
.live-check{display:flex;align-items:center;gap:8px;background:#000;padding:8px;border-radius:6px;margin:6px 0;border:1px solid #444}
.live-check input{width:auto}
.video-item{background:#000;padding:10px;border-radius:6px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;border-left:3px solid #f59e0b}
.del{width:auto;background:red;color:#fff;padding:6px 12px}
.ticker-box{background:#1a1a1a;padding:12px;border-radius:8px;border:1px solid #b80000}
.ona-btn{display:block;text-align:center;background:#00ff88;color:#000;padding:14px;border-radius:8px;font-weight:900;text-decoration:none;margin-bottom:15px;font-size:16px}
</style></head><body>
<h2>🔥 ALE TV ADMIN 🔥</h2>
<a href="index.html" target="_blank" class="ona-btn">📺 ONA TV LIVE</a>
<div class="card">
<h3 style="margin-top:0">➕ Weka Video / Live</h3>
<input id="ytLink" placeholder="Weka YouTube Link au ID">
<input id="vTitle" placeholder="Title - itajaza auto kama huiandiki">
<select id="vCat"><option>LIVE</option><option>HABARI</option><option>BURUDANI</option><option>MICHEZO</option><option>DINI</option><option>ELIMU</option></select>
<textarea id="vDesc" placeholder="Description"></textarea>
<div class="live-check"><input type="checkbox" id="isLive"><label for="isLive">🔴 Hii ni YouTube LIVE?</label></div>
<button onclick="addVideo()">💾 HIFADHI VIDEO</button>
</div>
<div class="ticker-box">
<h3 style="margin-top:0;color:#ff4444">📢 Ticker ya Chini</h3>
<input id="tickerText" placeholder="Andika habari ya ticker...">
<button onclick="updateTicker()" style="background:#b80000;color:#fff">🔄 BADILISHA TICKER</button>
</div>
<div class="card"><h3>📺 Video Zilizopo (<span id="count">0</span>)</h3><div id="list">Inapakia...</div></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {getDatabase,ref,push,onValue,remove,update} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
const cfg={apiKey:"AIzaSyDuf-Is10hDtjNJU7hzDqJmLT2czSXzODg",authDomain:"ale-tv.firebaseapp.com",databaseURL:"https://ale-tv-default-rtdb.firebaseio.com",projectId:"ale-tv",storageBucket:"ale-tv.firebasestorage.app",messagingSenderId:"548271956392",appId:"1:548271956392:web:6993343a96da96f7757d9d"};
const app=initializeApp(cfg);const db=getDatabase(app);
function getId(url){
 if(!url)return null; url=url.trim();
 if(url.length==11 &&!url.includes('/'))return url;
 try{let u=new URL(url); if(u.searchParams.get('v'))return u.searchParams.get('v'); if(u.pathname.includes('/live/'))return u.pathname.split('/live/')[1].split('?')[0]; if(u.pathname.includes('/shorts/'))return u.pathname.split('/shorts/')[1].split('?')[0]; let p=u.pathname.split('/').filter(x=>x);return p[p.length-1];}catch(e){return url.split('/').pop().split('?')[0];}
}
window.addVideo=async()=>{
 let link=document.getElementById('ytLink').value; let id=getId(link);
 if(!id||id.length<6)return alert('Weka Link sahihi!');
 let title=document.getElementById('vTitle').value;
 let cat=document.getElementById('vCat').value;
 let desc=document.getElementById('vDesc').value||'';
 let isLive=document.getElementById('isLive').checked;
 if(!title){
  try{let r=await fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${id}`);let j=await r.json();title=j.title||'ALE TV Video';}catch{title='ALE TV Video';}
 }
 await push(ref(db,'videos'),{id,title,cat,desc,isLive,created:Date.now()});
 alert('✅ Imehifadhiwa! '+title);
 document.getElementById('ytLink').value='';document.getElementById('vTitle').value='';document.getElementById('vDesc').value='';document.getElementById('isLive').checked=false;
}
window.updateTicker=async()=>{let t=document.getElementById('tickerText').value; if(!t)return alert('Andika ticker!'); await update(ref(db,'ticker'),{text:t}); alert('Ticker imebadilika!');}
window.deleteVideo=async(key)=>{if(!confirm('Futa hii video?'))return; await remove(ref(db,'videos/'+key));}
onValue(ref(db,'videos'),snap=>{
 let data=snap.val(); let list=document.getElementById('list'); let count=document.getElementById('count');
 if(!data){list.innerHTML='Hakuna video';count.innerText='0';return;}
 let keys=Object.keys(data).reverse(); count.innerText=keys.length; let html='';
 keys.forEach(k=>{let v=data[k]; html+=`<div class="video-item"><div><b>${v.title}</b><br><small style="color:#f59e0b">${v.cat} ${v.isLive?'🔴 LIVE':''}</small><br><small style="color:#ccc">${(v.desc||'').substring(0,60)}</small><br><small style="color:#888">${v.id}</small></div><button class="del" onclick="deleteVideo('${k}')">Futa</button></div>`;});
 list.innerHTML=html;
});
onValue(ref(db,'ticker'),snap=>{let d=snap.val(); if(d&&d.text)document.getElementById('tickerText').value=d.text;});
</script></body></html>
