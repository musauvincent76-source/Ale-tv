<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MTAANI ADMIN</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:Arial;padding:12px}
.box{background:#111;padding:12px;border-radius:15px;border:1px solid #222}
#chat{height:400px;overflow-y:auto;padding:10px;background:#000;border-radius:10px}
input{width:65%;padding:12px;border-radius:25px;border:none;outline:none;background:#222;color:#fff}
button.send{width:30%;padding:12px;border-radius:25px;background:#25D366;color:#fff;border:none;font-weight:bold}
.dots span{display:inline-block;width:7px;height:7px;background:#25D366;border-radius:50%;margin:0 2px;animation:dunda 1.2s infinite}
.dots span:nth-child(2){animation-delay:0.2s} .dots span:nth-child(3){animation-delay:0.4s}
@keyframes dunda{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-7px)}}
.wa-btn{background:#25D366;border:none;padding:7px 14px;border-radius:20px;color:#fff;margin-top:8px;font-weight:bold}
</style>
</head>
<body>

<h2 style="text-align:center;color:#ffcc00">🔥 MTAANI ADMIN 🔥</h2>

<div class="box">
<div id="chat"></div>
<div style="display:flex;gap:8px;margin-top:12px">
<input id="input" placeholder="Andika hapa...">
<button class="send" onclick="jibu()">TUMA</
