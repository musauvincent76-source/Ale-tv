<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALE TV ADMIN</title>
<style>
body{margin:0;background:#111;color:#fff;font-family:sans-serif;padding:12px}
h2{color:#f59e0b;text-align:center}
.card{background:#1a1a1a;padding:12px;border-radius:10px;margin:10px 0;border:1px solid #333}
input,select,textarea{width:100%;padding:10px;margin:6px 0;background:#000;color:#fff;border:1px solid #444;border-radius:6px}
button{padding:10px 15px;border:none;border-radius:6px;font-weight:bold;cursor:pointer;margin:3px}
.btn-add{background:#f59e0b;color:#000;width:100%;padding:14px;font-size:15px}
.btn-del{background:#ff0000;color:#fff}
.btn-ticker{background:#00ff88;color:#000;width:100%}
.btn-tv{background:#ff6600;color:#fff;width:100%;padding:16px;font-size:16px;margin-top:8px;border-radius:8px;box-shadow:0 0 15px rgba(255,102,0,.5)}
.list-item{background:#222;padding:8px;border-radius:6px;margin:5px 0;display:flex;justify-content:space-between;align-items:center}
.stats{display:flex;gap:10px;text-align:center}.stats div{background:#222;flex:1;padding:10px;border-radius:8px}.stats b{color:#f59e0b;font-size:18px;display:block}
</style></head><body>
<h2>🔥 ALE TV ADMIN PANEL 🔥</h2>
<div class="stats"><div><b id="totalV">0</b>Videos</div><div><b>LIVE</b>TV</div><div><b id="time">00:00</b>Time</div></div>

<div class="card" style="border:2px solid #ff6600">
<button class="btn-tv" onclick="location.href='index.html'">📺 ONA TV SASA - JUU</button>
<button class="btn-tv" style="background:#222;border:1px solid #ff6600;color:#ff6600" onclick="window.open('index.html','_blank')">📺 Fungua Tab Mpya</button>
</div>

<div class="card">
<h3>➕ Weka Video Mpya</h3>
<input id="ytLink" placeholder="Weka YouTube Link" onpaste="setTimeout(autoDesc,200)" oninput="autoDesc()">
<input id="vTitle" placeholder="Title - itajaza auto">
<textarea id="vDesc" placeholder="Description - hii ndio ita-scroll kwa TV"></textarea>
<select id="vCat"><option>BURUDANI</option><option>HABARI</option><option>MICHEZO</option><option>DINI</option><option>ELIMU</option><option>MZIKI</option><option>OUTDOOR</option></select>
<button class="btn-add" onclick="addVideo()">💾 SAVE VIDEO</button>
<p id="autoInfo" style="font-size:11px;color:#00ff88"></p>
</div>

<div class="card">
<h3>📢 Ticker</h3>
<input id="tickerCustom" placeholder="Habari ya chini itakayo-scroll...">
<button class="btn-ticker" onclick="saveTicker()">🔄 UPDATE TICKER</button>
<p style="font-size:11px;color:#888">Current: <span id="curTicker" style="color:#f59e0b">-</span></p>
</div>

<div class="card"><h3>📋 Videos (<span id="count">0</span>)</h3><div id="list"></div><button onclick="clearAll()" style="background:#333;color:#fff;width:100%;margin-top:10px">🗑️ Futa Zote</button></div>

<!-- BATONI YA MWISHO KABISA -->
<div class="card" style="border:2px solid #00ff88;background:#001a0a">
<button class="btn-tv" style="background:#00ff88;color:#000;font-size:18px;padding:18px" onclick="window.open('index.html','_blank')">📺 ONA TV - BATONI YA MWISHO</button>
<p style="text-align:center;font-size:11px;color:#00ff88;margin-top:8px">Bonyeza hapa kuona TV live!</p>
</div>

<script>
function getV(){return JSON.parse(localStorage.getItem('ale_videos')||'[]')}
function saveV(v){localStorage.setItem('ale_videos',JSON.stringify(v));if(v.length){let l=v[v.length-1];localStorage.setItem('ale_tv_id',l.id);localStorage.setItem('aletv_live_now',JSON.stringify({ytid:l.id,title:l.title,desc:l.desc,cat:l.cat}));localStorage.setItem('ale_ticker_final',l.desc+' • '+(localStorage.getItem('ale_ticker_custom')||'TILL 3624692 - ALE FOOTBALL ACADEMY'))}}
