<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALE TV - ADMIN</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:sans-serif;padding:15px}
.top{border-bottom:2px solid #f59e0b;padding-bottom:10px;margin-bottom:15px;display:flex;justify-content:space-between;align-items:center}
.logo{color:#f59e0b;font-weight:900;font-size:20px}
.card{background:#111;border:1px solid #222;border-radius:10px;padding:12px;margin-bottom:12px}
label{color:#f59e0b;font-size:12px;font-weight:bold;display:block;margin:10px 0 4px}
input,textarea,select{width:100%;padding:12px;border-radius:8px;border:1px solid #333;background:#1a1a1a;color:#fff}
button{width:100%;padding:13px;border:0;border-radius:8px;font-weight:900;margin-top:10px;cursor:pointer}
.btn-gold{background:#f59e0b;color:#000}
.btn-dark{background:#222;color:#fff;border:1px solid #333}
.small{font-size:11px;color:#888;margin-top:4px}
.live{border-left:4px solid #ff0000}
.item{background:#1a1a1a;padding:8px;border-radius:6px;margin:6px 0;font-size:13px;display:flex;justify-content:space-between;align-items:center}
</style>
</head><body>
<div class="top"><div class="logo">🔥 ALE TV ADMIN</div><div id="status" style="font-size:12px;color:#0f0">● Connected</div></div>

<div class="card live">
<b style="color:#ff0000">● LIVE SASA</b>
<div id="nowPlaying" style="margin-top:6px">Inapakia...</div>
</div>

<div class="card">
<label>📺 YouTube Link au ID</label>
<input id="yt" placeholder="https://youtu.be/xxxxx au ID">
<label>📌 Title</label>
<input id="title" placeholder="TAARIFA YA HABARI">
<label>📂 Category</label>
<select id="cat"><option>LIVE</option><option>HABARI</option><option>BURUDANI</option><option>MICHEZO</option><option>DINI</option><option>ELIMU</option></select>
<label>📝 Description</label>
<textarea id="desc" placeholder="Maelezo..."></textarea>
<button class="btn-gold" onclick="wekaVideo()">🔥 WEKA LIVE SASA</button>
<div class="small">Hii ndio iliyokuwa inafanya kazi zamani - inatuma moja kwa moja kama TV</div>
</div>

<div class="card">
<label>📢 Ticker (chini ya video)</label>
<input id="ticker" placeholder="Andika habari...">
<button class="btn-gold" onclick="wekaTicker()">Badilisha Ticker</button>
</div>

<div class="card">
<b>📋 Video zote</b>
<div id="list"></div>
<button class="btn-dark" onclick="location.reload()">Refresh</button>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {getDatabase,ref,push,set,onValue,remove} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const cfg={apiKey:"AIzaSyDuf-Is10hDtjNJU7hzDqJmLT2czSXzODg",authDomain:"ale-tv.firebaseapp.com",databaseURL:"https://ale-tv-default-rtdb.firebaseio.com",projectId:"ale-tv"};
const app=initializeApp(cfg);
const db=getDatabase(app);

function ytId(url){
  url=url.trim();
  if(!url) return null;
  if(url.length===11 &&!url.includes('/') &&!url.includes('?')) return url;
  let m=url.match(/(?:youtu\.be\/|v=|\/embed\/|shorts\/)([A-Za-z0-9_-]{11})/);
  return m?m[1]:null;
}

window.wekaVideo = async ()=>{
  let raw=document.getElementById('yt').value;
  let id=ytId(raw);
  if(!id) return alert('Weka YouTube link sahihi mkuu!');
  let title=document.getElementById('title').value||'ALE TV LIVE';
  let cat=document.getElementById('cat').value||'LIVE';
  let desc=document.getElementById('desc').value||'ALE TV LIVE';
  let data={
    id:id,
    title:title,
    cat:cat,
    desc:desc,
    createdAt:Date.now(),
    created:Date.now()
  };
  // HII NDIO YA ZAMANI - push kwa videos kama zamani
  await push(ref(db,'videos'),data);
  alert('✅ Imewekwa! Sasa inaenda moja kwa moja kwa TV');
  document.getElementById('yt').value='';
  document.getElementById('title').value='';
  document.getElementById('desc').value='';
};

window.wekaTicker = async ()=>{
  let t=document.getElementById('ticker').value;
  if(!t) return alert('Andika ticker');
  await set(ref(db,'ticker'),{text:t});
  alert('Ticker imebadilika');
};

// Onyesha live kama zamani
onValue(ref(db,'videos'),snap=>{
  let d=snap.val();
  if(!d){ document.getElementById('nowPlaying').innerHTML='Hakuna video'; return; }
  let arr=Object.values(d).sort((a,b)=>(b.createdAt||b.created||0)-(a.createdAt||a.created||0));
  let v=arr[0];
  document.getElementById('nowPlaying').innerHTML=`<b>${v.title}</b><br><small>${v.id} | ${v.cat}</small>`;
  document.getElementById('list').innerHTML=arr.map(v=>`<div class="item"><span>${v.title}<br><small>${v.id}</small></span><small>${v.cat}</small></div>`).join('');
});

onValue(ref(db,'.info/connected'),s=>{
  document.getElementById('status').innerHTML=s.val()?'● Connected':'● Offline';
  document.getElementById('status').style.color=s.val()?'#0f0':'#f00';
});
</script>
</body></html>
