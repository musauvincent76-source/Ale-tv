<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ale TV Admin</title>
<style>body{background:#111;color:#fff;font-family:sans-serif;padding:20px;max-width:600px;margin:auto}input,button{width:100%;padding:14px;margin:8px 0;border-radius:8px;border:0;font-size:16px}input{background:#222;color:#fff}button{background:#ff0033;color:#fff;font-weight:bold}</style>
</head><body>
<h2>ALE TV - Weka Video 🔴</h2>
<input id="t" placeholder="Jina la video">
<input id="u" placeholder="Link YouTube - https://youtu.be/...">
<button id="b">SAVE KWENYE TV</button>
<p id="s"></p>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {getDatabase,ref,push} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
const firebaseConfig = {
  apiKey: "AIzaSyDuf-Is10hDtjNJU7hzDqJmLT2czSXzODg",
  authDomain: "ale-tv.firebaseapp.com",
  databaseURL: "https://ale-tv-default-rtdb.firebaseio.com",
  projectId: "ale-tv",
  storageBucket: "ale-tv.firebasestorage.app",
  messagingSenderId: "548271956392",
  appId: "1:548271956392:web:6993343a96da96f7757d9d"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
document.getElementById('b').onclick = () => {
  const title=document.getElementById('t').value, url=document.getElementById('u').value;
  if(!title||!url){alert('Jaza zote');return}
  push(ref(db,'videos'),{title,url,createdAt:Date.now()}).then(()=>{document.getElementById('s').innerText='✅ IMEINGIA LIVE!';document.getElementById('t').value='';document.getElementById('u').value='' })
}
</script></body></html>
