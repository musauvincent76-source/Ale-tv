<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADMIN - NO YOUTUBE</title><style>body{background:#111;color:#fff;font-family:sans-serif;padding:12px}input{width:100%;padding:10px;margin:6px 0;border-radius:8px;border:1px solid #333;background:#000;color:#fff}button{width:100%;padding:12px;border-radius:8px;border:0;background:#ff8c00;color:#000;font-weight:900;margin-top:8px}.card{background:#1a1a1a;padding:12px;border-radius:10px;margin-bottom:10px}</style></head><body>
<h2 style="color:#ff8c00">ALE ADMIN - MP4 MODE (Hakuna YouTube)</h2>
<div class="card">
<input id="title" placeholder="Title - mfano: Burudani">
<input id="cat" placeholder="Category - Burudani / Habari">
<input id="mp4" placeholder="Weka DIRECT MP4 LINK - mfano: https://...video.mp4">
<small style="color:#aaa">Video yako ya YouTube OST6tyIh11U - pakua kwanza kuwa mp4 (tumia y2mate.is) kisha upload kwenye catbox.moe au gofile.io uchukue link ya mp4</small>
<button onclick="save()">SAVE & BROADCAST</button>
</div>
<div id="list"></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";import{getDatabase,ref,push,set,onValue,remove}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
const db=getDatabase(initializeApp({apiKey:"AIzaSyDuf-Is10hDtjNJU7hzDqJmLT2czSXzODg",authDomain:"ale-tv.firebaseapp.com",databaseURL:"https://ale-tv-default-rtdb.firebaseio.com",projectId:"ale-tv"}));
window.save=async()=>{let url=document.getElementById('mp4').value.trim(); if(!url)return alert('Weka mp4 link'); let data={title:document.getElementById('title').value||'ALE TV',cat:document.getElementById('cat').value||'Burudani',url:url,link:url,createdAt:Date.now()}; await set(push(ref(db,'videos')),data); alert('Imeenda!');}
onValue(ref(db,'videos'),s=>{let d=s.val(); let h=''; if(!d)return; Object.entries(d).forEach(([k,v])=>{h+=`<div class=card>${v.title} - ${v.cat}<br><small>${v.url?.substring(0,50)}</small><br><button onclick="del('${k}')" style="background:red;color:#fff;margin-top:6px">Futa</button></div>`}); document.getElementById('list').innerHTML=h;});
window.del=async(k)=>{await remove(ref(db,'videos/'+k));}
</script></body></html>
