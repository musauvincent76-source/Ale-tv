<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALE TV ADMIN</title>
<style>
body{margin:0;background:#111;color:#fff;font-family:sans-serif;padding:12px}
h2{color:#f59e0b;text-align:center}
.card{background:#1a1a1a;padding:12px;border-radius:10px;margin:10px 0;border:1px solid #333}
input,select,textarea{width:100%;padding:10px;margin:6px 0;background:#000;color:#fff;border:1px solid #444;border-radius:6px}
button{padding:10px 15px;border:none;border-radius:6px;font-weight:bold;cursor:pointer;margin:3px}
.btn-add{background:#f59e0b;color:#000;width:100%}
.btn-del{background:#ff0000;color:#fff}
.btn-edit{background:#00f5ff;color:#000}
.btn-ticker{background:#00ff88;color:#000;width:100%}
.btn-tv{background:#00ff88;color:#000;width:100%;padding:14px;font-size:16px;margin-bottom:12px}
.list-item{background:#222;padding:8px;border-radius:6px;margin:5px 0;display:flex;justify-content:space-between;align-items:center}
.stats{display:flex;gap:10px;text-align:center}
.stats div{background:#222;flex:1;padding:10px;border-radius:8px}
.stats b{color:#f59e0b;font-size:18px;display:block}
</style></head><body>
<h2>🔥 ALE TV ADMIN PANEL 🔥</h2>
<button class="btn-tv" onclick="openTV()">📺 FUNGUA TV - ANGALIA LIVE</button>
<div class="stats">
<div><b id="totalV">0</b>Videos</div>
<div><b id="liveV">LIVE</b>Status</div>
<div><b id="time">00:00</b>Time</div>
</div>
<div class="card">
<h3>➕ Weka Video Mpya</h3>
<input id="ytLink" placeholder="Weka YouTube Link au ID (https://youtube.com/watch?v=...)">
<input id="vTitle" placeholder="Title ya video">
<textarea id="vDesc" placeholder="Description"></textarea>
<select id="vCat">
<option>BURUDANI</option><option>HABARI</option><option>MICHEZO</option><option>DINI</option><option>ELIMU</option><option>MZIKI</option>
</select>
<label style="display:flex;align-items:center;gap:8px;margin:8px 0;color:#ff4444;font-size:13px"><input type="checkbox" id="isLive" style="width:auto"> 🔴 Hii ni LIVE STREAM (Mechi/Live News)</label>
<button class="btn-add" id="saveBtn">💾 SAVE VIDEO KWENYE TV</button>
<p id="msg" style="text-align:center;font-weight:bold"></p>
</div>
<div class="card">
<h3>📢 Ticker Custom</h3>
<input id="tickerCustom" placeholder="Andika habari ya chini...">
<button class="btn-ticker" id="tickerBtn">🔄 UPDATE TICKER</button>
<p style="font-size:11px;color:#888">Current: <span id="curTicker">-</span></p>
</div>
<div class="card">
<h3>📋 Videos Zote (<span id="count">0</span>)</h3>
<div id="list"></div>
<button id="clearBtn" style="background:#333;color:#fff;width:100%;margin-top:10px">🗑️ Futa Zote</button>
</div>
