<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALE TV</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:sans-serif}
#wrap{position:relative;width:100%;background:#000}
#player{width:100%;aspect-ratio:16/9;background:#000}
#player iframe{width:100%;height:100%;pointer-events:none!important}
#overlay{position:absolute;inset:0;z-index:9;background:transparent}
#live{position:absolute;top:10px;left:10px;background:red;color:#fff;padding:4px 8px;border-radius:4px;font-size:11px;font-weight:900;z-index:10;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.5}}
#tickerWrap{position:absolute;bottom:0;left:0;right:0;height:34px;background:#f59e0b;z-index:8;overflow:hidden;display:flex;align-items:center}
#ticker{flex:1;white-space:nowrap;overflow:hidden;color:#000;font-weight:900;font-size:13px}
#ticker span{display:inline-block;padding-left:100%;animation:scroll 25s linear infinite}
@keyframes scroll{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}
/* SAA KWA KONA - kama ulivyosema */
#clockBox{position:absolute;bottom:34px;left:0;z-index:11;background:#000;color:#f59e0b;border:2px solid #f59e0b;border-bottom:0;border-left:0;padding:5px 12px;border-radius:0 10px 0 0;font-weight:900;font-size:15px;letter-spacing:1px;box-shadow:2px -2px 10px rgba(0,0,0,.9)}
</style></head><body>

<div id="wrap">
<div id="player"></div>
<div id="overlay" onclick="return false;"></div>
<div id="live">🔴 LIVE</div>

<div id="clockBox">00:00:00</div>

<div id="tickerWrap">
<div id="ticker"><span id="tick">ALE TV LIVE - Karibu...</span></div>
</div>
</div>

<script>
function getV(){return JSON.parse(localStorage.getItem('ale_videos')||'[]')}

// WORLD TIME - video inaenda na saa ya ukweli
function getWorldSeek(id){
 let k='ale_start_'+id;
 let s=localStorage.getItem(k);
 if(!s){ s=Date.now(); localStorage.setItem(k,s); }
 let elapsed = Math.floor((Date.now() - parseInt(s))/1000);
 return elapsed;
}

let player,cur=null,videos=[],currentIdx=0;

function playIndex(idx){
 videos=getV(); if(!videos.length) return;
 if(idx>=videos.length) idx=0;
 currentIdx=idx;
 cur=videos[currentIdx];
 let seek=getWorldSeek(cur.id);
 document.getElementById('tick').innerText='🔴 '+cur.title+' | '+(localStorage.getItem('ale_ticker_custom')||'ALE TV LIVE Exclusive')+' | '+cur.title;
 if(player && player.loadVideoById){
   player.loadVideoById({videoId:cur.id,startSeconds:seek});
   player.playVideo();
 }else{
   createPlayer(cur.id,seek);
 }
}

function createPlayer(vId,seek){
 if(!window.YT){
   let t=document.createElement('script');
   t.src="https://www.youtube.com/iframe_api";
   document.head.appendChild(t);
   window.onYouTubeIframeAPIReady=()=>{ doCreate(vId,seek); };
 }else{ doCreate(vId,seek); }
}

function doCreate(vId,seek){
 player=new YT.Player('player',{
  videoId:vId,
  playerVars:{autoplay:1,mute:1,controls:0,disablekb:1,fs:0,rel:0,modestbranding:1,playsinline:1,start:seek,origin:window.location.origin},
  events:{
   onReady:e=>{
     e.target.seekTo(seek,true);
     e.target.playVideo();
     setTimeout(()=>{try{e.target.unMute();e.target.setVolume(100);}catch{}},800);
     // force isicheze picha tu
     let c=0; let f=setInterval(()=>{c++; try{if(player.getPlayerState()!=1)player.playVideo(); else clearInterval(f);}catch{} if(c>20)clearInterval(f);},400);
   },
   onStateChange:e=>{
     // 0 = video imeisha - enda mbele, USIRUDIE
     if(e.data==0){
       playIndex(currentIdx+1);
     }
     // 2 = mtu amejaribu kupause / kubonyeza - mrudishe MBELE na saa
     if(e.data==2){
       setTimeout(()=>{
         let real=getWorldSeek(cur.id);
         player.seekTo(real,true);
         player.playVideo();
       },300);
     }
   }
  }
 });
}

// saa ya Nairobi kwa kona
setInterval(()=>{
 let now=new Date();
 document.getElementById('clockBox').innerText=now.toLocaleTimeString('en-KE',{hour12:false,timeZone:'Africa/Nairobi'});
},1000);

// WORLD SYNC KILA SEKUNDE - ukitoka online ukirudi unapata mbele
setInterval(()=>{
 if(cur && player && player.getCurrentTime){
  try{
   let real=getWorldSeek(cur.id);
   let nowT=player.getCurrentTime();
   // kama yuko nyuma zaidi ya 3 sec, msukume MBELE na saa
   if(real - nowT > 3){
     player.seekTo(real,true);
   }
   // kama video imezidi duration yake, enda next automatically
   if(player.getDuration && real > player.getDuration() - 2){
     playIndex(currentIdx+1);
   }
  }catch{}
 }
},2000);

// mtu akitoka tab akirudi - sync mara moja
document.addEventListener('visibilitychange',()=>{
 if(!document.hidden && cur && player){
   let real=getWorldSeek(cur.id);
   player.seekTo(real,true);
   player.playVideo();
 }
});

// zuia kusongeza kabisa
document.getElementById('overlay').addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.getElementById('overlay').addEventListener('dblclick',e=>e.preventDefault());

// anza na video ya mwisho
let v=getV();
if(v.length) playIndex(v.length-1);
</script>
</body></html>
