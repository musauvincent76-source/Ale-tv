<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AZAM ALE TV KE LIVE</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica}
body{background:#060a18;color:#fff}
.topbar{height:44px;background:#0b122a;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:2px solid #ff6a00;position:sticky;top:0;z-index:10}
.clock{font-weight:900;font-size:13px;color:#00ff88}
.liveZoom{position:absolute;top:10px;right:10px;z-index:5;background:#ff0000;color:#fff;padding:6px 14px;border-radius:20px;font-weight:900;font-size:11px;display:flex;align-items:center;gap:6px;animation:zoom 1.2s infinite}
@keyframes zoom{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(255,0,0,.7)}50%{transform:scale(1.1);box-shadow:0 0 0 10px rgba(255,0,0,0)}}
#tvWrap{width:100%;aspect-ratio:16/9;background:#000;position:relative;overflow:hidden}
#player{width:100%;height:100%;border:0}
.lower{position:absolute;bottom:28px;left:0;right:0;display:flex;z-index:3}
.red{background:#cc0000;color:#fff;padding:6px 10px;font-weight:900;font-size:10px}
.titleBox{background:rgba(0,0,0,.88);color:#fff;padding:6px 10px;flex:1;font-weight:800;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.liveBtn{background:#ff6a00;color:#000;padding:6px 10px;font-weight:900;font-size:10px}
.ticker{position:absolute;bottom:0;left:0;right:0;background:#cc0000;height:28px;display:flex;align-items:center;overflow:hidden;z-index:3}
.break{background:#fff;color:#cc0000;padding:2px 7px;font-weight:900;font-size:9px;margin-left:6px;border-radius:3px}
.scroll{flex:1;overflow:hidden;white-space:nowrap;margin-left:8px}
.scroll span{display:inline-block;color:#fff;font-weight:800;font-size:12px;animation:scr 20s linear infinite}
@keyframes scr{0%{transform:translateX(100%)}100%{transform:translateX(-100%)}}
.controls{position:absolute;left:10px;bottom:65px;z-index:4;display:flex;gap:8px}
.mute{width:42px;height:42px;border-radius:50%;background:rgba(0,0,0,.7);border:2px solid #fff;color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;backdrop-filter:blur(5px)}
.dashboard{padding:12px;max-width:800px;margin:auto}
.card{background:#121a2e;padding:14px;border-radius:14px;margin-top:12px;border:1px solid #1e2a4a}
input,select{width:100%;padding:13px;margin:6px 0;border-radius:10px;background:#000;color:#fff;border:1px solid #333;font-size:14px}
.btn{width:100%;padding:14px;border-radius:10px;border:0;font-weight:900;cursor:pointer;margin-top:6px}
.btn-add{background:#ff6a00;color:#fff}
.btn-stop{background:#222;color:#fff;border:1px solid #444}
.item{display:flex;gap:10px;background:#0d1429;padding:10px;border-radius:10px;margin:8px 0;border-left:4px solid #ff6a00;align-items:center}
.item img{width:68px;height:38px;border-radius:6px;object-fit:cover}
.act{display:flex;gap:6px}
.act button{padding:7px 12px;border-radius:20px;border:0;font-weight:800;font-size:11px;cursor:pointer}
.playB{background:#00ff88;color:#000}
.stopB{background:#333;color:#fff}
.delB{background:#ff003322;color:#ff5a7a}
.badge{font-size:10px;background:#ff6a00;padding:2px 6px;border-radius:10px}
</style>
</head>
<body>

<div class="topbar">
<div><b>AZAM ALE TV</b> <span style="color:#ff6a00">KE</span></div>
<div style="display:flex;gap:12px;align-items:center">
<div class="clock" id="clock">--:--:--</div>
<div style="font-size:11px;color:#888">TILL 3624692</div>
</div>
</div>

<div id="tvWrap">
<div class="liveZoom"><i class="fa-solid fa-circle" style="font-size:8px"></i> LIVE</div>
<div id="player"></div>
<div class="controls">
<div class="mute" id="muteBtn" title="Bonyeza kuwasha/zima sauti"><i class="fa-solid fa-volume-xmark"></i></div>
</div>
<div class="lower"><div class="red">AZAM ALE TV</div><div class="titleBox" id="nowTitle">Inapakia...</div><div class="liveBtn">● LIVE</div></div>
<div class="ticker"><div class="break">BREAKING</div><div class="scroll"><span id="scrollTxt">AZAM ALE TV KE LIVE | TILL 3624692 |</span></div></div>
</div>

<div class="dashboard">
<div style="display:flex;justify-content:space-between;font-size:12px;color:#888;margin-top:6px">
<span id="status">🌍 SYNC: Kila mtu anaona kitu kimoja</span><span id="cnt">0 videos</span>
</div>

<div class="card">
<h3 style="color:#ff6a00;font-size:14px"><i class="fa-solid fa-sliders"></i> ADMIN DASHBOARD</h3>
<p style="font-size:11px;color:#888;margin:4px 0">Weka YouTube link tu, jina litajiekea auto kwa TV ikiscroll</p>
<input id="vLink" placeholder="Weka YouTube link hapa - Normal au Live (https://youtu.be/...)">
<input id="vTitle" placeholder="Jina lita-jiauto, unaweza badilisha" style="display:none">
<select id="vCat"><option>Burudani</option><option>Habari</option><option>Matangazo</option><option>Michezo</option><option>Dini</option></select>
<button class="btn btn-add" id="addBtn"><i class="fa-solid fa-plus"></i> WEKA KWENYE TV - Watu wote wataona</button>
<button class="btn btn-stop" id="stopBtn"><i class="fa-solid fa-stop"></i> STOP TV (Pause kwa wote)</button>
<div style="background:#000;padding:8px;border-radius:8px;margin-top:8px;font-size:11px;color:#00ff88" id="log">✅ Tayari. Weka link</div>
</div>

<div id="list"></div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue, set, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
