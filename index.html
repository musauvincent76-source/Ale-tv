<div id="vid"><div id="player"></div><div id="live" class="badge">🔴 LIVE PUBLIC</div><div id="logo" class="badge">ALE TV</div><div id="sync" class="badge">🌍 PUBLIC - IMEENDELEA</div></div>
<div id="ad"><div id="adL"><div id="aI">📢</div><div style="font-size:7px;font-weight:900">Ad</div></div><div id="adC"><div><span style="border:1px solid #dadce0;border-radius:3px;padding:1px 4px">Ad</span> <span id="aU">ale-tv.com</span></div><div id="aT">ALE TV Advertisement</div><div id="aD">TILL 3624692 - ADVERTISE WITH US</div><div id="aLk">Till 3624692</div></div></div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
let player, videos=[], curIdx=-1;
const BIRTH = Date.UTC(2025,0,1)/1000; // Jan 1 2025
const SLOT = 240; // 4 min per video

function getId(v){if(!v)return'';v=v.trim();if(v.length==11&&!v.includes('/'))return v;if(v.includes('youtu.be/'))return v.split('youtu.be/')[1].split(/[?&#]/)[0];try{let u=new URL(v);if(u.searchParams.get('v'))return u.searchParams.get('v')}catch{}let m=v.match(/([a-zA-Z0-9_-]{11})/);return m?m[1]:'';}

function getWorldPosition(){
 let now=Date.now()/1000;
 let elapsed=Math.floor(now-BIRTH);
 let total=videos.length*SLOT;
 if(total==0) return {idx:0,seek:0};
 let pos=elapsed%total;
 return {idx:Math.floor(pos/SLOT),seek:pos%SLOT};
}

function onYouTubeIframeAPIReady(){
 initVideos();
}

function initVideos(){
 let list=[];
 try{
  let az=JSON.parse(localStorage.getItem('azamtv_ale_final_2026')||'null');
  if(az&&az.playlist&&az.playlist.length){
   list=az.playlist.map(p=>({id:getId(p.url||p.ytid||'')}))
  .filter(x=>x.id);
  }
 }catch{}
 if(!list.length){
  try{
   let old=JSON.parse(localStorage.getItem('ale_videos')||'[]');
   if(old.length) list=old.map(v=>({id:getId(v.id||'')})).filter(x=>x.id);
  }catch{}
 }
 if(!list.length) list=[{id:'jNQXAC9IVRw'},{id:'jfKfPfyJRdk'},{id:'5qap5aO4i9A'}];
 videos=list;
 let w=getWorldPosition();
 curIdx=w.idx;
 player=new YT.Player('player',{
  videoId:videos[w.idx].id,
  playerVars:{autoplay:1,mute:1,controls:1,rel:0,playsinline:1,start:w.seek},
  events:{
   onReady:e=>{
    e.target.seekTo(w.seek,true);
    e.target.playVideo();
   },
   onStateChange:e=>{
    if(e.data==0){ // video imeisha, nenda next kwa world position
     let nw=getWorldPosition();
     curIdx=nw.idx;
     e.target.loadVideoById({videoId:videos[nw.idx].id,startSeconds:nw.seek});
    }
   }
  }
 });
}

function start(){
 document.getElementById('over').style.display='none';
 if(player){
  player.unMute();
  player.setVolume(100);
  player.playVideo();
 }
}

// SYNC KILA 30 SECONDS - HAKUNA KUANZA ZERO, NI KUENDELEA TU
setInterval(()=>{
 if(!player||!videos.length) return;
 let w=getWorldPosition();
 // Kama index imebadilika (time ya video mpya) - badilisha video
 if(w.idx!==curIdx){
  curIdx=w.idx;
  try{ player.loadVideoById({videoId:videos[w.idx].id,startSeconds:w.seek}); }catch{}
 } else {
  // Kama ni video moja lakini seek imetofautiana zaidi ya 10 sec - sync kidogo
  try{
   let current=player.getCurrentTime();
   if(Math.abs(current-w.seek)>12){
    player.seekTo(w.seek,true);
   }
  }catch{}
 }
},30000); // check kila 30 sec pekee - si kila time

setInterval(()=>{
 document.getElementById('clock').innerText=new Date().toLocaleTimeString('en-GB',{timeZone:'Africa/Nairobi',hour12:false});
 let d=localStorage.getItem('ale_academy_desc')||'ALE FOOTBALL ACADEMY - 0703182307 - TILL 3624692';
 document.getElementById('aTxt').innerText=d.toUpperCase();
 document.getElementById('tTxt').innerText=d.toUpperCase()+' • TILL 3624692 • PUBLIC CONTINUOUS - UKITOKA UKIRUDI IMEENDELEA • ';
},1000);

// ADS GOOGLE STYLE
let ads=[{i:"📢",u:"ale-tv.com/ad",t:"Advertise With ALE TV - TILL 3624692",d:"🔴 ADVERTISE NOW - TILL 3624692 - 100K VIEWERS!",l:"Till 3624692"},{i:"🏫",u:"alefootballacademy.co.ke",t:"ALE Academy - Registration Open",d:"🟡 JOIN ALE ACADEMY - 0703182307 - 4-18 YEARS!",l:"0703182307"},{i:"💰",u:"mpesa",t:"Support ALE TV - TILL 3624692",d:"💰 TILL 3624692 - ASANTE SANA!",l:"Till 3624692"},{i:"🌍",u:"ale-tv.com",t:"Public TV - Same Time Everywhere",d:"🌍 KISUMU • NAIROBI • MOMBASA • UGANDA - SAME TIME!",l:"Public Continuous"}];
let idx=0;setInterval(()=>{let a=ads[idx%ads.length];document.getElementById('aI').innerText=a.i;document.getElementById('aU').innerText=a.u;document.getElementById('aT').innerText=a.t;let e=document.getElementById('aD');e.style.animation='none';void e.offsetWidth;e.innerText=a.d;e.style.animation='sc 9s linear infinite';document.getElementById('aLk').innerText=a.l;idx++;},4000);

// ADMIN CONNECT - KAMA ADMIN IMEUPDATE VIDEO
setInterval(()=>{
 try{
  let az=JSON.parse(localStorage.getItem('azamtv_ale_final_2026')||'null');
  if(az&&az.playlist){
   let newList=az.playlist.map(p=>getId(p.url||p.ytid||'')).filter(x=>x);
   if(newList.length&&newList.length!==videos.length){
    videos=newList.map(id=>({id}));
   }
  }
 }catch{}
},5000);
</script>
