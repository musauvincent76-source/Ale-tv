<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALE TV - LIVE WORLD TV</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#000;color:#fff;font-family:sans-serif;overflow:hidden}
.topbar{background:#0a0a0a;display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:2px solid #f59e0b}
.logo{font-weight:900;font-size:22px;color:#f59e0b}
.greeting{background:#1a1a1a;color:#f59e0b;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:bold;border:1px solid #f59e0b}
.live-badge{background:#ff0000;color:#fff;padding:5px 14px;border-radius:20px;font-weight:bold;font-size:13px}
.player{width:100%;height:70vh;background:#000;position:relative}
#main{width:100%;height:100%}
.clock{position:absolute;top:10px;right:12px;background:rgba(0,0,0,0.8);padding:5px 10px;border-radius:6px;font-size:13px;color:#f59e0b;z-index:10}
.tap-hint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(245,158,11,0.9);color:#000;padding:12px 20px;border-radius:30px;font-weight:900;z-index:20;display:none;cursor:pointer}
.ticker{position:absolute;bottom:0;left:0;right:0;background:#b80000;height:32px;display:flex;align-items:center;overflow:hidden;z-index:10}
.ticker-cat{background:#fff;color:#b80000;padding:4px 12px;font-weight:900;font-size:12px;margin-left:5px;border-radius:4px}
.ticker-text{white-space:nowrap;animation:scroll 40s linear infinite;font-size:14px;margin-left:15px;font-weight:bold}
@keyframes scroll{0%{transform:translateX(100vw)}100%{transform:translateX(-100%)}}
.info{padding:12px;background:#111;display:flex;justify-content:space-between;align-items:flex-start}
.desc-box{margin:8px 0 0 0;color:#ccc;font-size:14px;line-height:1.4;background:#1a1a1a;padding:8px 10px;border-radius:6px;border-left:3px solid #f59e0b}
</style></head><body>
<div class="topbar"><div class="logo">🔥 ALE TV</div><div class="greeting" id="greeting">☀️ Habari ya Asubuhi</div><div class="live-badge">● LIVE</div></div>
<div class="player" id="playerBox">
<div class="clock" id="clock">00:00:00</div>
<div id="main"></div>
<div class="tap-hint" id="tapHint" onclick="playNow()">👆 TAP TO PLAY</div>
<div class="ticker"><span class="ticker-cat" id="catLabel">LIVE</span><span class="ticker-text" id="ticker">🔥 ALE TV - TV YA KWELI DUNIANI 🔥</span></div>
</div>
<div class="info">
<div style="flex:1">
<h3 id="vTitle" style="margin:0">ALE TV LIVE</h3>
<small id="vCat" style="color:#f59e0b">LIVE</small>
<div id="vDesc" class="desc-box">Karibu ALE TV - TV ya kweli duniani...</div>
</div>
<div id="timeNow" style="color:#f59e0b;font-size:13px;margin-left:10px"></div>
</div>

<script>
let videos=[{id:'jNQXAC9IVRw',title:'ALE TV - Karibu',cat:'LIVE',desc:'Karibu ALE TV - TV ya kweli duniani',isLive:false},{id:'dQw4w9WgXcQ',title:'ALE TV Official',cat:'BURUDANI',desc:'Burudani nonstop',isLive:false}];
let current=null;let player=null;let ready=false;

function updateGreeting(){
 let h=new Date().getHours();
 let el=document.getElementById('greeting');
 let text='';
 if(h>=5&&h<12)text='☀️ Good Morning | Habari ya Asubuhi';
 else if(h>=12&&h<16)text='🌤️ Good Afternoon | Habari ya Mchana';
 else if(h>=16&&h<19)text='🌇 Good Evening | Habari ya Jioni';
 else text='🌙 Good Night | Habari ya Usiku';
 if(el)el.innerText=text;
}
updateGreeting();
setInterval(updateGreeting,60000);

setInterval(()=>{let s=new Date().toLocaleTimeString('en-KE',{hour12:false});document.getElementById('clock').innerText=s;document.getElementById('timeNow').innerText=s;},1000);
function getSynced(){let total=videos.length*240;let now=Math.floor(Date.now()/1000);let elapsed=now%total;return{idx:Math.floor(elapsed/240)%videos.length,seek:elapsed%240}}
function updateInfo(v){if(!v)return;document.getElementById('vTitle').innerText=v.title;document.getElementById('vCat').innerText=v.cat;document.getElementById('catLabel').innerText=v.cat;document.getElementById('vDesc').innerText=v.desc||'';document.getElementById('ticker').innerText='🔥 '+v.title+' | '+(v.desc||'ALE TV LIVE')+' | ALE TV LIVE WORLDWIDE 🔥';}
function createPlayer(){
 if(videos.length==0)return;
 if(player){let n=getSynced();current=n;let nv=videos[current.idx];updateInfo(nv);player.loadVideoById({videoId:nv.id,startSeconds:nv.isLive?0:n.seek});return;}
 current=getSynced();let v=videos[current.idx];updateInfo(v);
 player=new YT.Player('main',{videoId:v.id,playerVars:{autoplay:1,mute:1,controls:0,disablekb:1,fs:0,modestbranding:1,rel:0,playsinline:1,iv_load_policy:3,start:v.isLive?0:current.seek},
 events:{onReady:(e)=>{ready=true;e.target.playVideo();setTimeout(()=>{try{e.target.unMute()}catch{}},300);},
 onStateChange:(e)=>{let h=document.getElementById('tapHint');if(e.data==1)h.style.display='none';if(e.data==2)h.style.display='block';if(e.data==0){let n=getSynced();current=n;let nv=videos[current.idx];if(nv){updateInfo(nv);player.loadVideoById({videoId:nv.id,startSeconds:nv.isLive?0:n.seek});}}}}});
}
window.onYouTubeIframeAPIReady=function(){createPlayer();}
window.playNow=function(){if(player){let n=getSynced();current=n;let nv=videos[current.idx];updateInfo(nv);player.loadVideoById({videoId:nv.id,startSeconds:nv.isLive?0:n.seek});setTimeout(()=>{try{player.playVideo();player.unMute();}catch{}},200);document.getElementById('tapHint').style.display='none';}}
document.getElementById('playerBox').addEventListener('click',()=>{if(!player)return;let s=player.getPlayerState();if(s==1)player.pauseVideo();else playNow();});
</script>
<script src="https://www.youtube.com/iframe_api"></script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {getDatabase,ref,onValue} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
const firebaseConfig={apiKey:"AIzaSyDuf-Is10hDtjNJU7hzDqJmLT2czSXzODg",authDomain:"ale-tv.firebaseapp.com",databaseURL:"https://ale-tv-default-rtdb.firebaseio.com",projectId:"ale-tv",storageBucket:"ale-tv.firebasestorage.app",messagingSenderId:"548271956392",appId:"1:548271956392:web:6993343a96da96f7757d9d"};
const app=initializeApp(firebaseConfig);const db=getDatabase(app);
onValue(ref(db,'videos'),(snap)=>{
 const data=snap.val();
 if(!data||Object.keys(data).length==0)return;
 let newV=Object.values(data).reverse().map(v=>({id:v.id,title:v.title,cat:v.cat||'LIVE',desc:v.desc||'',isLive:!!v.isLive}));
 if(newV.length>0){videos=newV;let n=getSynced();updateInfo(videos[n.idx]);if(player&&ready)player.loadVideoById({videoId:videos[n.idx].id,startSeconds:videos[n.idx].isLive?0:n.seek});}
});
onValue(ref(db,'ticker'),(snap)=>{let d=snap.val();if(d&&d.text)document.getElementById('ticker').innerText='🔥 '+d.text+' | ALE TV LIVE 🔥';});
</script>
</body></html>
