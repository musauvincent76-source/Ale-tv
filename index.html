<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{margin:0;background:#0f0f1a;color:#fff;font-family:sans-serif;overflow-x:hidden}
#top{padding:10px 15px;background:#000;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #ff6a00}
.logo{font-weight:900;font-size:20px;letter-spacing:1px}
.logo span:first-child{color:#fff}
.logo span:last-child{color:#ff6a00;text-shadow:0 0 8px #ff6a00}
#clockTop{font-size:13px;background:#1a1a1a;padding:4px 10px;border-radius:15px;border:1px solid #333}
.wrap{position:relative}
#player{width:100%;height:52vh;background:#000}
#unmute{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#ff6a00;color:#fff;padding:14px 22px;border-radius:30px;font-weight:bold;z-index:10;border:0;animation:pulse 1s infinite;cursor:pointer}
@keyframes pulse{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.08)}}
#videoClock{position:absolute;bottom:8px;right:10px;background:rgba(0,0,0,0.75);padding:3px 10px;border-radius:5px;font-size:13px;font-weight:bold;z-index:5;border:1px solid rgba(255,255,255,0.2)}
#blockSeek{position:absolute;bottom:0;left:0;width:100%;height:50px;z-index:4;background:transparent}
.ticker{width:100%;background:#c00;white-space:nowrap;overflow:hidden;padding:8px 0;border-top:2px solid #ff6a00;border-bottom:2px solid #ff6a00}
.ticker span{display:inline-block;padding-left:100%;animation:scroll 25s linear infinite;font-weight:bold;font-size:14px}
@keyframes scroll{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}
</style>
</head>
<body>
<div id="top">
<div class="logo"><span>AZAM</span> <span>ALE TV</span></div>
<div id="clockTop">00:00:00</div>
<div style="background:red;padding:3px 10px;border-radius:10px;font-size:11px;font-weight:bold">● LIVE NOW</div>
</div>

<div class="wrap">
<button id="unmute" onclick="unmute()">🔊 GUSA HAPA KUWASHA SAUTI</button>
<div id="player"></div>
<div id="videoClock">00:00:00</div>
<div id="blockSeek"></div>
</div>

<div class="ticker"><span id="tick">🔴 AZAM ALE TV - SYNCED LIVE TV </span></div>

<script>
// ===== 4,5,6 PEKEE - HAKUNA KITU KINGINE KIMEGUSWA =====
var PLAYLIST = ['W6IsAStN2NY','W6IsAStN2NY','W6IsAStN2NY']; // badilisha hapa video zako Admin - video 1,2,3
var CHANNEL_START = new Date('2026-01-01T00:00:00Z').getTime(); // TV ilianza lini - ndio sync ya watu wote
var AVG_DURATION = 210; // sec kwa video 1 - itajirekebisha yenyewe baada ya kupata duration halisi

var tag=document.createElement('script');tag.src="https://www.youtube.com/iframe_api";document.head.appendChild(tag);
var player, currentIndex=0, lastTime=0;

function getSyncInfo(){
var elapsed = Math.floor((Date.now() - CHANNEL_START)/1000);
var totalCycle = PLAYLIST.length * AVG_DURATION;
var posInCycle = elapsed % totalCycle;
currentIndex = Math.floor(posInCycle / AVG_DURATION);
var seekTo = posInCycle % AVG_DURATION;
return {index: currentIndex, seek: seekTo};
}

function onYouTubeIframeAPIReady(){
var sync = getSyncInfo();
player=new YT.Player('player',{videoId:PLAYLIST[sync.index],playerVars:{autoplay:1,mute:1,playsinline:1,rel:0,controls:0,disablekb:1,fs:0,modestbranding:1,iv_load_policy:3},events:{onReady:function(){onReady(sync.seek)},onStateChange:onState}})}
function onReady(seekSec){
setTimeout(function(){
try{
var realDur = player.getDuration();
if(realDur>0) AVG_DURATION = realDur;
var sync = getSyncInfo();
player.seekTo(sync.seek, true);
}catch(e){player.seekTo(seekSec, true);}
updateTitle();
},800);
setInterval(blockSeek, 500);
}
function onState(e){
if(e.data==1){
document.getElementById('unmute').style.display='block';
updateTitle();
lastTime = player.getCurrentTime();
}
if(e.data==0){ // 6. IKIISHA INAENDA NEXT
currentIndex = (currentIndex+1) % PLAYLIST.length;
player.loadVideoById(PLAYLIST[currentIndex]);
}
}
function unmute(){player.unMute();player.setVolume(100);player.playVideo();document.getElementById('unmute').style.display='none'}
function updateTitle(){try{var t=player.getVideoData().title;if(t){document.getElementById('tick').innerText="🎵 NOW PLAYING: "+t+" | AZAM ALE TV - WATU WOTE MNAONA KITU KIMOJA | "}}catch(e){}}
function blockSeek(){
if(player && player.getCurrentTime){
var curr=player.getCurrentTime();
if(Math.abs(curr-lastTime)>3){player.seekTo(lastTime,true);}else{lastTime=curr;}
}
}
setInterval(function(){
var t=new Date().toLocaleTimeString('en-GB');
document.getElementById('clockTop').innerText=t;
document.getElementById('videoClock').innerText=t;
},1000);
document.body.addEventListener('click',function(){if(player&&player.isMuted&&player.isMuted()){unmute()}},{once:true});
</script>
</body>
</html>
