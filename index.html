<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALE TV</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:Arial;height:100vh;display:flex;flex-direction:column}
#top{height:44px;background:#111;display:flex;align-items:center;justify-content:space-between;padding:0 12px;flex-shrink:0}
#logo{font-weight:900}#logo span{color:#ff7a00}
#clock{font-size:10px;color:#888;background:#1a1a1a;padding:4px 10px;border-radius:20px}
#vid{flex:1;background:#000;position:relative}
#vid iframe{width:100%;height:100%;border:0;display:block}
#thumb{position:absolute;inset:0;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2}
#playBtn{width:68px;height:48px;background:#ff0000;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 4px 20px rgba(0,0,0,0.8)}
#bottom{background:#111;padding:10px 12px;border-top:1px solid #222;flex-shrink:0}
#bottom b{font-size:13px;display:block}#bottom small{font-size:10px;color:#ff7a00;text-transform:uppercase}#bottom p{font-size:11px;color:#888;margin-top:6px}
</style></head><body>
<div id="top"><div id="logo">ALE <span>TV</span></div><div id="clock">00:00:00</div></div>
<div id="vid">
<div id="thumb" onclick="startPlay()"><div id="playBtn">▶</div></div>
<iframe id="yt" allow="autoplay; fullscreen" allowfullscreen></iframe>
</div>
<div id="bottom"><b id="t">Inapakia...</b><small id="c">LIVE</small><p id="d"></p></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";import{getDatabase,ref,onValue}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
const db=getDatabase(initializeApp({apiKey:"AIzaSyDuf-Is10hDtjNJU7hzDqJmLT2czSXzODg",authDomain:"ale-tv.firebaseapp.com",databaseURL:"https://ale-tv-default-rtdb.firebaseio.com",projectId:"ale-tv"}));
let vids=[], curId=null, curStart=0;
const ok=id=>id&&/^[a-zA-Z0-9_-]{11}$/.test(id);
setInterval(()=>document.getElementById('clock').innerText=new Date().toLocaleTimeString('en-GB',{hour12:false}),1000);

window.startPlay=()=>{
 if(!curId) return;
 document.getElementById('thumb').style.display='none';
 // FAST EMBED - sio nocookie, hii ndio haraka zaidi
 document.getElementById('yt').src=`https://www.youtube.com/embed/${curId}?autoplay=1&mute=0&controls=1&rel=0&playsinline=1&start=${curStart}&iv_load_policy=3&modestbranding=1`;
}

function setData(v, start=0){
 curId=v.videoId; curStart=start;
 document.getElementById('t').innerText=v.title;
 document.getElementById('c').innerText=v.cat;
 document.getElementById('d').innerText=v.desc;
 // Show thumbnail instantly - no waiting
 document.getElementById('thumb').style.backgroundImage=`url(https://img.youtube.com/vi/${v.videoId}/hqdefault.jpg)`;
 document.getElementById('thumb').style.display='flex';
 // Auto play after 300ms
 setTimeout(()=>startPlay(),300);
 // Cache for next load
 localStorage.setItem('ale_last', JSON.stringify(v));
}

// Load from cache instantly - hakuna kusubiri Firebase
let cached=localStorage.getItem('ale_last');
if(cached){ try{ let v=JSON.parse(cached); setData(v);}catch{} }

onValue(ref(db,'live'),s=>{
 let v=s.val(); if(!v||!ok(v.videoId)) return;
 let st=Math.floor((Date.now()-v.startAt)/1000); if(st<0) st=0;
 setData(v, v.isLiveNow?0:st);
});

onValue(ref(db,'videos'),s=>{
 let d=s.val(); if(!d) return;
 vids=Object.values(d).filter(x=>ok(x.videoId));
 if(vids.length &&!curId){ setData(vids[0]); }
});
</script></body></html>
