<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ALE TV KE LIVE</title><style>body{margin:0;background:#0a0f1e;color:#fff;font-family:sans-serif}header{background:#001a4d;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #ff6600}#stage{height:50vh;background:#000;position:relative;overflow:hidden}#player{width:100%;height:100%;position:absolute;top:0;left:0}#block{position:absolute;inset:0;z-index:5}#citizen{position:absolute;bottom:0;width:100%;background:linear-gradient(90deg,#ff6600,#ff0000);padding:8px 0;font-weight:900;white-space:nowrap;overflow:hidden;font-size:14px;z-index:10;letter-spacing:0.5px}#citizen span{display:inline-block;animation:scroll 22s linear infinite;padding-left:100%}@keyframes scroll{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}#info{padding:10px;background:#111a33;display:flex;justify-content:space-between}#clock{color:#ffcc99;font-size:13px}</style></head><body>
<header><div>📺 <b>ALE TV KE • LIVE</b></div><div style="display:flex;gap:8px"><span id="clock"></span><span style="background:#ff0000;padding:3px 9px;border-radius:20px;font-size:11px">● LIVE</span></div></header>
<div id="stage"><div id="player"></div><div id="block"></div><div id="citizen"><span id="t">🎵 Karibu ALE TV KE LIVE | TILL 3624692 | Burudani 24/7</span></div></div>
<div id="info"><div><b id="vtitle">Loading...</b><div id="vsinger" style="font-size:11px;color:#ffcc99"></div></div><div id="next" style="font-size:11px;color:#ff6600"></div></div>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
let pl=[],cur=0,player,ytReady=false;
function getId(u){if(!u)return '';if(u.includes('youtu.be/'))return u.split('youtu.be/')[1].split(/[?&]/)[0];try{let v=new URL(u).searchParams.get('v');if(v)return v;}catch{}let m=u.match(/v=([^&]+)/);return m?m[1]:u;}
function findData(){let keys=['azam_final','aletv','ale_tv','playlist','ale_playlist','data'];for(let k of keys){try{let d=JSON.parse(localStorage.getItem(k));if(!d)continue;if(Array.isArray(d)&&d.length>0)return {pl:d,idx:parseInt(localStorage.getItem('azam_final_current')||0)};if(d.pl&&d.pl.length>0)return {pl:d.pl,idx:d.current||parseInt(localStorage.getItem('azam_final_current')||0)};}catch{}}return {pl:[],idx:0};}
function parseTitle(t){if(!t)return {singer:'ALE TV KE',title:t};let p=t.split(' - ');if(p.length>=2)return {singer:p[0].trim(),title:p.slice(1).join(' - ').trim()};p=t.split('-');if(p.length>=2)return {singer:p[0].trim(),title:p.slice(1).join('-').trim()};return {singer:'ALE TV KE',title:t};}
function getPos(id){try{let p=JSON.parse(localStorage.getItem('ale_pos'));if(!p||p.id!==id)return 0;return (p.base||0)+Math.floor((Date.now()-p.started)/1000);}catch{return 0;}}
function savePos(id,base){localStorage.setItem('ale_pos',JSON.stringify({id:id,started:Date.now(),base:base}));}
function loadPlaylist(){let d=findData();pl=d.pl;cur=d.idx||0;if(pl.length>0)show(cur);}
function show(i){if(i<0||i>=pl.length)return;cur=i;localStorage.setItem('azam_final_current',cur);let v=pl[i];let url=v.url||v.link||v.yt||'';let id=v.ytid||v.id||getId(url);if(!id)return;let start=getPos(id);let parsed=parseTitle(v.title||'');document.getElementById('vtitle').innerText=parsed.title;document.getElementById('vsinger').innerText=parsed.singer;
document.getElementById('t').innerText=`🎵 NOW PLAYING: ${parsed.singer} - ${parsed.title} | 🔴 ALE TV KE LIVE | TILL 3624692 | 📍 Nandi Hills | Next: ${(pl[i+1]?.title||'').slice(0,30)} | 🎶 Burudani 24/7`;
document.getElementById('next').innerText=pl[i+1]?'Next: '+pl[i+1].title.slice(0,20):'Mwisho';
if(ytReady&&player&&player.loadVideoById){player.loadVideoById({videoId:id,startSeconds:start});}else{window._lastId=id;window._start=start;}savePos(id,start);}
function onYouTubeIframeAPIReady(){ytReady=true;let d=findData();let id=window._lastId|| (d.pl[d.idx||0]? getId(d.pl[d.idx||0].url||''):'');player=new YT.Player('player',{videoId:id,playerVars:{autoplay:1,controls:0,disablekb:1,fs:0,rel:0,modestbranding:1,playsinline:1,start:window._start||0},events:{onReady:e=>e.target.playVideo(),onStateChange:e=>{if(e.data===0){savePos(pl[cur].ytid||getId(pl[cur].url),0);let nxt=cur+1;if(nxt>=pl.length)nxt=0;show(nxt);}}}});}
setInterval(()=>{document.getElementById('clock').innerText=new Date().toLocaleTimeString('en-KE',{hour12:true});},1000);
loadPlaylist();setInterval(()=>{if(player&&player.getCurrentTime){try{let v=pl[cur];if(v){let id=v.ytid||getId(v.url||'');savePos(id,player.getCurrentTime());}}catch{}}},3000);
</script></body></html>
