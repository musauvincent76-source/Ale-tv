<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALE TV - LIVE</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#000;color:#fff;font-family:sans-serif;overflow:hidden}
.topbar{background:#0a0a0a;display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:2px solid #f59e0b}
.logo{font-weight:900;font-size:22px;color:#f59e0b;letter-spacing:1px}
.live-badge{background:#ff0000;color:#fff;padding:5px 14px;border-radius:20px;font-weight:bold;font-size:13px;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.5}}
.player{width:100%;height:75vh;background:#000;position:relative}
#main{width:100%;height:100%}
#loading{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;z-index:2}
#loading b{color:#f59e0b;font-size:18px;display:block;margin-top:10px}
.clock{position:absolute;top:10px;right:12px;background:rgba(0,0,0,0.8);padding:5px 10px;border-radius:6px;font-size:13px;color:#f59e0b;z-index:10}
.tap-hint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(245,158,11,0.9);color:#000;padding:12px 20px;border-radius:30px;font-weight:900;z-index:20;display:none;cursor:pointer}
.ticker{position:absolute;bottom:0;left:0;right:0;background:#b80000;height:32px;display:flex;align-items:center;overflow:hidden;z-index:10}
.ticker-cat{background:#fff;color:#b80000;padding:4px 12px;font-weight:900;font-size:12px;margin-left:5px;border-radius:4px}
.ticker-text{white-space:nowrap;animation:scroll 40s linear infinite;font-size:14px;margin-left:15px;font-weight:bold}
@keyframes scroll{0%{transform:translateX(100vw)}100%{transform:translateX(-100%)}}
.info{padding:12px;background:#111;display:flex;justify-content:space-between}
</style></head><body>
<div class="topbar"><div class="logo">🔥 ALE TV</div><div class="live-badge">● LIVE</div></div>
<div class="player" id="playerBox">
<div class="clock" id="clock">00:00:00</div>
<div id="loading"><div style="font-size:40px">📺</div><b>ALE TV INAFUNGUKA...</b><small style="color:#888">Tafadhali subiri</small></div>
<div id="main"></div>
<div class="tap-hint" id="tapHint" onclick="playNow()">👆 TAP TO PLAY ALE TV</div>
<div class="ticker"><span class="ticker-cat" id="catLabel">LIVE</span><span class="ticker-text" id="ticker">🔥 KARIBU ALE TV - TV BORA TANZANIA 🔥</span></div>
</div>
<div class="info">
<div><h3 id="vTitle" style="margin:0">Inapakia...</h3><small id="vCat" style="color:#f59e0b">LIVE</small></div>
<div id="timeNow" style="color:#f59e0b;font-size:13px"></div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
let defaultVideos=[
{id:'jNQXAC9IVRw',title:'Me at the zoo - First YouTube Video',cat:'BURUDANI',isLive:false},
{id:'dQw4w9WgXcQ',title:'Karibu ALE TV Official',cat:'HABARI',isLive:false},
{id:'9bZkp7q19f0',title:'ALE TV Music Mix',cat:'MZIKI',isLive:false}
];
function getV(){
 try{let s=localStorage.getItem('ale_videos'); let v=s?JSON.parse(s):[]; return v.length>0?v:defaultVideos;}
 catch(e){return defaultVideos;}
}
let videos=getV();
setInterval(()=>{let s=new Date().toLocaleTimeString('en-KE',{hour12:false});document.getElementById('clock').innerText=s;let tn=document.getElementById('timeNow'); if(tn) tn.innerText=s;},1000);
function getSyncedIndex(){let total=videos.length*240;let now=Math.floor(Date.now()/1000);let el=now%total;return{idx:Math.floor(el/240),seek:el%240}}
let current=getSyncedIndex(); let player; let ready=false;
function onYouTubeIframeAPIReady(){
 let v=videos[current.idx];
 document.getElementById('vTitle').innerText=v.title;
 document.getElementById('vCat').innerText=v.cat;
 document.getElementById('catLabel').innerText=v.cat;
 document.getElementById('ticker').innerText='🔥 '+v.title+' | '+v.cat+' | ALE TV LIVE WORLDWIDE 🔥';
 document.getElementById('loading').style.display='none';
 player=new YT.Player('main',{
  videoId:v.id,
  playerVars:{autoplay:1,mute:1,controls:0,disablekb:1,fs:0,modestbranding:1,rel:0,playsinline:1,iv_load_policy:3,start:v.isLive?0:current.seek},
  events:{
   onReady:(e)=>{ready=true; e.target.playVideo(); setTimeout(()=>{try{e.target.unMute()}catch(err){}},1000);},
   onStateChange:(e)=>{
    let hint=document.getElementById('tapHint');
    if(e.data==1){hint.style.display='none';}
    if(e.data==2 || e.data==-1){hint.style.display='block';}
    if(e.data==0){current.idx=(current.idx+1)%videos.length; let nv=videos[current.idx]; document.getElementById('vTitle').innerText=nv.title; player.loadVideoById(nv.id);}
   },
   onError:(e)=>{document.getElementById('loading').innerHTML='<b style="color:red">Video haipatikani</b><br><small>Jaribu nyingine admin</small>'; document.getElementById('loading').style.display='block';}
  }
 });
}
function playNow(){
 if(player && ready){
  let total=videos.length*240;
  let now=Math.floor(Date.now()/1000);
  let el=now%total;
  let n={idx:Math.floor(el/240),seek:el%240};
  if(n.idx!=current.idx){
    current=n;
    let nv=videos[current.idx];
    document.getElementById('vTitle').innerText=nv.title;
    document.getElementById('vCat').innerText=nv.cat;
    document.getElementById('catLabel').innerText=nv.cat;
    player.loadVideoById({videoId:nv.id,startSeconds:nv.isLive?0:n.seek});
  }else{
    if(!videos[current.idx].isLive){
      try{player.seekTo(n.seek,true);}catch(e){}
    }
    player.playVideo();
    try{player.unMute();}catch(e){}
  }
  document.getElementById('tapHint').style.display='none';
 }
}
document.getElementById('playerBox').addEventListener('click',()=>{
 if(!player) return;
 let s=player.getPlayerState();
 if(s==1){player.pauseVideo();}
 else{playNow();}
});
setTimeout(()=>{if(!ready && typeof YT!=='undefined' && YT.Player){onYouTubeIframeAPIReady();}},3000);
</script>
</body></html>
