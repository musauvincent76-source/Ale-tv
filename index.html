<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALE TV</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:sans-serif}
#wrap{position:relative;width:100%;background:#000}
#player{width:100%;aspect-ratio:16/9;background:#000}
#player iframe{width:100%;height:100%;pointer-events:none!important}
#overlay{position:absolute;inset:0;z-index:20;background:rgba(0,0,0,0.55);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;gap:12px}
#overlay b{font-size:18px;font-weight:900;letter-spacing:1px;color:#fff;background:rgba(255,0,0,0.9);padding:10px 18px;border-radius:30px;animation:pulse 1.2s infinite}
#overlay small{color:#fff;font-size:13px;opacity:.9}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
#live{position:absolute;top:10px;left:10px;background:red;color:#fff;padding:4px 8px;border-radius:4px;font-size:11px;font-weight:900;z-index:10}
#tickerWrap{position:absolute;bottom:0;left:0;right:0;height:34px;background:#ff0000;z-index:8;display:flex;align-items:center;overflow:hidden}
#ticker{flex:1;white-space:nowrap;overflow:hidden;color:#fff;font-weight:900;font-size:13px}
#ticker span{display:inline-block;padding-left:100%;animation:scroll 35s linear infinite}
@keyframes scroll{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}
#clockBox{position:absolute;bottom:34px;left:0;z-index:11;background:#000;color:#ff0000;border:2px solid #ff0000;border-bottom:0;border-left:0;padding:5px 12px;border-radius:0 10px 0 0;font-weight:900;font-size:15px}
</style></head><body>

<div id="wrap">
<div id="player"></div>

<div id="overlay" onclick="startTV()">
<b>▶ TAP SCREEN TO PLAY</b>
<small>Bonyeza screen kuanza LIVE TV</small>
</div>

<div id="live">🔴 LIVE</div>
<div id="clockBox">00:00:00</div>
<div id="tickerWrap"><div id="ticker"><span id="tick">ALE TV LIVE - Tap screen to play...</span></div></div>
</div>

<script>
function getV(){return JSON.parse(localStorage.getItem('ale_videos')||'[]')}
const CHANNEL_BIRTH = new Date('2025-01-01T00:00:00Z').getTime();
let player, cur=null, videos=[], currentIdx=0, started=false;
let durations = JSON.parse(localStorage.getItem('ale_durations')||'{}');

function getTotal(){let t=0;videos.forEach(v=>{t+=(durations[v.id]||600)});return t||600}
function findNow(){
 videos=getV(); if(!videos.length) return null;
 let elapsed=Math.floor((Date.now()-CHANNEL_BIRTH)/1000);
 let total=getTotal(); let pos=elapsed%total; let acc=0;
 for(let i=0;i<videos.length;i++){
  let d=durations[videos[i].id]||600;
  if(pos<acc+d) return {idx:i,seek:pos-acc};
  acc+=d;
 }
 return {idx:0,seek:0};
}

function createPlayer(vId,seek){
 if(!window.YT){let s=document.createElement('script');s.src="https://www.youtube.com/iframe_api";document.head.appendChild(s);window.onYouTubeIframeAPIReady=()=>{doCreate(vId,seek)}}
 else{doCreate(vId,seek)}
}
function doCreate(vId,seek){
 player=new YT.Player('player',{
  videoId:vId,
  playerVars:{autoplay:1,mute:1,controls:0,disablekb:1,fs:0,rel:0,modestbranding:1,playsinline:1,start:seek},
  events:{
   onReady:e=>{
     e.target.seekTo(seek,true);
     if(started){ e.target.unMute(); e.target.setVolume(100); e.target.playVideo(); document.getElementById('overlay').style.display='none'; }
     setTimeout(()=>{try{let d=e.target.getDuration(); if(d>30){durations[cur.id]=Math.floor(d);localStorage.setItem('ale_durations',JSON.stringify(durations))}}catch{}},2000);
   },
   onStateChange:e=>{
     if(e.data==0){ let w=findNow(); if(w) playWorld(w); }
     if(e.data==2 && started){ setTimeout(()=>{let w=findNow(); if(w){player.seekTo(w.seek,true);player.playVideo()}},400); }
   }
  }
 });
}

function playWorld(w){
 if(!w) w=findNow(); if(!w) return;
 currentIdx=w.idx; cur=videos[w.idx];
 document.getElementById('tick').innerText='🔴 '+cur.title+' | ALE TV LIVE RED ALERT | '+cur.title;
 if(player && player.loadVideoById){ player.loadVideoById({videoId:cur.id,startSeconds:w.seek}); if(started) player.playVideo(); }
 else createPlayer(cur.id,w.seek);
}

function startTV(){
 started=true;
 let w=findNow();
 document.getElementById('overlay').style.display='none';
 if(player){ try{player.unMute();player.setVolume(100);player.seekTo(w.seek,true);player.playVideo();}catch{} }
 else{ playWorld(w); }
}

function resumeLive(){
 if(!started) return;
 let w=findNow(); if(!w) return;
 try{ player.seekTo(w.seek,true); player.playVideo(); player.unMute(); }catch{}
 document.getElementById('overlay').style.display='none';
}
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) resumeLive(); });
window.addEventListener('online', resumeLive);
window.addEventListener('focus', resumeLive);

setInterval(()=>{document.getElementById('clockBox').innerText=new Date().toLocaleTimeString('en-KE',{hour12:false,timeZone:'Africa/Nairobi'})},1000);
setInterval(()=>{ if(!started||!player) return; let w=findNow(); if(!w) return; if(w.idx!==currentIdx){playWorld(w)} else{try{if(Math.abs(player.getCurrentTime()-w.seek)>8)player.seekTo(w.seek,true)}catch{}} },4000);

let v=getV(); videos=v; if(v.length){ let w=findNow(); if(w) playWorld(w); }
</script>
</body></html>
