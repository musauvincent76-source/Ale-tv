<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALE TV - 70 INCHES</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:sans-serif;overflow:hidden}
#wrap{position:relative;width:100%;height:100vh;background:#000;display:flex;flex-direction:column}
#player{width:100%;height:70vh;background:#000;flex-shrink:0;overflow:hidden}
#player iframe{width:100%;height:100%;pointer-events:none!important;transform:scale(1.08);transform-origin:center center}
#overlay{position:absolute;inset:0;z-index:20;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;cursor:pointer;height:70vh}
#overlay b{background:#ff0000;color:#fff;padding:12px 22px;border-radius:30px;font-size:16px;font-weight:900}
#live{position:absolute;top:10px;left:10px;background:red;color:#fff;padding:4px 8px;border-radius:4px;font-size:11px;font-weight:900;z-index:10}
#aleLogo{position:absolute;top:10px;right:10px;z-index:15;background:linear-gradient(135deg,#ff0000,#ffae00);color:#fff;padding:7px 16px;border-radius:25px;font-weight:900;font-size:14px;letter-spacing:2px;border:2px solid #fff;display:flex;align-items:center;gap:7px}
#aleLogo.dot{width:10px;height:10px;background:#fff;border-radius:50%;animation:blink 0.8s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
#tickerWrap{position:absolute;top:70vh;left:0;right:0;height:32px;background:#ff0000;z-index:8;display:flex;align-items:center;overflow:hidden;transform:translateY(-100%)}
#ticker span{display:inline-block;padding-left:100%;white-space:nowrap;color:#fff;font-weight:900;font-size:13px;animation:scroll 15s linear infinite}
@keyframes scroll{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}
#breakingBox{position:absolute;top:70vh;left:0;right:0;height:78px;background:#000;border-top:3px solid #ff0000;border-bottom:3px solid #ff0000;z-index:12;display:flex;align-items:center;overflow:hidden}
#breakingLabel{background:#ff0000;color:#fff;font-weight:900;font-size:11px;padding:0 12px;height:100%;display:flex;align-items:center}
#breakingTicker{flex:1;overflow:hidden;white-space:nowrap}
#breakingTicker span{display:inline-block;padding-left:100%;color:#fff;font-weight:700;font-size:12px;animation:scroll2 60s linear infinite}
@keyframes scroll2{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}
#clockBox{position:absolute;top:calc(70vh - 32px);left:0;z-index:11;background:#000;color:#ff0000;border:2px solid #ff0000;border-bottom:0;border-left:0;padding:5px 10px;border-radius:0 10px 0 0;font-size:13px;font-weight:900;transform:translateY(-100%)}
#nextBox{position:absolute;top:calc(70vh - 32px);left:105px;z-index:11;background:#ff0000;color:#fff;padding:5px 10px;border-radius:10px 10px 0 0;font-size:11px;font-weight:900;display:none;max-width:60%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;transform:translateY(-100%)}
</style></head><body>
<div id="wrap">
<div id="player"></div>
<div id="overlay" onclick="startTV()"><b>▶ TAP SCREEN TO PLAY</b></div>
<div id="live">🔴 LIVE</div>
<div id="aleLogo"><span class="dot"></span> ALE TV</div>
<div id="clockBox">00:00:00</div>
<div id="nextBox"></div>
<div id="tickerWrap"><div id="ticker"><span id="tick">ALE TV WORLD LIVE</span></div></div>
<div id="breakingBox"><div id="breakingLabel">⚡ ADS</div><div id="breakingTicker"><span id="breakText">ALE TV LIVE - 70 INCHES KUBWA SANA! | Advertise Here | Trending Kenya |</span></div></div>
</div>
<script>
function getV(){return JSON.parse(localStorage.getItem('ale_videos')||'[]')}
const BIRTH=new Date('2025-01-01T00:00:00Z').getTime();const SLOT=240;
let player,videos=[],curIdx=0,isCatching=false;
function findNow(){let v=getV();if(!v.length)return null;let e=Math.floor((Date.now()-BIRTH)/1000);return{idx:Math.floor(e/SLOT)%v.length,seek:e%SLOT>230?0:e%SLOT}}
function loadYT(cb){if(window.YT&&window.YT.Player){cb();return}let s=document.createElement('script');s.src="https://www.youtube.com/iframe_api";s.async=true;window.onYouTubeIframeAPIReady=cb;document.head.appendChild(s)}
function createPlayer(vId,seek){loadYT(()=>{player=new YT.Player('player',{videoId:vId,playerVars:{autoplay:1,mute:1,controls:0,disablekb:1,fs:0,rel:0,modestbranding:1,playsinline:1,start:seek,iv_load_policy:3},events:{onReady:e=>{e.target.setPlaybackRate(1);e.target.playVideo()},onStateChange:e=>{if(e.data==0){curIdx=(curIdx+1)%videos.length;e.target.loadVideoById(videos[curIdx].id);e.target.setPlaybackRate(1);isCatching=false;document.getElementById('tick').innerText='NOW: '+videos[curIdx].title}}}})})}
function startTV(){let w=findNow();if(!w)return;videos=getV();curIdx=w.idx;if(!player)createPlayer(videos[curIdx].id,w.seek);else{try{player.setPlaybackRate(1);player.seekTo(w.seek,true);player.unMute();player.setVolume(100);player.playVideo()}catch{}}document.getElementById('overlay').style.display='none';setTimeout(()=>{try{player.unMute();player.setPlaybackRate(1)}catch{}},500)}
function resumeLiveGentle(){if(!player)return;let w=findNow();if(!w)return;try{let c=player.getCurrentTime(),d=w.seek-c;if(Math.abs(d)>12){isCatching=true;player.setPlaybackRate(1.08);setTimeout(()=>{try{let w2=findNow();if(Math.abs(w2.seek-player.getCurrentTime())>8)player.seekTo(w2.seek,true);player.setPlaybackRate(1);isCatching=false}catch{}},15000)}else{player.setPlaybackRate(1);if(Math.abs(d)>4)player.seekTo(w.seek,true)}player.playVideo()}catch{}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)resumeLiveGentle()});window.addEventListener('online',resumeLiveGentle);window.addEventListener('focus',resumeLiveGentle);
setInterval(()=>{document.getElementById('clockBox').innerText=new Date().toLocaleTimeString('en-KE',{hour12:false,timeZone:'Africa/Nairobi'});if(!player||!player.getDuration)return;try{let d=player.getDuration(),c=player.getCurrentTime(),rem=d-c;if(rem<=60&&rem>0){let n=videos[(curIdx+1)%videos.length];if(n){let nb=document.getElementById('nextBox');nb.style.display='block';nb.innerText='NEXT: '+n.title}}else document.getElementById('nextBox').style.display='none';if(!isCatching&&player.getPlaybackRate()!==1)player.setPlaybackRate(1)}catch{}},1000);
async function loadBreaking(){try{let url='https://api.allorigins.win/raw?url='+encodeURIComponent('https://news.google.com/rss?hl=en-KE&gl=KE&ceid=KE:en');let res=await fetch(url);let text=await res.text();let xml=new DOMParser().parseFromString(text,"text/xml");let items=xml.querySelectorAll("item");let news=[];for(let i=0;i<Math.min(8,items.length);i++){news.push(items[i].querySelector("title").textContent.replace(' - ',' | '))}document.getElementById('breakText').innerText=news.join(' ⚡ ')}catch(e){document.getElementById('breakText').innerText="ALE TV - 70 INCHES - TV KUBWA SANA | Advertise Your Business Here | BREAKING: Trending in Kenya | ALE TV LIVE 24/7 |"}}
loadBreaking();setInterval(loadBreaking,1000*60*5);
let v=getV();videos=v;if(v.length){let w=findNow();createPlayer(v[w.idx].id,w.seek);document.getElementById('tick').innerText='NOW: '+v[w.idx].title+' | ALE TV LIVE'}
</script>
</body></html>
