<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALE TV</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:sans-serif;overflow:hidden;height:100vh;display:flex;flex-direction:column}
#playerWrap{flex:1;background:#000;position:relative;width:100%}
#playerWrap iframe,#player{width:100%;height:100%;border:0;position:absolute;top:0;left:0}
#overlay{position:absolute;inset:0;z-index:4}
#liveBadge{position:absolute;top:12px;left:12px;background:red;color:#fff;padding:5px 10px;border-radius:5px;font-size:11px;font-weight:900;z-index:5;animation:blink 1s infinite}
@keyframes blink{50%{opacity:0.5}}
#playBig{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:10;background:rgba(0,0,0,0.6);cursor:pointer}
#playBig div{width:80px;height:80px;background:#f59e0b;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:40px;color:#000;box-shadow:0 0 30px #f59e0b}
#bottom{background:#111;padding:10px;border-top:2px solid #f59e0b}
#bottom b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ticker{color:#f59e0b;font-size:12px;margin-top:4px;white-space:nowrap;overflow:hidden}
#ticker span{display:inline-block;animation:scroll 20s linear infinite}
@keyframes scroll{from{transform:translateX(100%)}to{transform:translateX(-100%)}}
</style></head><body>

<div id="playerWrap">
<div id="player"></div>
<div id="overlay" onclick="tryPlay()"></div>
<div id="liveBadge">🔴 LIVE</div>
<div id="playBig" onclick="tryPlay()"><div>▶</div></div>
</div>

<div id="bottom">
<b id="vTitle">ALE TV - Inapakia...</b>
<div id="ticker"><span id="vDesc">Karibu ALE TV - WORLD SYNC</span></div>
</div>

<script>
function getV(){return JSON.parse(localStorage.getItem('ale_videos')||'[]')}
let player, cur=null;

function getWorldSeek(id){
 let k='ale_start_'+id;
 let s=localStorage.getItem(k);
 if(!s){s=Date.now(); localStorage.setItem(k,s);}
 return Math.floor((Date.now()-parseInt(s))/1000);
}

function tryPlay(){
 let btn=document.getElementById('playBig');
 if(player){
  try{ player.unMute(); player.setVolume(100); player.playVideo(); }catch{}
  btn.style.display='none';
 }
}

function loadAPI(){
 if(!window.YT){
  let tag=document.createElement('script');
  tag.src="https://www.youtube.com/iframe_api";
  document.head.appendChild(tag);
 }
}

window.onYouTubeIframeAPIReady=()=>{
 let vids=getV();
 if(!vids.length){ document.getElementById('vTitle').innerText='Hakuna video - weka Admin'; return; }
 cur=vids[vids.length-1]; // ya mwisho
 let seek=getWorldSeek(cur.id);

 document.getElementById('vTitle').innerText=cur.title;
 document.getElementById('vDesc').innerText=cur.title+' | '+(cur.desc||'')+' | '+(localStorage.getItem('ale_ticker_custom')||'ALE TV LIVE');

 player=new YT.Player('player',{
  videoId:cur.id,
  playerVars:{
   autoplay:1, mute:1, controls:0, disablekb:1, fs:0, rel:0, modestbranding:1, playsinline:1, origin:window.location.origin, start:seek
  },
  events:{
   onReady:(e)=>{
    e.target.seekTo(seek,true);
    e.target.playVideo();
    // jaribu ku-unmute automatic
    setTimeout(()=>{ 
     try{ e.target.unMute(); e.target.setVolume(100); document.getElementById('playBig').style.display='none'; }
     catch{ document.getElementById('playBig').style.display='flex'; }
    },800);
    // kama bado muted after 2 sec, onyesha play
    setTimeout(()=>{ if(player.isMuted && player.isMuted()){ document.getElementById('playBig').style.display='flex'; } },2000);
   },
   onStateChange:(e)=>{
    if(e.data==1){ document.getElementById('playBig').style.display='none'; } // playing
    if(e.data==2){ // paused - rudisha kama Citizen
     setTimeout(()=>{ 
      let ns=getWorldSeek(cur.id);
      player.seekTo(ns,true);
      player.playVideo();
     },500);
    }
   }
  }
 });
};

loadAPI();

// Kila 10 sec sync kama uko nyuma
setInterval(()=>{
 if(cur && player && player.getCurrentTime){
  try{
   let real=getWorldSeek(cur.id);
   let now=player.getCurrentTime();
   if(Math.abs(real-now)>12){ player.seekTo(real,true); }
  }catch{}
 }
},10000);
</script>
</body></html>
