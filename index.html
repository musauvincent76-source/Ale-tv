<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://www.youtube.com"><link rel="preconnect" href="https://i.ytimg.com">
<title>ALE TV ROCKET</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:sans-serif}
.top{padding:8px 10px;display:flex;justify-content:space-between;background:#111;border-bottom:2px solid #f59e0b}
.logo{color:#f59e0b;font-weight:900}
#box{width:100%;height:80vh;background:#000;position:relative}
iframe{width:100%;height:100%;border:0}
#over{position:absolute;top:0;left:0;right:0;bottom:0;z-index:5}
#hint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#f59e0b;color:#000;padding:12px 22px;border-radius:30px;font-weight:900;z-index:6;display:none}
.ticker{position:absolute;bottom:0;left:0;right:0;background:#b80000;height:28px;line-height:28px;white-space:nowrap;overflow:hidden;z-index:6}
.ticker span{display:inline-block;animation:sc 25s linear infinite;padding-left:100%}
@keyframes sc{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}
</style></head><body>
<div class="top"><div class="logo">🚀 ALE TV ROCKET</div><div style="background:red;padding:3px 8px;border-radius:20px;font-size:11px">● LIVE</div></div>
<div id="box">
<iframe id="fr" allow="autoplay; encrypted-media" allowfullscreen></iframe>
<div id="over" onclick="tap()"></div>
<div id="hint" onclick="goLive()">▶️ RUDI LIVE</div>
<div class="ticker"><span id="tk">🚀 ALE TV ROCKET - HARAKA KULIKO BOMBA 🔥</span></div>
</div>

<script>
let vids=JSON.parse(localStorage.getItem('ale_videos')||'[{"id":"jNQXAC9IVRw","title":"ALE TV"}]');
let cur={idx:0,seek:0}; let paused=false;

function sync(){
 let total=vids.length*240;
 let now=Math.floor(Date.now()/1000)%total;
 return{idx:Math.floor(now/240),seek:now%240};
}
function loadRocket(n){
 cur=n;
 let v=vids[n.idx];
 document.getElementById('tk').innerText='🚀 LIVE: '+v.title+' - ROCKET MODE';
 // ROCKET LINK - hakuna API, direct iframe = 10x faster
 let url=`https://www.youtube-nocookie.com/embed/${v.id}?autoplay=1&mute=1&controls=0&disablekb=1&fs=0&rel=0&playsinline=1&start=${n.seek}&origin=${location.origin}`;
 document.getElementById('fr').src=url;
}
function goLive(){
 let n=sync();
 loadRocket(n);
 document.getElementById('hint').style.display='none';
 paused=false;
 // jaribu kuwasha sauti baada ya sec 1
 setTimeout(()=>{try{document.getElementById('fr').contentWindow.postMessage('{"event":"command","func":"unMute","args":""}','*')}catch{}},1000);
}
function tap(){
 if(!paused){
  document.getElementById('hint').style.display='block';
  document.getElementById('hint').innerText='⏸️ PAUSED - TAP RUDI LIVE';
  paused=true;
  // pause kwa kuficha iframe (haraka kuliko API)
  document.getElementById('fr').src='';
 }else{
  goLive();
 }
}
// LOAD PAPO HAPO - HAKUNA KUSUBIRI API
goLive();

// Auto-sync kila 25 sec kama TV ya kweli
setInterval(()=>{ if(!paused){ let n=sync(); if(n.idx!==cur.idx) loadRocket(n); }},25000);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState=='visible'&&!paused) goLive(); });
</script>
</body></html>
