<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALE TV KE LIVE</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;height:100vh;display:flex;flex-direction:column;font-family:sans-serif}#top{height:48px;background:#111;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:3px solid #f59e0b}#top b{color:#f59e0b}#clock{color:#0f0;background:#000;border:1px solid #333;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:900}#vid{flex:1;background:#000;position:relative}#vid iframe{width:100%;height:100%;border:0}#ticker{height:44px;background:#f59e0b;color:#000;display:flex;align-items:center;font-weight:900;overflow:hidden;white-space:nowrap}#ticker div{padding-left:100%;animation:scroll 25s linear infinite}#no{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#555;text-align:center}@keyframes scroll{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}</style>
</head><body>
<div id="top"><b>ALE TV KE LIVE</b><div id="clock">00:00:00</div></div>
<div id="vid"><iframe id="yt" allow="autoplay; fullscreen"></iframe><div id="no">📺 Hakuna Video<br><small>Weka YouTube kwa Admin</small></div></div>
<div id="ticker"><div id="tick">TILL 3624692 - ALE FOOTBALL ACADEMY 0703182307 - ALE TV KE LIVE</div></div>
<script>
function getId(){ return localStorage.getItem('ale_tv_id')|| (JSON.parse(localStorage.getItem('aletv_live_now')||'{}').ytid) || (JSON.parse(localStorage.getItem('ale_videos')||'[]').slice(-1)[0]?.id) || ''; }
function getTicker(){ return localStorage.getItem('ale_ticker_final') || localStorage.getItem('ale_ticker_custom') || (JSON.parse(localStorage.getItem('aletv_live_now')||'{}').desc) || 'TILL 3624692 - ALE FOOTBALL ACADEMY 0703182307'; }
function load(){ let id=getId(); let tk=getTicker(); document.getElementById('tick').innerText=tk + ' • ' + tk; if(!id){document.getElementById('no').style.display='block';return} document.getElementById('no').style.display='none'; document.getElementById('yt').src='https://www.youtube.com/embed/'+id+'?autoplay=1&mute=0&controls=1'; }
load();
setInterval(()=>{ document.getElementById('clock').innerText=new Date().toLocaleTimeString('en-GB',{timeZone:'Africa/Nairobi',hour12:false}); let nid=getId(); if(nid &&!document.getElementById('yt').src.includes(nid)) load(); let nt=getTicker(); if(nt && document.getElementById('tick').innerText.substring(0,20)!==nt.substring(0,20)) document.getElementById('tick').innerText=nt + ' • ' + nt; },2000);
</script></body></html>
