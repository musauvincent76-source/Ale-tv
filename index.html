<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ALE TV</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;height:100vh;display:flex;flex-direction:column;font-family:Arial}#top{height:45px;background:#111;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:3px solid #ff6600}#top h1{color:#fff;font-size:18px}#top span{color:#ff6600}#clock{color:#0f0;background:#000;border:1px solid #333;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:900}#vid{flex:1;background:#000}#vid iframe{width:100%;height:100%;border:0}#ads{height:50px;background:#ff6600;color:#000;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px}</style>
</head><body>
<div id="top"><h1>ALE <span>TV</span></h1><div id="clock"></div></div>
<div id="vid"><iframe id="yt" src="" allow="autoplay; fullscreen"></iframe></div>
<div id="ads">TILL 3624692 - ALE FOOTBALL ACADEMY 0703182307</div>
<script>
function load(){
 let id=localStorage.getItem('ale_tv_id')||'jNQXAC9IVRw';
 document.getElementById('yt').src='https://www.youtube.com/embed/'+id+'?autoplay=1&mute=0';
}
load();
setInterval(()=>{
 document.getElementById('clock').innerText=new Date().toLocaleTimeString('en-GB',{timeZone:'Africa/Nairobi',hour12:false});
 let nid=localStorage.getItem('ale_tv_id');
 let cur=document.getElementById('yt').src;
 if(nid && cur.indexOf(nid)==-1){load();}
},1000);
</script></body></html>
