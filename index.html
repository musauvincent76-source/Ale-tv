<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALE TV</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#000;overflow:hidden}
#top{position:absolute;top:0;left:0;right:90px;height:35px;background:#111;display:flex;align-items:center;border-bottom:3px solid #00ff88;z-index:10;overflow:hidden}
#top b{background:#00ff88;color:#000;padding:0 10px;height:100%;display:flex;align-items:center;font-size:10px}
#top span{flex:1;color:#00ff88;font-size:12px;font-weight:900;white-space:nowrap;animation:mv 30s linear infinite;display:inline-block;padding-left:10px}
@keyframes mv{0%{transform:translateX(100%)}100%{transform:translateX(-100%)}}
#clock{position:absolute;top:0;right:0;width:90px;height:35px;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:12px;border-left:3px solid #00ff88;border-bottom:3px solid #00ff88;z-index:11}
#player{position:absolute;top:35px;left:0;right:0;height:62vh;background:#000}
#player iframe{width:100%;height:100%}
#live{position:absolute;top:45px;left:10px;background:red;color:#fff;padding:5px 12px;border-radius:20px;font-size:10px;font-weight:900;z-index:5}
#logo{position:absolute;top:45px;right:10px;background:red;color:#fff;padding:5px 12px;border-radius:20px;font-size:11px;font-weight:900;z-index:5;border:2px solid #fff}
#mid{position:absolute;top:calc(35px + 62vh);left:0;right:0;height:5vh;background:#050505;display:flex;align-items:center;justify-content:center;color:#333;font-size:8px;letter-spacing:2px}
#ticker{position:absolute;top:calc(35px + 67vh);left:0;right:0;height:26px;background:#000;display:flex;align-items:center;border-top:2px solid red;border-bottom:2px solid red;overflow:hidden;z-index:6}
#ticker b{background:red;color:#fff;padding:0 10px;height:100%;display:flex;align-items:center;font-size:9px}
#ticker span{flex:1;white-space:nowrap;color:#fff;font-size:10px;font-weight:700;animation:sc 60s linear infinite;display:inline-block;padding-left:100%}
@keyframes sc{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}
#ad{position:absolute;bottom:0;left:0;right:0;height:18vh;display:flex;align-items:center;z-index:7;border-top:3px solid #fff}
#adLabel{background:#000;color:#fff;min-width:55px;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:8px;font-weight:900}
#adText{flex:1;text-align:center;font-weight:900;font-size:15px;padding:5px;animation:zoom 5s infinite}
.c1{background:linear-gradient(90deg,red,orange,red);background-size:200% 100%;animation:bg 1s linear infinite;color:#fff}
.c2{background:yellow;color:#000}
.c3{background:linear-gradient(90deg,#00ff88,#00d4ff,#00ff88);background-size:200% 100%;animation:bg 1s linear infinite;color:#000}
.c4{background:linear-gradient(90deg,#8a00ff,#ff0066,#8a00ff);background-size:300% 100%;animation:bg.6s linear infinite;color:#fff}
@keyframes bg{0%{background-position:0%}100%{background-position:200%}}
@keyframes zoom{0%{transform:scale(.1);opacity:0}15%{transform:scale(1.2);opacity:1}85%{transform:scale(1)}100%{transform:scale(.1);opacity:0}}
</style>
</head>
<body>
<div id="top"><b>🏫 ACADEMY</b><span id="desc">ALE FOOTBALL ACADEMY - JOIN US TODAY - 0703182307</span></div>
<div id="clock">00:00:00</div>
<div id="player"></div>
<div id="mid"><b>ALE TV WORLD SYNC</b></div>
<div id="ticker"><b>BREAKING</b><span id="tick">ALE TV - TILL 3624692 - YOUR HOME OF SPORTS - WORLD TV SAME TIME</span></div>
<div id="live">🔴 LIVE</div><div id="logo">ALE TV</div>
<div id="ad" class="c1"><div id="adLabel"><div id="aicon">📰</div><div id="albl">NEWS</div></div><div id="adText">LOADING...</div></div>

<script>
let player,videos=[],curIdx=0;
const BIRTH=Date.UTC(2025,0,1)/1000;
const SLOT=240; // 4 min kila video

function getId(v){
 if(!v) return '';
 v=v.trim();
 if(v.length==11 &&!v.includes('/')) return v;
 if(v.includes('youtu.be/')) return v.split('youtu.be/')[1].split(/[?&#]/)[0];
 try{ let u=new URL(v); if(u.searchParams.get('v')) return u.searchParams.get('v'); }catch{}
 let m=v.match(/([a-zA-Z0-9_-]{11})/);
 return m?m[1]:'';
}

function loadYT(cb){
 if(window.YT && window.YT.Player){ cb(); return; }
 let s=document.createElement('script');
 s.src="https://www.youtube.com/iframe_api";
 document.head.appendChild(s);
 window.onYouTubeIframeAPIReady=cb;
}

function getWorld(){
 let now=Date.now()/1000;
 let elapsed=Math.floor(now-BIRTH);
 let total=videos.length*SLOT;
 let pos=elapsed%total;
 let idx=Math.floor(pos/SLOT);
 let seek=pos%SLOT;
 return {idx,seek};
}

function playWorld(idx,seek){
 curIdx=idx;
 loadYT(()=>{
  if(player){
   player.loadVideoById({videoId:videos[idx].id,startSeconds:seek});
   return;
  }
  player=new YT.Player('player',{
   videoId:videos[idx].id,
   playerVars:{autoplay:1,mute:1,controls:1,rel:0,modestbranding:1,playsinline:1,start:seek},
   events:{
    onReady:e=>{
     e.target.playVideo();
     e.target.mute();
     setTimeout(()=>{ try{ e.target.unMute(); e.target.setVolume(100); e.target.playVideo(); }catch{} },1500);
    },
    onStateChange:e=>{
     if(e.data==0){
      let w=getWorld();
      curIdx=w.idx;
      e.target.loadVideoById({videoId:videos[w.idx].id,startSeconds:w.seek});
     }
    }
   }
  });
 });
}

// SAA
setInterval(()=>{
 let d=new Date();
 document.getElementById('clock').innerText=d.toLocaleTimeString('en-GB',{timeZone:'Africa/Nairobi',hour12:false});
},1000);

// DESCRIPTION + TICKER
function loadDesc(){
 let d=localStorage.getItem('ale_academy_desc')||'🏫 ALE FOOTBALL ACADEMY - TRAINING YOUNG TALENTS - JOIN US TODAY - 0703182307';
 document.getElementById('desc').innerText=d.toUpperCase();
 document.getElementById('tick').innerText=d.toUpperCase()+' • TILL 3624692 • ALE TV WORLD SYNC • '+new Date().toLocaleString('en-KE',{timeZone:'Africa/Nairobi'});
}
setInterval(loadDesc,4000);
loadDesc();

// ADS - STYLE KALI
let ads=[
 {i:"📰",l:"NEWS",c:"c1",t:"🔴 BREAKING NEWS LIVE ON ALE TV NOW!"},
 {i:"⚽",l:"WHAT",c:"c3",t:"WHAT WE DO: Football ⚽ Gospel 🙏 News 📰 24/7"},
 {i:"👤",l:"ALEX",c:"c4",t:"I AM ALEX MUSAU - FOUNDER ALE TV - TILL 3624692"},
 {i:"🏫",l:"ABOUT",c:"c3",t:"ABOUT US: ALE TV & ALE FOOTBALL ACADEMY - JOIN US!"},
 {i:"📢",l:"ADS",c:"c2",t:"TANGAZA BIASHARA YAKO - 100K VIEWERS - 0703182307"},
 {i:"💰",l:"TILL",c:"c1",t:"💰 TILL 3624692 - SUPPORT ALE TV - ASANTE!"},
 {i:"🌍",l:"WORLD",c:"c1",t:"🌍 KISUMU | NAIROBI | MOMBASA | UGANDA - SAME TIME!"},
];
function showAd(){
 let a=ads[Math.floor(Math.random()*ads.length)];
 document.getElementById('ad').className=a.c;
 document.getElementById('aicon').innerText=a.i;
 document.getElementById('albl').innerText=a.l;
 let el=document.getElementById('adText');
 el.style.animation='none'; void el.offsetWidth;
 el.innerText=a.t;
 el.style.animation='zoom 5s infinite';
}
showAd();
setInterval(showAd,5000);

// WORLD SYNC - INABADILISHA VIDEO TU KAMA TIME IMEFIKA, HAIZIMI SAUTI!
setInterval(()=>{
 if(!player ||!videos.length) return;
 let w=getWorld();
 if(w.idx!=curIdx){
  curIdx=w.idx;
  try{ player.loadVideoById({videoId:videos[w.idx].id,startSeconds:w.seek}); }catch{}
 }
},15000);

// LOAD VIDEOS
function init(){
 let list=[];
 try{
  let az=JSON.parse(localStorage.getItem('azamtv_ale_final_2026')||'null');
  if(az && az.playlist && az.playlist.length) list=az.playlist.map(p=>({id:getId(p.url||p.ytid||'')}));
 }catch{}
 if(!list.length){
  try{ let o=JSON.parse(localStorage.getItem('ale_videos')||'[]'); if(o.length) list=o.map(v=>({id:getId(v.id||'')})).filter(x=>x.id); }catch{}
 }
 if(!list.length) list=[{id:'jNQXAC9IVRw'},{id:'jfKfPfyJRdk'},{id:'5qap5aO4i9A'}];
 videos=list.filter(v=>v.id);
 console.log("VIDEOS",videos);
 let w=getWorld();
 playWorld(w.idx,w.seek);
}
init();
</script>
</body>
</html>
