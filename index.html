<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ALE TV HD</title><style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:sans-serif;height:100vh;width:100vw;overflow:hidden}
#top{position:fixed;top:0;left:0;right:0;height:42px;background:linear-gradient(90deg,#ff8c00,#ffae42);display:flex;align-items:center;justify-content:space-between;padding:0 14px;z-index:10}
#logo{color:#000;font-weight:900;font-size:18px}#badge{background:#000;color:#ff8c00;padding:5px 12px;border-radius:20px;font-size:10px;font-weight:900}
#stage{position:fixed;top:42px;bottom:38px;left:0;right:0;background:#000;display:flex;align-items:center;justify-content:center}
video{width:100%;height:100%;object-fit:contain;background:#000}
#footer{position:fixed;bottom:0;left:0;right:0;height:38px;background:#0f0f0f;border-top:3px solid #ff8c00;display:flex;align-items:center;overflow:hidden;z-index:10}
#ticker{white-space:nowrap;animation:scroll 20s linear infinite;color:#fff;font-size:11px;letter-spacing:1px}@keyframes scroll{from{transform:translateX(100vw)}to{transform:translateX(-100%)}}
#centerPlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.75);z-index:20;cursor:pointer}
#btn{width:88px;height:88px;background:#ff8c00;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:36px;color:#000;box-shadow:0 0 25px #ff8c00;animation:pulse 1.2s infinite}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
#infoBox{position:fixed;bottom:42px;left:10px;background:rgba(0,0,0,.7);padding:5px 10px;border-radius:8px;font-size:10px;color:#aaa;z-index:10}
</style></head><body>
<div id="top"><div id="logo">ALE TV HD</div><div id="badge">● LIVE 24/7</div></div>
<div id="stage">
<video id="tv" playsinline webkit-playsinline preload="auto" poster="https://i.ytimg.com/vi/OST6tyIh11U/maxresdefault.jpg"></video>
<div id="centerPlay" onclick="start()"><div id="btn">▶</div><div style="margin-top:14px;font-weight:900;color:#ff8c00">BONYEZA KUANZA TV</div><div style="font-size:11px;color:#aaa;margin-top:4px">Hakuna YouTube - Player yetu wenyewe</div></div>
</div>
<div id="infoBox">1/1 • Burudani</div>
<div id="footer"><div id="ticker">★ ALE TV HD ★ HAKUNA YOUTUBE PLAYER ★ PLAYER YETU WENYEWE ★ 24/7 ★ BONYEZA PLAY ★</div></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";import{getDatabase,ref,onValue}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
const db=getDatabase(initializeApp({apiKey:"AIzaSyDuf-Is10hDtjNJU7hzDqJmLT2czSXzODg",authDomain:"ale-tv.firebaseapp.com",databaseURL:"https://ale-tv-default-rtdb.firebaseio.com",projectId:"ale-tv"}));
const video=document.getElementById('tv');
let queue=[],idx=0;
// VIDEO YAKO - TUMEWEKA DIRECT LINK (bila YouTube player)
const DEFAULT_MP4=[
  {id:"OST6tyIh11U",title:"ALE TV",cat:"Burudani",url:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4",poster:"https://i.ytimg.com/vi/OST6tyIh11U/maxresdefault.jpg"}
];
function loadVideo(v){
  if(!v)return;
  video.poster=v.poster||"";
  video.src=v.url||v.link||"";
  video.load();
  document.getElementById('infoBox').innerText=`${idx+1}/${queue.length} • ${v.cat||'Burudani'} • ${v.title||''}`;
}
window.start=()=>{
  document.getElementById('centerPlay').style.display='none';
  video.muted=false; video.volume=1;
  video.play().catch(()=>{video.muted=true; video.play();});
}
video.addEventListener('ended',()=>{
  if(queue.length>1){idx=idx<queue.length-1?idx+1:0; loadVideo(queue[idx]); video.play();}
  else{video.currentTime=0; video.play();}
});
onValue(ref(db,'videos'),snap=>{
  let d=snap.val();
  if(!d){queue=DEFAULT_MP4; idx=0; loadVideo(queue[0]); return;}
  // Admin akituma YouTube link, tunai-convert kuwa mp4 placeholder - wewe utaweka link yako ya mp4 baadaye
  queue=Object.values(d).map(v=>{
    if(v.url||v.link) return v;
    // Kama bado ni YouTube ID - tunatumia poster yake lakini video ni default mpaka u-upload mp4
    return {id:v.id,title:v.title,cat:v.cat||"Burudani",url:v.mp4||DEFAULT_MP4[0].url,poster:`https://i.ytimg.com/vi/${v.id}/maxresdefault.jpg`}
  });
  idx=queue.length-1; loadVideo(queue[idx]);
});
video.addEventListener('click',()=>{if(video.paused)video.play();else video.pause();});
</script></body></html>
