<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALE TV - YOUR HOME OF SPORTS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#000;overflow:hidden}
#wrap{position:relative;width:100%;height:100vh;background:#000}
#player{width:100%;height:calc(100vh - 200px);background:#000}
#player iframe{width:100%;height:100%}
#live{position:absolute;top:12px;left:12px;background:red;color:#fff;padding:6px 14px;border-radius:20px;font-size:10px;font-weight:900;z-index:5}
#logo{position:absolute;top:12px;right:12px;background:linear-gradient(90deg,red,orange);color:#fff;padding:7px 16px;border-radius:20px;font-weight:900;font-size:12px;z-index:5;border:2px solid #fff}
#blackSpace{position:absolute;bottom:80px;left:0;right:0;height:120px;background:#000;z-index:4;display:flex;align-items:center;justify-content:center;color:#333;font-size:9px;letter-spacing:2px}
#adBox{position:absolute;bottom:0;left:0;right:0;height:80px;z-index:10;display:flex;align-items:center;overflow:hidden;border-top:3px solid #fff}
.design1{background:linear-gradient(90deg,#ff0000,#ffae00,#ff0000);background-size:300% 100%;animation:bgMove 1.5s linear infinite}
.design2{background:linear-gradient(90deg,#00ff88,#00d4ff,#00ff88);background-size:300% 100%;animation:bgMove 1s linear infinite;color:#000}
.design3{background:linear-gradient(90deg,#8a00ff,#ff00ff,#00ff88);background-size:300% 100%;animation:bgMove.8s linear infinite}
.design4{background:#000;color:#fff;border:3px solid red;animation:borderFlash.5s infinite}
.design5{background:linear-gradient(90deg,#ffff00,#ffae00,#ffff00);color:#000;background-size:200% 100%;animation:bgMove 1.2s linear infinite}
@keyframes bgMove{0%{background-position:0%}100%{background-position:300%}}
@keyframes borderFlash{0%{border-color:red}50%{border-color:yellow}100%{border-color:red}}
#adLabel{background:#000;color:#fff;font-weight:900;font-size:9px;padding:0 12px;height:100%;display:flex;align-items:center}
#adStage{flex:1;display:flex;align-items:center;justify-content:center}
#adText{font-weight:900;font-size:14px;animation:zoomPop 6s infinite;text-shadow:0 0 10px rgba(0,0,0,.8)}
@keyframes zoomPop{0%{transform:scale(.1);opacity:0}15%{transform:scale(1.4);opacity:1}25%{transform:scale(1)}85%{transform:scale(1)}100%{transform:scale(.1);opacity:0}}
#resumeBox{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:20;background:rgba(0,0,0,.9);color:#fff;padding:18px 22px;border-radius:16px;border:2px solid #00ff88;text-align:center;display:none}
#resumeBox b{color:#00ff88}
</style></head><body>
<div id="wrap">
<div id="player"></div>
<div id="blackSpace">ALE TV</div>
<div id="live">🔴 LIVE</div>
<div id="logo">ALE TV</div>
<div id="resumeBox"><b>Karibu tena!</b><br><span id="resumeTxt" style="font-size:11px"></span><br><button onclick="doResume()" style="margin-top:10px;background:#00ff88;color:#000;border:0;padding:8px 18px;border-radius:20px;font-weight:900">ENDELEA ▶️</button><br><button onclick="skipResume()" style="margin-top:6px;background:transparent;color:#fff;border:1px solid #444;padding:6px 14px;border-radius:20px;font-size:10px">ANZA UPYA</button></div>
<div id="adBox" class="design1"><div id="adLabel">⚡ ADS</div><div id="adStage"><div id="adText">TILL 3624692 - SUPPORT ALE TV</div></div></div>
</div>
<script>
let player, videos=[], cur=0, saveTimer=null, pendingResume=null;

function getId(v){ if(!v) return ''; v=v.trim(); if(v.length==11 &&!v.includes('/')) return v; if(v.includes('youtu.be/')) return v.split('youtu.be/')[1].split(/[?&#]/)[0]; try{let u=new URL(v); if(u.searchParams.get('v')) return u.searchParams.get('v');}catch{} let m=v.match(/(?:embed\/|v\/|shorts\/|v=)([a-zA-Z0-9_-]{11})/); return m?m[1]:v.substring(0,11); }
function loadYT(cb){ if(window.YT && window.YT.Player){cb();return;} let s=document.createElement('script'); s.src="https://www.youtube.com/iframe_api"; document.head.appendChild(s); window.onYouTubeIframeAPIReady=cb; }

// ==== MEMORY SYSTEM - MTU AKIRUDI ANAENDELEA ====
function saveProgress(){
 if(!player ||!videos[cur]) return;
 try{
  let t=player.getCurrentTime()||0;
  let data={idx:cur, id:videos[cur].id, time:t, savedAt:Date.now()};
  localStorage.setItem('ale_watch_progress', JSON.stringify(data));
 }catch{}
}
function getSavedProgress(){
 try{
  let d=JSON.parse(localStorage.getItem('ale_watch_progress')||'null');
  if(!d) return null;
  // kama imepita masaa 6, futa - anze upya
  if(Date.now()-d.savedAt > 6*60*60*1000) return null;
  return d;
 }catch{return null;}
}
function clearProgress(){ localStorage.removeItem('ale_watch_progress'); }

window.doResume=()=>{
 if(!pendingResume) return;
 document.getElementById('resumeBox').style.display='none';
 playVideo(pendingResume.id, pendingResume.time, pendingResume.idx);
}
window.skipResume=()=>{
 document.getElementById('resumeBox').style.display='none';
 clearProgress();
 playVideo(videos[0].id,0,0);
}

function playVideo(id, seek, idx){
 cur=idx||0;
 loadYT(()=>{
  if(player){
    player.loadVideoById({videoId:id, startSeconds:seek});
    setTimeout(()=>{ try{player.setPlaybackRate(0.9); player.playVideo();}catch{} },500);
    return;
  }
  player=new YT.Player('player',{
   videoId:id,
   playerVars:{autoplay:1,mute:1,controls:1,rel:0,modestbranding:1,playsinline:1,start:Math.floor(seek||0)},
   events:{
    onReady:e=>{
      e.target.playVideo();
      // SPEED 90% - KAMA ULISEMA
      try{ e.target.setPlaybackRate(0.9); }catch{}
      try{ e.target.unMute(); e.target.setVolume(100); e.target.setPlaybackRate(0.9); }catch{}
      // save kila 3 sec
      saveTimer=setInterval(saveProgress,3000);
    },
    onStateChange:e=>{
      try{ e.target.setPlaybackRate(0.9); }catch{}
      if(e.data==0){ // imeisha
        clearProgress();
        cur=(cur+1)%videos.length;
        e.target.loadVideoById(videos[cur].id);
      }
      if(e.data==1){ try{e.target.setPlaybackRate(0.9);}catch{} } // playing - ensure 90%
    }
   }
  });
 });
}

// ADS
let ads=["🔥 ALE TV - YOUR HOME OF SPORTS 24/7!","💰 TILL 3624692 - SUPPORT ALE TV - Alex - 0703182307","📺 TANGAZA BIASHARA YAKO - 100K VIEWERS!","⚡ ale-tv.vercel.app - LIVE POPOTE!","🎵 Mpira, Habari, Gospel - ALE TV!","🏆 FOOTBALL LIVE - ON ALE TV!"];
let ai=0, designs=["design1","design2","design3","design4","design5"];
function showAd(){
 let box=document.getElementById('adBox');
 let txt=document.getElementById('adText');
 box.className=designs[ai%designs.length];
 txt.style.animation='none'; void txt.offsetWidth;
 txt.innerText=ads[ai%ads.length];
 txt.style.animation='zoomPop 6s infinite';
 ai++;
}
showAd(); setInterval(showAd,6000);

function init(){
 let local=[];
 try{ local=JSON.parse(localStorage.getItem('ale_videos')||'[]'); }catch{}
 if(local.length){ videos=local.map(v=>({id:getId(v.id||'')} )).filter(v=>v.id.length>=10); }
 if(!videos.length){ videos=[{id:'jNQXAC9IVRw'},{id:'5qap5aO4i9A'},{id:'jfKfPfyJRdk'}]; }

 let saved=getSavedProgress();
 if(saved && videos.find(v=>v.id==saved.id)){
   let idx=videos.findIndex(v=>v.id==saved.id);
   pendingResume={id:saved.id, time:saved.time, idx:idx>=0?idx:0};
   document.getElementById('resumeTxt').innerText=`Uliishia sec ${Math.floor(saved.time)} - Video ${idx+1}`;
   document.getElementById('resumeBox').style.display='block';
   // auto-resume baada ya 3 sec kama hakubonyeza
   setTimeout(()=>{ if(document.getElementById('resumeBox').style.display!='none'){ doResume(); } },4000);
 }else{
   playVideo(videos[0].id,0,0);
 }

 // mtu akitoka online
 window.addEventListener('beforeunload', saveProgress);
 document.addEventListener('visibilitychange', ()=>{ if(document.hidden) saveProgress(); });
 setInterval(()=>{ if(!document.hidden) saveProgress(); },5000);
}
init();
</script></body></html>
