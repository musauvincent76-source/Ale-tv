<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALE TV</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#000;color:#fff;height:100vh;display:flex;flex-direction:column;overflow:hidden}
#top{height:40px;background:#111;display:flex;align-items:center;border-bottom:3px solid #00ff88;flex-shrink:0}
#top b{background:#00ff88;color:#000;padding:0 12px;height:100%;display:flex;align-items:center;font-size:10px}
#top span{flex:1;padding-left:10px;font-size:11px;font-weight:900;color:#00ff88;white-space:nowrap;overflow:hidden}
#top #clock{width:85px;background:#000;border-left:2px solid #00ff88;height:100%;display:flex;align-items:center;justify-content:center;font-weight:900;flex-shrink:0}
#video{flex:1;background:#000}
#video iframe{width:100%;height:100%;border:0}
#bottom{height:32px;background:#000;border-top:2px solid red;display:flex;align-items:center;flex-shrink:0;overflow:hidden}
#bottom b{background:red;padding:0 10px;height:100%;display:flex;align-items:center;font-size:9px;flex-shrink:0}
#bottom span{color:#fff;font-size:11px;padding-left:10px;white-space:nowrap}
#btn{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#00ff88;color:#000;border:0;padding:20px 40px;border-radius:30px;font-weight:900;font-size:18px;z-index:999}
</style>
</head>
<body>

<div id="top">
  <b>ALE TV</b>
  <span id="desc">ALE FOOTBALL ACADEMY - 0703182307 - TILL 3624692</span>
  <div id="clock">00:00</div>
</div>

<div id="video"><div id="player"></div></div>

<div id="bottom"><b>BREAKING</b><span>TILL 3624692 - ADVERTISE WITH US - ALE TV PUBLIC</span></div>

<button id="btn" onclick="startTV()">▶️ BONYEZA HAPA TV ICHEZE</button>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
let player;
function onYouTubeIframeAPIReady(){
 player = new YT.Player('player',{
  videoId: 'jNQXAC9IVRw',
  playerVars: {autoplay:1,mute:1,controls:1,rel:0,playsinline:1},
  events: {
   onReady: e => e.target.playVideo()
  }
 });
}
function startTV(){
 document.getElementById('btn').style.display='none';
 player.playVideo();
 player.unMute();
 player.setVolume(100);
}
setInterval(()=>{
 document.getElementById('clock').innerText = new Date().toLocaleTimeString('en-GB',{timeZone:'Africa/Nairobi',hour12:false});
},1000);
</script>
</body>
</html>
