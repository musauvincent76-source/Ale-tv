<!-- BADILISHA DIV YA playerWrap PEKEE na hii -->

<div id="playerWrap" style="width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;position:relative">
  <div id="player"></div>
  <!-- CITIZEN TV STYLE LOWER THIRD -->
  <div style="position:absolute;bottom:40px;left:0;right:0;display:flex;align-items:flex-end;pointer-events:none">
    <div style="background:#cc0000;color:#fff;padding:6px 14px;font-weight:900;font-size:11px;letter-spacing:1px">AZAM ALE TV</div>
    <div style="background:rgba(0,0,0,0.85);color:#fff;padding:6px 12px;flex:1;font-weight:700;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" id="nowT">Loading...</div>
    <div style="background:#ff6a00;color:#000;padding:6px 10px;font-weight:900;font-size:10px">LIVE</div>
  </div>
  <!-- SCROLLING TICKER KAMA CITIZEN TV -->
  <div style="position:absolute;bottom:0;left:0;right:0;background:#cc0000;height:28px;display:flex;align-items:center;overflow:hidden">
    <div style="background:#fff;color:#cc0000;padding:2px 8px;font-weight:900;font-size:10px;margin-left:4px;border-radius:2px;white-space:nowrap">BREAKING</div>
    <div style="flex:1;overflow:hidden;white-space:nowrap;margin-left:8px">
      <div id="scrollName" style="display:inline-block;color:#fff;font-weight:700;font-size:12px;animation:scroll 15s linear infinite;white-space:nowrap">
        AZAM ALE TV KE LIVE - TILL 3624692 - 
      </div>
    </div>
  </div>
</div>

<style>
@keyframes scroll{0%{transform:translateX(100%)}100%{transform:translateX(-100%)}}
</style>

<script>

}
// Weka hii ndani ya function yako ya save() / render()
</script>
