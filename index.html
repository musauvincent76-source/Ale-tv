<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADMIN ALE TV</title><style>body{background:#020c1b;color:#fff;font-family:sans-serif;padding:15px}input{width:100%;padding:12px;border-radius:8px;border:0;margin:8px 0}button{width:100%;padding:14px;background:#ff6600;border:0;border-radius:10px;color:#fff;font-weight:bold;margin-top:10px}code{background:#0a1931;padding:10px;display:block;margin-top:10px;border-radius:8px;word-break:break-all}</style></head><body>
<h2>ALE TV ADMIN</h2>
<input id="yturl" placeholder="Weka YouTube Link hapa (mf: https://youtu.be/...)">
<input id="title" placeholder="Jina la Show (mf: Kampango LIVE)">
<button onclick="gen()">Tengeneza Code Mpya</button>
<code id="out">Code itatokea hapa...</code>
<button style="background:#112240" onclick="copy()">Copy Code</button>
<script>
function getId(u){if(u.includes('youtu.be/'))return u.split('youtu.be/')[1].split('?')[0];if(u.includes('v='))return u.split('v=')[1].split('&')[0];return u;}
function gen(){let url=document.getElementById('yturl').value;let t=document.getElementById('title').value||'LIVE NOW';let id=getId(url);if(!id)return alert('Weka Link sahihi!');let c=`ID mpya: ${id} | Title: ${t} \n\nNenda kwenye index.html, badilisha line: \nlet id = cur? getYtId(cur.url) : '${id}'; \nna \nlet title = cur? cur.title : '${t}';`;document.getElementById('out').innerText=c;localStorage.setItem('azamtv_ale_final_2026',JSON.stringify({playlist:[{url:url,title:t,status:'playing'}]}));alert('Imehifadhiwa kwenye simu yako! Sasa nenda index.html ubadilishe ID kama nilivyokuonyesha juu ili watu wote waione');}
function copy(){let o=document.getElementById('out').innerText;navigator.clipboard.writeText(o);alert('Copied!');}
</script></body></html>
