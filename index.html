<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALE TV KENYA - LIVE</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:sans-serif}
.topbar{background:#0a0a0a;display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:2px solid #f59e0b}
.logo{font-weight:900;font-size:20px;color:#f59e0b}.live-badge{background:red;color:#fff;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:bold;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.5}}
.player{width:100%;height:62vh;background:#000;position:relative}
#main{width:100%;height:100%}
.ticker{position:absolute;bottom:0;left:0;right:0;background:#b80000;height:28px;display:flex;align-items:center;overflow:hidden;z-index:5}
.ticker-text{white-space:nowrap;animation:scroll 35s linear infinite;font-size:13px;margin-left:10px;font-weight:bold}
@keyframes scroll{0%{transform:translateX(100%)}100%{transform:translateX(-100%)}}
.info{padding:10px;background:#111}
.desc-box{margin-top:6px;color:#ccc;font-size:13px;background:#1a1a1a;padding:7px;border-radius:5px;border-left:3px solid #f59e0b}
#loader{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#f59e0b;font-weight:900;text-align:center}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px;background:#0a0a0a}
.chip{background:#1a1a1a;border:1px solid #333;color:#fff;padding:6px 12px;border-radius:20px;font-size:12px;white-space:nowrap;cursor:pointer}
.chip.active{background:#f59e0b;color:#000;font-weight:900}
</style></head><body>
<div class="topbar"><div class="logo">🔥 ALE TV KENYA</div><div class="live-badge">● LIVE KE</div></div>
<div class="chips" id="chips"></div>
<div class="player"><div id="loader">⏳ Inapakia TV ya Kenya...</div><div id="main"></div><div class="ticker"><span class="ticker-text" id="ticker">🔥 ALE TV KENYA - CITIZEN | NTV | KTN | INOORO - LIVE 24/7 🔥</span></div></div>
<div class="info"><h3 id="vTitle" style="margin:0;font-size:16px">Inapakia...</h3><small id="vCat" style="color:#f59e0b">LIVE</small><div id="vDesc" class="desc-box">Karibu ALE TV Kenya</div></div>

<script>
// CHANNEL ZA KENYA LIVE - HIZI NDIZO ZITACHEZA
let kenyaChannels = [
  {id:'5m6U9WqXb2k', title:'CITIZEN TV KENYA LIVE', cat:'LIVE', desc:'Citizen TV Live - Habari Kenya', isLive:true},
  {id:'Dk8Wv5d8a2g', title:'NTV KENYA LIVE', cat:'HABARI', desc:'NTV Kenya Live 24/7', isLive:true},
  {id:'o3ZuiOJOyFg', title:'KTN NEWS KENYA LIVE', cat:'HABARI', desc:'KTN News Live', isLive:true},
  {id:'jNQXAC9IVRw', title:'INOORO TV LIVE', cat:'BURUDANI', desc:'Inooro TV - Kikuyu Live', isLive:false}
];

let cached = localStorage.getItem('ale_ke');
let videos = cached? JSON.parse(cached) : kenyaChannels;
let currentIdx = 0, player = null;

function renderChips(){
  let c=document.getElementById('chips'); c.innerHTML='';
  videos.forEach((v,i)=>{
    let b=document.createElement('div'); b.className='chip'+(i==currentIdx?' active':'');
    b.innerText=v.cat+' - '+v.title.split(' ')[0]; b.onclick=()=>{playChannel(i)};
    c.appendChild(b);
  });
}
function updateInfo(v){
  if(!v) return;
  document.getElementById('vTitle').innerText=v.title;
  document.getElementById('vCat').innerText=v.cat;
  document.getElementById('vDesc').innerText=v.desc;
  document.getElementById('loader').style.display='none';
  renderChips();
}
function playChannel(i){
  currentIdx=i; let v=videos[i]; updateInfo(v);
  if(player) player.loadVideoById({videoId:v.id});
  else initPlayer();
}
function initPlayer(){
  let v=videos[currentIdx]; updateInfo(v);
  player=new YT.Player('main',{
    videoId: v.id,
    playerVars:{autoplay:1,mute:1,controls:0,rel:0,playsinline:1},
    events:{
      onReady:e=>{e.target.playVideo(); setTimeout(()=>{try{e.target.unMute()}catch{}},600);},
      onStateChange:e=>{ if(e.data==0){ currentIdx=(currentIdx+1)%videos.length; playChannel(currentIdx); }}
    }
  });
}
</script>
<script src="https://www.youtube.com/iframe_api" async></script>
<script>window.onYouTubeIframeAPIReady=initPlayer;</script>

<script type="module">
// Kama umeweka kitu admin, ita-merge na hizi za Kenya
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {getDatabase,ref,get} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
const cfg={apiKey:"AIzaSyDuf-Is10hDtjNJU7hzDqJmLT2czSXzODg",authDomain:"ale-tv.firebaseapp.com",databaseURL:"https://ale-tv-default-rtdb.firebaseio.com",projectId:"ale-tv",storageBucket:"ale-tv.firebasestorage.app",messagingSenderId:"548271956392",appId:"1:548271956392:web:6993343a96da96f7757d9d"};
const app=initializeApp(cfg);const db=getDatabase(app);
setTimeout(async()=>{
 try{
  let snap=await get(ref(db,'videos')); let data=snap.val(); if(!data) return;
  let adminV=Object.values(data).reverse().map(v=>({id:v.id,title:v.title,cat:v.cat||'LIVE',desc:v.desc||'',isLive:!!v.isLive}));
  if(adminV.length>0){ videos=[...adminV,...kenyaChannels]; localStorage.setItem('ale_ke',JSON.stringify(videos)); renderChips(); }
 }catch{}
},2000);
</script></body></html>
