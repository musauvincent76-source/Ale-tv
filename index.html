<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALE TV v4</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:sans-serif}
.top{background:#0f172a;padding:12px;display:flex;justify-content:space-between;align-items:center}
.live{background:red;padding:5px 12px;border-radius:20px;font-size:12px}
#player{width:100%;height:56vw;max-height:380px;background:#111}
#player iframe{width:100%;height:100%;border:0}
.meta{padding:12px;background:#0a0a1a}
.meta h2{margin:0 0 4px 0;font-size:18px}
.meta small{color:#94a3b8}
.desc{color:#cbd5e1;font-size:13px;margin-top:6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px}
.card{background:#1e293b;border-radius:12px;overflow:hidden}
.th{height:90px;background:#222;display:flex;align-items:center;justify-content:center}
.btn{margin:10px;width:95%;padding:12px;background:#f59e0b;border:none;border-radius:10px;font-weight:bold}
</style></head><body>
<div class="top"><b>AZAM ALE TV v4</b><span class="live">● LIVE</span></div>
<div id="player"></div>
<div class="meta"><h2 id="t">Inapakia...</h2><small id="c"></small><div class="desc" id="d"></div></div>
<button class="btn" onclick="location.reload()">🔄 Refresh TV</button>
<div id="list" class="grid"></div>
<script>
function getV(){try{return JSON.parse(localStorage.getItem('ale_videos')||'[]')}catch(e){return []}}
let defaults=[{id:'L49A0bQkf_I',title:'Zipporah - Worship',desc:'Wimbo mzuri wa kumwabudu Mungu, live performance',cat:'Muziki'}];
let all=getV().length>0?getV():defaults;
function play(v){
 document.getElementById('player').innerHTML='<iframe src="https://www.youtube.com/embed/'+v.id+'?autoplay=1&rel=0" allowfullscreen></iframe>';
 document.getElementById('t').innerText=v.title;
 document.getElementById('c').innerText=v.cat+' • LIVE NOW';
 document.getElementById('d').innerText=v.desc||'';
 window.scrollTo(0,0);
}
function draw(){
 let h=''; for(let i=all.length-1;i>=0;i--){let v=all[i]; h+='<div class="card" onclick=\'play('+JSON.stringify(v).replace(/'/g,"&#39")+')\'><div class="th">▶️</div><div style="padding:8px"><b>'+v.title+'</b><br><small style=color:#94a3b8>'+v.cat+'</small></div></div>';}
 document.getElementById('list').innerHTML=h; if(all.length>0) play(all[all.length-1]);
}
draw();
let last=JSON.stringify(getV()); setInterval(()=>{let cur=JSON.stringify(getV()); if(cur!==last){last=cur; all=getV().length>0?getV():defaults; draw();}},1000);
</script></body></html>
