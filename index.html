<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://www.youtube.com">
<link rel="preconnect" href="https://www.gstatic.com">
<title>ALE TV - LIVE</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:sans-serif;overflow:hidden}
.topbar{background:#0a0a0a;display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-bottom:2px solid #f59e0b}
.logo{font-weight:900;color:#f59e0b}
.greet{font-size:11px;color:#f59e0b;border:1px solid #333;padding:4px 8px;border-radius:15px;background:#111}
.player{width:100%;height:68vh;background:#000;position:relative}
#main{width:100%;height:100%}
.clock{position:absolute;top:8px;right:8px;background:#000d;padding:4px 8px;border-radius:4px;font-size:12px;color:#f59e0b;z-index:9}
.ticker{position:absolute;bottom:0;left:0;right:0;background:#b80000;height:30px;display:flex;align-items:center;overflow:hidden;z-index:9}
.ticker-text{white-space:nowrap;animation:scroll 40s linear infinite;font-size:13px;font-weight:bold}
@keyframes scroll{0%{transform:translateX(100vw)}100%{transform:translateX(-100%)}}
.info{padding:10px;background:#111}
.desc{margin-top:6px;color:#ccc;font-size:13px;background:#1a1a1a;padding:7px 9px;border-radius:6px;border-left:3px solid #f59e0b}
</style></head><body>
<div class="topbar"><div class="logo">🔥 ALE TV</div><div class="greet" id="greet">Loading...</div><div style="background:red;color:#fff;padding:4px 10px;border-radius:15px;font-size:11px;font-weight:900">● LIVE</div></div>
<div class="player"><div class="clock" id="clock">--:--:--</div><div id="main"></div><div class="ticker"><span style="background:#fff;color:#b80000;padding:3px 8px;font-weight:900;font-size:11px;border-radius:3px;margin-left:5px" id="cat">LIVE</span><span class="ticker-text" id="tick"> ALE TV - TV YA KWELI DUNIANI </span></div></div>
<div class="info"><h3 id="title" style="margin:0">ALE TV</h3><div id="desc" class="desc">Karibu...</div></div>

<script>
// 1. GREETING HARAKA - inafanya kazi mara moja
let h=new Date().getHours();
let greetText=h>=5&&h<12?'☀️ Good Morning | Habari ya Asubuhi':h<16?'🌤️ Good Afternoon | Mchana':h<19?'🌇 Good Evening | Jioni':'🌙 Good Night | Usiku';
document.getElementById('greet').innerText=greetText;
setInterval(()=>document.getElementById('clock').innerText=new Date().toLocaleTimeString(),1000);

// 2. VIDEO YA HARAKA
let vids=[{id:'jNQXAC9IVRw',title:'ALE TV LIVE',cat:'LIVE',desc:'Karibu ALE TV - TV ya kweli duniani',isLive:0}];
let player;
function upd(v){document.getElementById('title').innerText=v.title;document.getElementById('cat').innerText=v.cat;document.getElementById('desc').innerText=v.desc;document.getElementById('tick').innerText=' 🔥 '+v.title+' | '+v.desc+' | '+greetText+' 🔥 ';}

window.onYouTubeIframeAPIReady=()=>{upd(vids[0]);player=new YT.Player('main',{videoId:vids[0].id,playerVars:{autoplay:1,mute:1,controls:0,modestbranding:1,rel:0,playsinline:1},events:{onReady:e=>{e.target.playVideo();setTimeout(()=>{try{e.target.unMute()}catch{}},500)}}})};
</script>
<script src="https://www.youtube.com/iframe_api" async></script>

<script type="module">
// 3. FIREBASE INAKUJA BAADAYE - haisuii TV
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";import{getDatabase,ref,onValue}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
const cfg={apiKey:"AIzaSyDuf-Is10hDtjNJU7hzDqJmLT2czSXzODg",authDomain:"ale-tv.firebaseapp.com",databaseURL:"https://ale-tv-default-rtdb.firebaseio.com",projectId:"ale-tv"};
const app=initializeApp(cfg);const db=getDatabase(app);
onValue(ref(db,'videos'),s=>{
 let d=s.val();if(!d)return;let a=Object.values(d).reverse();
 if(a[0]&&player){upd(a[0]);player.loadVideoById(a[0].id);}
});
onValue(ref(db,'ticker'),s=>{let t=s.val();if(t&&t.text)document.getElementById('tick').innerText=' 🔥 '+t.text+' 🔥 ';});
</script>
</body></html>
