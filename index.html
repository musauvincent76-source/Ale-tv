<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALE TV v7 - LIVE</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:sans-serif}
.header{background:#111;padding:10px;text-align:center;color:#f59e0b;font-weight:bold}
.player{width:100%;aspect-ratio:16/9;background:#000}
.card{background:#1e293b;margin:8px;padding:10px;border-radius:10px}
a{color:#f59e0b;text-decoration:none}
</style>
</head>
<body>
<div class="header">🔥 ALE TV v7 - LIVE 🔥<br><a href="admin.html" style="font-size:12px;color:#888">Fungua FOLDER 1 (Wewe tu)</a></div>
<div id="main" class="player"></div>
<h3 style="padding:10px" id="title"></h3>
<div id="list"></div>
<script>
function getV(){return JSON.parse(localStorage.getItem('ale_videos')||'[]')}
let v=getV();
if(v.length==0){v=[{id:'dQw4w9WgXcQ',title:'Karibu ALE TV - Weka video kwenye Folder 1'}];}
let cur=v[v.length-1];
document.getElementById('main').innerHTML='<iframe width="100%" height="100%" src="https://www.youtube.com/embed/'+cur.id+'?autoplay=1" frameborder="0" allowfullscreen></iframe>';
document.getElementById('title').innerText=cur.title;
let h='';
for(let i=v.length-1;i>=0;i--){
h+='<div class="card" onclick="play(\''+v[i].id+'\',\''+v[i].title+'\')"><b>'+v[i].title+'</b></div>';
}
document.getElementById('list').innerHTML=h;
function play(id,t){document.getElementById('main').innerHTML='<iframe width="100%" height="100%" src="https://www.youtube.com/embed/'+id+'?autoplay=1" frameborder="0" allowfullscreen></iframe>';document.getElementById('title').innerText=t;window.scrollTo(0,0);}
</script>
</body>
</html>
