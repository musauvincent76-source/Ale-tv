<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AZAM ALE TV - LIVE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050a14;color:#fff;font-family:sans-serif}
header{background:linear-gradient(90deg,#001a4d,#002a7a);padding:14px;display:flex;justify-content:space-between;align-items:center}
header span{color:#ff6600}
.badge{background:#ff0033;padding:4px 10px;border-radius:20px;font-size:11px}
#playerWrap{width:100%;aspect-ratio:16/9;background:#000;position:relative}
#playerWrap iframe{width:100%;height:100%;border:0;position:absolute;top:0;left:0}
.info{padding:15px;background:#0a1430}
.title{font-weight:900;font-size:17px}
.btn{width:90%;margin:10px auto;display:block;padding:14px;background:#ff6600;border:0;border-radius:10px;color:#fff;font-weight:bold}
</style>
</head>
<body>
<header><b>AZAM <span>ALE TV</span></b><span class="badge">● LIVE NOW</span></header>
<div id="playerWrap"><div id="yt"></div></div>
<div class="info"><div class="title" id="vTitle">Karibu ALE TV</div><div style="font-size:11px;opacity:.6">HD Auto Quality - Haikatiki</div></div>
<button class="btn" onclick="location.reload()">🔄 REFRESH TV</button>
<script>
const KEY='azamtv_ale_final_2026';
function getYtId(u){
 if(!u)return '';
 if(u.includes('youtu.be/')) return u.split('youtu.be/')[1].split('?')[0].split('&')[0];
 if(u.includes('v=')) return u.split('v=')[1].split('&')[0];
 return u;
}
(function(){
 let st=null;
 try{ st=JSON.parse(localStorage.getItem(KEY)); }catch(e){}
 let cur = st && st.playlist? (st.playlist.find(p=>p.status==='playing')||st.playlist[0]) : null;
 let id = cur? getYtId(cur.url) : 'jNQXAC9IVRw';
 let title = cur? cur.title : 'Kampango - Burudani';
 document.getElementById('vTitle').innerText = title;
 document.getElementById('yt').innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&mute=1&playsinline=1&controls=1&rel=0&modestbranding=1&vq=hd720" allow="autoplay; fullscreen" allowfullscreen></iframe>`;
})();
</script>
</body>
</html>
