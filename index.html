<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AZAM ALE TV KE LIVE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#000;color:#fff;overflow:hidden}
#tv{width:100vw;height:100vh;position:relative;background:#000}
#player{width:100%;height:100%}
.lower{position:absolute;bottom:32px;left:0;right:0;display:flex;z-index:2}
.red{background:#cc0000;color:#fff;padding:8px 14px;font-weight:900;font-size:12px}
.black{background:rgba(0,0,0,0.85);color:#fff;padding:8px 12px;flex:1;font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live{background:#ff6a00;color:#000;padding:8px 12px;font-weight:900;font-size:11px}
.ticker{position:absolute;bottom:0;left:0;right:0;background:#cc0000;height:32px;display:flex;align-items:center;overflow:hidden;z-index:2}
.break{background:#fff;color:#cc0000;padding:3px 8px;font-weight:900;font-size:10px;margin-left:6px;border-radius:2px}
.scroll{flex:1;overflow:hidden;white-space:nowrap;margin-left:10px}
.scroll span{display:inline-block;color:#fff;font-weight:700;font-size:13px;animation:scr 18s linear infinite}
@keyframes scr{0%{transform:translateX(100%)}100%{transform:translateX(-100%)}}
</style>
</head>
<body>
<div id="tv">
<div id="player"></div>
<div class="lower"><div class="red">AZAM ALE TV</div><div class="black" id="nowTitle">Loading...</div><div class="live">● LIVE</div></div>
<div class="ticker"><div class="break">BREAKING</div><div class="scroll"><span id="scrollTxt">AZAM ALE TV KE LIVE | TILL 3624692 |</span></div></div>
</div>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
let playlist=JSON.parse(localStorage.getItem('azam_v3')||'[]');
let cur=parseInt(localStorage.getItem('azam_cur3')||'0');
let player;
function renderTV(){if(playlist[cur]){document.getElementById('nowTitle').textContent=playlist[cur].title;document.getElementById('scrollTxt').textContent=`🔴 LIVE: ${playlist[cur].title.toUpperCase()} | ${playlist[cur].cat} | TILL 3624692 | AZAM ALE TV KE LIVE |`;}}
function onYouTubeIframeAPIReady(){
if(playlist.length==0)playlist=[{id:'2dIjeG0d2Xw',title:'HURUMA - STEPHEN KASOLO',cat:'Burudani'}];
player=new YT.Player('player',{videoId:playlist[cur]?.id||'2dIjeG0d2Xw',width:'100%',height:'100%',playerVars:{autoplay:1,controls:1,rel:0,playsinline:1},events:{onReady:e=>{e.target.playVideo();renderTV();},onStateChange:e=>{if(e.data==0){cur=(cur+1)%playlist.length;localStorage.setItem('azam_cur3',cur);player.loadVideoById(playlist[cur].id);renderTV();}}}});
}
setInterval(()=>{let p=JSON.parse(localStorage.getItem('azam_v3')||'[]');let c=parseInt(localStorage.getItem('azam_cur3')||'0');if(p.length!=playlist.length||c!=cur){playlist=p;cur=c;if(player&&playlist[cur]){player.loadVideoById(playlist[cur].id);renderTV();}}},2000);
</script>
</body>
</html>
