<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{margin:0;background:#0f0f1a;color:#fff;font-family:sans-serif}#top{padding:10px;background:#000;display:flex;justify-content:space-between}iframe{width:100%;height:55vh;border:0}#unmute{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#ff6a00;color:#fff;padding:15px 20px;border-radius:30px;font-weight:bold;z-index:10;border:0;animation:pulse 1s infinite}@keyframes pulse{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.1)}}.wrap{position:relative}</style>
</head>
<body>
<div id="top"><b>AZAM ALE TV</b><span style="background:red;padding:2px 8px;border-radius:10px;font-size:12px">● LIVE NOW</span></div>
<div class="wrap">
<button id="unmute" onclick="unmute()">🔊 GUSA HAPA KUWASHA SAUTI</button>
<div id="player"></div>
</div>
<script>
var tag=document.createElement('script');tag.src="https://www.youtube.com/iframe_api";document.head.appendChild(tag);
var player;
function onYouTubeIframeAPIReady(){player=new YT.Player('player',{videoId:'W6IsAStN2NY',playerVars:{autoplay:1,mute:1,playsinline:1},events:{onStateChange:onState}})}
function onState(e){if(e.data==1){document.getElementById('unmute').style.display='block'}}
function unmute(){player.unMute();player.setVolume(100);player.playVideo();document.getElementById('unmute').style.display='none'}
document.body.addEventListener('click',function(){if(player&&player.isMuted&&player.isMuted()){unmute()}},{once:true});
</script>
</body>
</html>
