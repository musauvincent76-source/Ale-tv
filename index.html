<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>ALE TV - WORLD SYNC 24/7</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:sans-serif;overflow:hidden;height:100vh;width:100vw}#playerWrap{position:fixed;top:0;left:0;width:100vw;height:100vh}#player{width:100%;height:100%}#black{position:fixed;top:0;left:0;width:100vw;height:100vh;background:#000;z-index:50;display:none;align-items:center;justify-content:center;flex-direction:column}#info{position:fixed;top:10px;left:10px;background:rgba(0,0,0,.8);padding:6px 10px;border-radius:20px;font-size:11px;z-index:10;border:1px solid #f59e0b;color:#f59e0b}#live{position:fixed;top:10px;right:10px;background:red;padding:4px 10px;border-radius:4px;font-size:11px;font-weight:900;z-index:10;animation:blink 1s infinite}@keyframes blink{0%,100%{opacity:1}50%{opacity:.5}}</style></head><body>
<div id="info">ALE TV • WORLD SYNC</div><div id="live">● LIVE</div><div id="playerWrap"><div id="player"></div></div>
<div id="black"><h1 style="color:#f59e0b">ALE TV</h1><p style="margin-top:10px;color:#aaa">Inarudia queue... 24/7</p></div>
<script src="https://www.youtube.com/iframe_api"></script>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";import{getDatabase,ref,onValue}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
const cfg={apiKey:"AIzaSyDuf-Is10hDtjNJU7hzDqJmLT2czSXzODg",authDomain:"ale-tv.firebaseapp.com",databaseURL:"https://ale-tv-default-rtdb.firebaseio.com",projectId:"ale-tv"};const app=initializeApp(cfg);const db=getDatabase(app);

let player,queue=[],qIndex=0,currentId=null,ytReady=false;

function playWorld(video,force=false){
 if(!ytReady||!video)return;
 if(!force && currentId===video.id)return;
 currentId=video.id;
 let startSec=0;
 if(!video.isLive){
   let created=video.createdAt||video.created||Date.now();
   let elapsed=Math.floor((Date.now()-created)/1000);
   startSec=Math.max(0,elapsed);
   document.getElementById('info').innerText=`${video.title||'ALE TV'} • ${Math.floor(elapsed/60)}min elapsed`;
 }else{
   document.getElementById('info').innerText=`🔴 ${video.title||'LIVE'} • LIVE NOW`;
 }
 document.getElementById('black').style.display='none';
 if(player && player.loadVideoById){
   player.loadVideoById({videoId:video.id,startSeconds:startSec});
   player.playVideo();
 }else{
   player=new YT.Player('player',{videoId:video.id,playerVars:{autoplay:1,controls:0,rel:0,modestbranding:1,start:startSec},events:{onReady:e=>{e.target.seekTo(startSec,true);e.target.playVideo();},onStateChange:(e)=>{
     if(e.data===0){
       if(queue.length>0){
         if(qIndex < queue.length-1){qIndex++;playWorld(queue[qIndex],true);}
         else{
           // 🔁 AUTO-REPEAT - RUDIA MWANZO
           qIndex=0;
           playWorld(queue[0],true);
         }
       }else{document.getElementById('black').style.display='flex';}
     }
   }}});
 }
}
window.onYouTubeIframeAPIReady=()=>{ytReady=true;if(queue.length>0)playWorld(queue[qIndex],true);};
onValue(ref(db,'videos'),snap=>{
 let data=snap.val();
 if(!data){queue=[];document.getElementById('black').style.display='flex';return;}
 let newQueue=Object.entries(data).sort((a,b)=>(a[1].createdAt||a[1].created||0)-(b[1].createdAt||b[1].created||0)).map(e=>e[1]);
 // Angalia kama kuna mpya iliyoongezwa - ndio true TV
 if(newQueue.length>queue.length){
   let latest=newQueue[newQueue.length-1];
   queue=newQueue;
   qIndex=newQueue.length-1;
   playWorld(latest,true);
 }else{
   // kama ni delete tu, update queue bila kuruka
   if(queue.length===0){queue=newQueue;playWorld(queue[qIndex],true);}
   else{queue=newQueue;if(qIndex>=queue.length)qIndex=0;}
 }
});
</script></body></html>
