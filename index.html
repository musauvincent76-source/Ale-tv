<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALE TV</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden}
#wrap{position:relative;width:100%;height:100vh;background:#000}
/* TV IMEPANDA JUU - IMEACHA NYEUSI NYINGI CHINI */
#player{width:100%;height:58vh;background:#000}
#player iframe{width:100%;height:100%}
#live{position:absolute;top:10px;left:10px;background:red;color:#fff;padding:5px 12px;border-radius:20px;font-size:10px;font-weight:900;z-index:5}
#logo{position:absolute;top:10px;right:10px;background:red;color:#fff;padding:6px 14px;border-radius:20px;font-weight:900;font-size:12px;z-index:5;border:2px solid #fff}
/* HAPA NDIPO NYEUSI ULIYOSEMA - 2 INCHES */
#blackZone{position:absolute;top:58vh;left:0;right:0;height:22vh;background:#050505;z-index:4;display:flex;align-items:center;justify-content:center;flex-direction:column;border-top:2px solid #111;border-bottom:2px solid #111}
#blackZone b{color:#222;font-size:9px;letter-spacing:3px}
#blackZone small{color:#333;font-size:8px;margin-top:4px}
/* ADS - HAPA CHINI KAMA ULIACHA */
#adBox{position:absolute;bottom:0;left:0;right:0;height:20vh;z-index:10;display:flex;align-items:center;border-top:3px solid #fff}
.d1{background:linear-gradient(90deg,red,orange,red);background-size:300% 100%;animation:m 1.5s linear infinite}
.d2{background:linear-gradient(90deg,#00ff88,#00d4ff,#00ff88);background-size:300% 100%;animation:m 1s linear infinite}
.d3{background:linear-gradient(90deg,#8a00ff,#ff00ff,#8a00ff);background-size:300% 100%;animation:m.8s linear infinite}
@keyframes m{0%{background-position:0%}100%{background-position:300%}}
#adLabel{background:#000;color:#fff;padding:0 10px;height:100%;display:flex;align-items:center;font-size:9px;font-weight:900}
#ad{flex:1;text-align:center;font-weight:900;font-size:14px;animation:z 6s infinite;color:#fff}
@keyframes z{0%{transform:scale(.1);opacity:0}15%{transform:scale(1.3);opacity:1}25%{transform:scale(1)}85%{transform:scale(1)}100%{transform:scale(.1);opacity:0}}
</style></head><body>
<div id="wrap">
<div id="player"></div>
<div id="blackZone"><b>ALE TV - YOUR HOME OF SPORTS</b><small>TILL 3624692 • SPACE YA VITU ZINGINE HAPA</small></div>
<div id="live">🔴 LIVE</div>
<div id="logo">ALE TV</div>
<div id="adBox" class="d1"><div id="adLabel">ADS</div><div id="ad" style="flex:1;display:flex;justify-content:center"><span id="adTxt">TILL 3624692</span></div></div>
</div>
<script>
let player, videos=[], cur=0;
const SLOT = 240; // kila video 4 min
function getId(v){ if(!v) return ''; v=v.trim(); if(v.length==11&&!v.includes('/')) return v; if(v.includes('youtu.be/')) return v.split('youtu.be/')[1].split(/[?&#]/)[0]; try{let u=new URL(v); if(u.searchParams.get('v')) return u.searchParams.get('v');}catch{} let m=v.match(/([a-zA-Z0-9_-]{11})/); return m?m[1]:''; }
function loadYT(cb){ if(window.YT&&window.YT.Player){cb();return;} let s=document.createElement('script'); s.src="https://www.youtube.com/iframe_api"; document.head.appendChild(s); window.onYouTubeIframeAPIReady=cb; }

function getBirth(){
  let b=localStorage.getItem('ale_birth');
  if(!b){ b=Date.now().toString(); localStorage.setItem('ale_birth', b); }
  return parseInt(b);
}

function findNow(){
  let birth=getBirth();
  let elapsed=Math.floor((Date.now()-birth)/1000); // sec tangu TV ianze mara ya kwanza
  let totalSlot=videos.length*SLOT;
  let pos=elapsed%totalSlot;
  let idx=Math.floor(pos/SLOT);
  let seek=pos%SLOT;
  return {idx:idx, seek:seek, elapsed:elapsed};
}

function playAt(idx, seek){
 cur=idx;
 let vid=videos[idx].id;
 loadYT(()=>{
  if(player){
    player.loadVideoById({videoId:vid, startSeconds:seek});
    setTimeout(()=>{ try{player.setPlaybackRate(0.9); player.playVideo(); player.unMute();}catch{} },600);
    return;
  }
  player=new YT.Player('player',{
   videoId:vid,
   playerVars:{autoplay:1,mute:1,controls:1,rel:0,modestbranding:1,playsinline:1,start:seek},
   events:{
    onReady:e=>{
      e.target.playVideo();
      try{e.target.setPlaybackRate(0.9);}catch{}
      setTimeout(()=>{ try{e.target.unMute(); e.target.setVolume(100); e.target.setPlaybackRate(0.9);}catch{} },1000);
      // kila 10 sec angalia kama tuko nyuma
      setInterval(()=>{
        try{
          let now=findNow();
          let curTime=e.target.getCurrentTime();
          // kama tuko nyuma zaidi ya 15 sec, ruka mbele
          if(Math.abs(now.seek-curTime)>15 || now.idx!=cur){
            cur=now.idx;
            e.target.loadVideoById({videoId:videos[now.idx].id, startSeconds:now.seek});
          }
          e.target.setPlaybackRate(0.9);
        }catch{}
      },10000);
    },
    onStateChange:e=>{
      try{e.target.setPlaybackRate(0.9);}catch{}
      if(e.data==0){
        let now=findNow();
        cur=now.idx;
        e.target.loadVideoById({videoId:videos[cur].id, startSeconds:now.seek});
      }
    }
   }
  });
 });
}

// ADS
let ads=["🔥 ALE TV - YOUR HOME OF SPORTS!","💰 TILL 3624692 - SUPPORT ALE TV - 0703182307","📺 TANGAZA BIASHARA YAKO HAPA - 100K VIEWERS","⚡ ale-tv.vercel.app - LIVE 24/7"];
let ai=0, des=["d1","d2","d3"];
setInterval(()=>{
 document.getElementById('adBox').className=des[ai%des.length];
 let el=document.getElementById('adTxt');
 el.style.animation='none'; void el.offsetWidth;
 el.innerText=ads[ai%ads.length];
 el.style.animation='z 6s infinite';
 ai++;
},5500);

function init(){
 let loc=[];
 try{ loc=JSON.parse(localStorage.getItem('ale_videos')||'[]'); }catch{}
 if(loc.length){ videos=loc.map(v=>({id:getId(v.id)})).filter(v=>v.id); }
 if(!videos.length){ videos=[{id:'jNQXAC9IVRw'},{id:'5qap5aO4i9A'},{id:'jfKfPfyJRdk'}]; }
 let now=findNow();
 playAt(now.idx, now.seek);
}
init();
</script></body></html>
