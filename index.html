<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ALE TV HD</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{background:#000;color:#fff;font-family:Arial;height:100vh;overflow:hidden;display:flex;flex-direction:column}
#top{height:36px;background:#ff8c00;display:flex;align-items:center;justify-content:space-between;padding:0 10px}
#top b{color:#000;font-size:13px;font-weight:900}
#clock{background:#000;color:#ff8c00;padding:3px 8px;border-radius:4px;font-size:11px;font-weight:900}
#liveDot{background:red;color:#fff;padding:3px 8px;border-radius:10px;font-size:10px;font-weight:900}
#stage{flex:1;background:#000;position:relative}
#off{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
#playerWrap{width:100%;height:100%;position:relative;display:none}
#yt{width:100%;height:100%}
#playBtn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.7);width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;z-index:5;cursor:pointer;border:2px solid #fff}
#footer{height:28px;background:#111;border-top:1px solid #ff8c00;display:flex;align-items:center;overflow:hidden}
#ticker{white-space:nowrap;animation:scroll 60s linear infinite;padding-left:100%;font-size:11px}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-100%)}}
</style>
<script src="https://www.youtube.com/iframe_api"></script>
</head><body>
<div id="top"><b>ALE TV HD</b><div style="display:flex;gap:6px"><div id="clock">00:00:00</div><div id="liveDot">● LIVE</div></div></div>
<div id="stage">
<div id="off"><div style="font-size:40px">📺</div><div style="color:#ff8c00;font-weight:900;margin-top:8px;font-size:13px">ALE TV HD</div><div style="color:#666;font-size:10px;margin-top:4px" id="offText">INAPAKIA PLAYLIST...</div></div>
<div id="playerWrap"><div id="yt"></div><div id="playBtn" onclick="doPlay()">▶</div></div>
</div>
<div id="footer"><div id="ticker" id="tk">★ ALE TV HD ★ PLAYLIST MODE ★</div></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";import{getDatabase,ref,onValue}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
const db=getDatabase(initializeApp({apiKey:"AIzaSyDuf-Is10hDtjNJU7hzDqJmLT2czSXzODg",authDomain:"ale-tv.firebaseapp.com",databaseURL:"https://ale-tv-default-rtdb.firebaseio.com",projectId:"ale-tv"}));
let player=null, videos=[], curIdx=0, hasStarted=false, checkInt=null, autoArmed=false;
setInterval(()=>{let d=new Date(); document.getElementById('clock').innerText=d.toLocaleTimeString('en-GB',{hour12:false});},1000);

function makePlayer(id){
 if(!id) return;
 if(player) try{player.destroy()}catch{}
 document.getElementById('off').style.display='none';
 document.getElementById('playerWrap').style.display='block';
 hasStarted=true;
 player=new YT.Player('yt',{
  width:'100%',height:'100%',videoId:id,
  playerVars:{autoplay:1,controls:1,rel:0,modestbranding:0,fs:1,playsinline:1,mute:0},
  events:{
   onReady:e=>{e.target.playVideo(); document.getElementById('playBtn').style.display='none'; startCheck();},
   onStateChange:e=>{
    if(e.data==1) document.getElementById('playBtn').style.display='none';
    if(e.data==2) document.getElementById('playBtn').style.display='flex';
    if(e.data==0) playNextInPlaylist();
   }
  }
 });
}
window.doPlay=()=>{ if(player) player.playVideo(); document.getElementById('playBtn').style.display='none'; }

function playNextInPlaylist(){
 if(videos.length==0) return;
 curIdx=(curIdx+1)%videos.length;
 let next=videos[curIdx];
 document.getElementById('tk').innerText=`★ SASA: ${next.title} ★ INAYOFUATA: ${videos[(curIdx+1)%videos.length]?.title||''} ★`;
 makePlayer(next.videoId);
}
function startCheck(){
 clearInterval(checkInt);
 checkInt=setInterval(()=>{
  if(!player||!player.getDuration) return;
  let dur=player.getDuration(), cur=player.getCurrentTime(), rem=dur-cur;
  if(dur>0 && rem<=8 && rem>0 &&!autoArmed){ autoArmed=true; setTimeout(()=>playNextInPlaylist(),3000); }
  if(rem>9) autoArmed=false;
 },800);
}

// INACHEZA PLAYLIST KAMA HAKUNA LIVE
onValue(ref(db,'videos'),s=>{
  let d=s.val();
  if(!d){ document.getElementById('offText').innerText='HAKUNA VIDEO - WEKA KATIKA ADMIN'; return; }
  videos=Object.values(d).sort((a,b)=>a.createdAt-b.createdAt);
  document.getElementById('offText').innerText=`PLAYLIST: ${videos.length} VIDEOS ZIMEPATIKANA`;
  document.getElementById('tk').innerText=`★ PLAYLIST: ${videos.length} VIDEOS ★ ${videos.map(v=>v.title).join(' • ')} ★`;
  if(!hasStarted){
    curIdx=0;
    makePlayer(videos[0].videoId);
  }
});

onValue(ref(db,'live'),s=>{
 let v=s.val();
 if(v && v.videoId){
  // kama admin ameweka LIVE, icheze hiyo
  let start=Math.floor((Date.now()-v.startAt)/1000); if(start<0) start=0;
  let idx=videos.findIndex(x=>x.videoId===v.videoId); if(idx>=0) curIdx=idx;
  document.getElementById('tk').innerText=`★ LIVE: ${v.title} ★`;
  makePlayer(v.videoId);
 }
});

window.onYouTubeIframeAPIReady=()=>{};
</script></body></html>
