<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>ALE TV HD</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;900&display=swap" rel="stylesheet"><style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#050505;color:#fff;font-family:'Inter',Arial;overflow:hidden;height:100vh;width:100vw}
#header{height:48px;background:linear-gradient(90deg,#ff8c00,#ffb347);display:flex;align-items:center;justify-content:space-between;padding:0 14px;z-index:10;position:fixed;top:0;left:0;right:0}
#logo{color:#000;font-weight:900;font-size:20px;letter-spacing:1px;display:flex;align-items:center;gap:8px}
#logo span{background:#000;color:#ff8c00;padding:2px 8px;border-radius:6px;font-size:12px}
#rightHead{display:flex;align-items:center;gap:10px}
#liveBadge{background:#e60000;color:#fff;padding:5px 12px;border-radius:20px;font-size:11px;font-weight:900;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.5}}
#clock{color:#000;font-weight:900;font-size:13px;background:rgba(0,0,0,.15);padding:4px 8px;border-radius:6px}
#stage{position:fixed;top:48px;left:0;right:0;bottom:42px;background:#000;display:flex;align-items:center;justify-content:center}
#playerWrap{width:100%;height:100%;position:relative;background:#000}
#ytPlayer,#fbPlayer{width:100%;height:100%;border:0;background:#000}
#fbPlayer{display:none}
#blocker{position:absolute;inset:0;z-index:5;cursor:none} /* Zuia kusongesha */
#offAir{position:absolute;inset:0;background:radial-gradient(#111,#000);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:6}
#footer{position:fixed;bottom:0;left:0;right:0;height:42px;background:#0a0a0a;border-top:3px solid #ff8c00;display:flex;align-items:center;z-index:10;overflow:hidden}
#tickerTrack{white-space:nowrap;animation:scroll 60s linear infinite;display:flex;align-items:center;gap:50px}
@keyframes scroll{from{transform:translateX(100vw)}to{transform:translateX(-100%)}}
.tickerItem{color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;gap:10px}
.tickerItem b{color:#ff8c00}
</style></head><body>
<div id="header"><div id="logo">ALE <span>TV HD</span></div><div id="rightHead"><div id="liveBadge">● LIVE</div><div id="clock">00:00:00</div></div></div>
<div id="stage"><div id="playerWrap">
<div id="offAir"><div style="font-size:50px">📺</div><div style="margin-top:10px;color:#ff8c00;font-weight:900">ALE TV INAANZA...</div><div style="color:#555;font-size:12px;margin-top:6px">Watu wote duniani wanaona video moja kwa wakati mmoja</div></div>
<div id="ytPlayer"></div>
<iframe id="fbPlayer" allowfullscreen allow="autoplay; encrypted-media"></iframe>
<div id="blocker" title="ALE TV - Hakuna kusongesha"></div>
</div></div>
<div id="footer"><div id="tickerTrack"><div class="tickerItem" id="tickerText">★ ALE TV HD ★ BURUDANI 24/7 ★ WATU WOTE WANAONA VIDEO MOJA KWA WAKATI MMOJA ★</div></div></div>

<script src="https://www.youtube.com/iframe_api"></script>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";import{getDatabase,ref,onValue}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
const db=getDatabase(initializeApp({apiKey:"AIzaSyDuf-Is10hDtjNJU7hzDqJmLT2czSXzODg",authDomain:"ale-tv.firebaseapp.com",databaseURL:"https://ale-tv-default-rtdb.firebaseio.com",projectId:"ale-tv"}));

let yt=null, ytReady=false, currentLive=null, settings={ticker:"ALE TV HD - BURUDANI NON-STOP 24/7"};

function updateClock(){document.getElementById('clock').innerText=new Date().toLocaleTimeString('en-GB',{timeZone:'Africa/Nairobi'})} setInterval(updateClock,1000); updateClock();

window.onYouTubeIframeAPIReady=()=>{ytReady=true; if(currentLive) loadLive(currentLive);}

function loadLive(live){
 currentLive=live;
 document.getElementById('offAir').style.display='none';
 if(live.type==='facebook'){
   document.getElementById('ytPlayer').style.display='none';
   let fb=document.getElementById('fbPlayer'); fb.style.display='block';
   fb.src=`https://www.facebook.com/plugins/video.php?href=${encodeURIComponent(live.url)}&show_text=0&autoplay=1&mute=0`;
   return;
 }
 // YOUTUBE
 document.getElementById('fbPlayer').style.display='none';
 document.getElementById('ytPlayer').style.display='block';
 let startSec=0;
 if(!live.isLiveNow){ // Video ya kawaida - sync kwa kila mtu
   startSec=Math.floor((Date.now()-live.startAt)/1000);
   if(startSec<0) startSec=0;
 }
 if(!ytReady){return;}
 if(yt && yt.loadVideoById){
   yt.loadVideoById({videoId:live.videoId, startSeconds:startSec});
   if(live.isLiveNow) setTimeout(()=>yt.playVideo(),500);
 }else{
   yt=new YT.Player('ytPlayer',{videoId:live.videoId,playerVars:{autoplay:1,controls:0,disablekb:1,fs:0,rel:0,modestbranding:1,playsinline:1,origin:location.origin,start:startSec,mute:0},events:{onReady:e=>{e.target.playVideo(); try{e.target.unMute()}catch{}},onStateChange:e=>{if(e.data==0 && !live.isLiveNow){/* video imeisha - ngoja admin abadilise */}}}});
 }
}

onValue(ref(db,'live'),snap=>{
 let live=snap.val();
 if(!live){document.getElementById('offAir').style.display='flex'; return;}
 loadLive(live);
 // ticker
 if(live.title) document.getElementById('tickerText').innerHTML=`★ ${live.title.toUpperCase()} ★ ${live.desc||settings.ticker} ★ <b>${live.cat||'LIVE'}</b> ★ ${new Date().toLocaleTimeString()} ★ ALE TV HD ★`;
});

onValue(ref(db,'settings'),snap=>{
 let s=snap.val(); if(s){settings=s; if(!currentLive) document.getElementById('tickerText').innerText=s.ticker||settings.ticker;}
});
</script></body></html>
