<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ALE TV</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:sans-serif;overflow:hidden;height:100vh;width:100vw}#playerWrap{position:fixed;inset:0}#player{width:100%;height:100%}#black{position:fixed;inset:0;background:#000;z-index:50;display:flex;align-items:center;justify-content:center;flex-direction:column}#info{position:fixed;top:10px;left:10px;background:rgba(0,0,0,.8);padding:5px 10px;border-radius:20px;font-size:11px;z-index:10;border:1px solid #f59e0b}#live{position:fixed;top:10px;right:10px;background:red;padding:4px 10px;border-radius:4px;font-size:11px;font-weight:900;z-index:10}#loader{width:30px;height:30px;border:3px solid #333;border-top:3px solid #f59e0b;border-radius:50%;animation:spin 1s linear infinite;margin-top:15px}@keyframes spin{to{transform:rotate(360deg)}}</style></head><body>
<div id="info">ALE TV • CONNECTING...</div><div id="live">● LIVE</div><div id="playerWrap"><div id="player"></div></div><div id="black"><h1 style="color:#f59e0b;font-size:42px">ALE TV</h1><p style="color:#aaa" id="status">Ina-connect Firebase...</p><div id="loader"></div></div>
<script src="https://www.youtube.com/iframe_api"></script>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";import{getDatabase,ref,onValue}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
const db=getDatabase(initializeApp({apiKey:"AIzaSyDuf-Is10hDtjNJU7hzDqJmLT2czSXzODg",authDomain:"ale-tv.firebaseapp.com",databaseURL:"https://ale-tv-default-rtdb.firebaseio.com",projectId:"ale-tv"}));
let player,queue=[],qIndex=0,current=null,ready=false,started=false;
function fastPlay(v,force=false){
 if(!v||!ready)return;if(!force&&current===v.id)return;current=v.id;
 let start=0;if(!v.isLive){start=Math.floor((Date.now()-(v.createdAt||Date.now()))/1000);if(start<0)start=0;}
 document.getElementById('black').style.display='none';
 document.getElementById('info').innerText=v.isLive?`🔴 ${v.title}`:`${v.title} • LIVE SYNC`;
 if(player&&player.loadVideoById){player.loadVideoById({videoId:v.id,startSeconds:start});player.mute();player.playVideo();}
 else{player=new YT.Player('player',{videoId:v.id,playerVars:{autoplay:1,mute:1,controls:0,rel:0,playsinline:1,enablejsapi:1,origin:location.origin},events:{onReady:e=>{e.target.mute();e.target.seekTo(start,true);e.target.playVideo();setTimeout(()=>{try{e.target.unMute()}catch{}},1200);},onStateChange:e=>{if(e.data===0&&queue.length>0){qIndex=qIndex<queue.length-1?qIndex+1:0;fastPlay(queue[qIndex],true);}}}});}
}
window.onYouTubeIframeAPIReady=()=>{ready=true;if(queue.length>0&&!started){started=true;fastPlay(queue[qIndex],true);}};
onValue(ref(db,'videos'),snap=>{
 let d=snap.val();document.getElementById('status').innerText=d?`Videos: ${Object.keys(d).length} • Inapakia...`:`Hakuna video kwenye Firebase`;
 if(!d){queue=[];return;}
 queue=Object.entries(d).sort((a,b)=>(a[1].createdAt||0)-(b[1].createdAt||0)).map(e=>e[1]);
 // Kama ni video mpya - ruka moja kwa moja
 if(!started||queue.length===1){qIndex=queue.length-1;fastPlay(queue[qIndex],true);started=true;}
});
setTimeout(()=>{if(!started)document.getElementById('status').innerText='Bado tupu - Nenda admin.html weka video';},4000);
</script></body></html>
