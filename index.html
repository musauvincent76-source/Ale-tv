<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALE TV KENYA</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:sans-serif}
.topbar{background:#0a0a0a;padding:10px;border-bottom:2px solid #f59e0b;display:flex;justify-content:space-between}
.logo{color:#f59e0b;font-weight:900}
.player{width:100%;height:65vh;background:#000}
iframe{width:100%;height:100%;border:0}
.chips{display:flex;gap:6px;padding:8px;overflow-x:auto;background:#111}
.chip{padding:7px 14px;background:#222;border-radius:20px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.active{background:#f59e0b;color:#000;font-weight:900}
</style></head><body>
<div class="topbar"><div class="logo">🔥 ALE TV KENYA</div><div style="color:red">● LIVE</div></div>
<div class="chips">
<div class="chip active" onclick="play('UChBQgieUidXV1CmDxSdRm3g',this)">CITIZEN</div>
<div class="chip" onclick="play('UC3J_w5RqZf3qX1l3kZ8X5AA',this)">NTV KENYA</div>
<div class="chip" onclick="play('UC5N_u6rJ8eP5x6Z6b5L5AA',this)">KTN NEWS</div>
<div class="chip" onclick="playLive('DVSRNx8VSFM',this)">BACKUP CITIZEN</div>
</div>
<div class="player"><iframe id="yt" src="https://www.youtube.com/embed/live_stream?channel=UChBQgieUidXV1CmDxSdRm3g&autoplay=1&mute=1" allow="autoplay; encrypted-media" allowfullscreen></iframe></div>

<script>
function play(channelId, el){
 document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active')); el.classList.add('active');
 document.getElementById('yt').src=`https://www.youtube.com/embed/live_stream?channel=${channelId}&autoplay=1&mute=0`;
}
function playLive(videoId, el){
 document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active')); el.classList.add('active');
 document.getElementById('yt').src=`https://www.youtube.com/embed/${videoId}?autoplay=1&mute=0`;
}
// Kama admin yako ina video, ita-load
</script>
</body></html>
