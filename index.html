<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALE TV KE LIVE - Azam Style</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:'Segoe UI',sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
#top{height:50px;background:linear-gradient(90deg,#001a4d,#000c24);display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:3px solid #ff6600}
#top h1{color:#ff6600;font-size:19px;font-weight:900;letter-spacing:1px}#top h1 span{color:#fff;font-size:10px;display:block;letter-spacing:3px;opacity:.6}
#clock{color:#00ff88;background:#000;border:1px solid #1a2d60;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:900}
#vid{flex:1;background:#000;position:relative}
#player{width:100%;height:100%}
#ticker{height:42px;background:#ff6600;color:#000;display:flex;align-items:center;font-weight:900;font-size:13px;white-space:nowrap;overflow:hidden}
#ticker span{padding-left:100%;animation:scroll 20s linear infinite}
@keyframes scroll{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}
#no{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;opacity:.5}
</style>
</head><body>
<div id="top"><h1>AZAM<span>ALE TV KE LIVE</span></h1><div id="clock">00:00:00</div></div>
<div id="vid"><div id="player"></div><div id="no" style="display:none">📺 Hakuna Video<br><span style="font-size:11px">Nenda ADMIN uweke YouTube link</span></div></div>
<div id="ticker"><span id="tick">ALE FOOTBALL ACADEMY - JOIN TODAY 0703182307 - TILL 3624692 - ALE TV KE LIVE - AZAM STYLE</span></div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
const KEY='azamtv_ale_final_2026';
let player, lastId='';

function getLive(){
  try{
    let now = JSON.parse(localStorage.getItem('aletv_live_now')||'null');
    if(now && now.ytid) return now;
    let s = JSON.parse(localStorage.getItem(KEY)||'null');
    if(s && s.playlist && s.playlist.length){
      let live = s.playlist.find(p=>p.status==='now') || s.playlist[0];
      return live;
    }
  }catch(e){}
  return null;
}

function onYouTubeIframeAPIReady(){
  let live = getLive();
  if(!live){
    document.getElementById('no').style.display='block';
    return;
  }
  lastId = live.ytid;
  document.getElementById('tick').innerText = (live.title||'ALE TV') + ' • ' + document.getElementById('tick').innerText;
  player = new YT.Player('player',{
    videoId: live.ytid,
    playerVars:{autoplay:1,mute:0,controls:1,rel:0,modestbranding:1,playsinline:1},
    events:{onReady:e=>e.target.playVideo()}
  });
}

setInterval(()=>{
  document.getElementById('clock').innerText = new Date().toLocaleTimeString('en-GB',{timeZone:'Africa/Nairobi',hour12:false});
  let live = getLive();
  if(!live) return;
  if(live.ytid!== lastId && player && player.loadVideoById){
    lastId = live.ytid;
    document.getElementById('no').style.display='none';
    player.loadVideoById(live.ytid);
  }
},2000);
</script>
</body></html>
