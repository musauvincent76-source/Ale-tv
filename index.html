<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALE TV</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:sans-serif}
#player{width:100%;aspect-ratio:16/9;background:#000}
.ticker{position:absolute;bottom:0;left:0;right:0;background:#f59e0b;color:#000;font-weight:900;padding:6px;white-space:nowrap;overflow:hidden}
.ticker span{display:inline-block;animation:move 20s linear infinite}
@keyframes move{from{transform:translateX(100%)}to{transform:translateX(-100%)}}
.wrap{position:relative;width:100%}
</style>
</head>
<body>
<div class="wrap">
<div id="player"></div>
<div class="ticker"><span id="tick">ALE TV LIVE</span></div>
</div>

<script>
function getV(){return JSON.parse(localStorage.getItem('ale_videos')||'[]')}
function getSeek(id){
  let k='ale_start_'+id;
  let s=localStorage.getItem(k);
  if(!s){s=Date.now();localStorage.setItem(k,s);}
  return Math.floor((Date.now()-parseInt(s))/1000);
}
let player;
let tag=document.createElement('script');
tag.src="https://www.youtube.com/iframe_api";
document.head.appendChild(tag);

window.onYouTubeIframeAPIReady=()=>{
 let v=getV();
 if(!v.length) return;
 let cur=v[v.length-1];
 document.getElementById('tick').innerText=cur.title+" | "+(localStorage.getItem('ale_ticker_custom')||"ALE TV LIVE");
 let seek=getSeek(cur.id);
 player=new YT.Player('player',{
   videoId:cur.id,
   playerVars:{autoplay:1,mute:1,controls:1,rel:0,start:seek},
   events:{
     onReady:e=>{
       e.target.seekTo(seek,true);
       e.target.playVideo();
       setTimeout(()=>{e.target.unMute();},1000);
     }
   }
 });
};
</script>
</body>
</html>
