<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALE TV</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#000;color:#fff;height:100vh;display:flex;flex-direction:column;overflow:hidden}
#top{height:36px;background:#111;display:flex;align-items:center;border-bottom:3px solid #00ff88;flex-shrink:0}
#top b{background:#00ff88;color:#000;font-size:10px;padding:0 10px;height:100%;display:flex;align-items:center}
#top span{flex:1;font-size:11px;font-weight:900;color:#00ff88;padding-left:10px;white-space:nowrap;overflow:hidden}
#time{width:80px;background:#000;border-left:2px solid #00ff88;display:flex;align-items:center;justify-content:center;font-weight:900;flex-shrink:0}
#video{flex:1;background:#000;position:relative}
#player{width:100%;height:100%}
#ads{height:70px;background:yellow;color:#000;display:flex;align-items:center;flex-shrink:0}
#ads div:first-child{width:50px;background:#000;color:#fff;height:100%;display:flex;align-items:center;justify-content:center;font-size:20px}
#ads div:last-child{flex:1;text-align:center;font-weight:900;font-size:16px;animation:sc 10s linear infinite;white-space:nowrap}
@keyframes sc{0%{transform:translateX(100%)}100%{transform:translateX(-100%)}}
#break{height:26px;background:#000;border-top:2px solid red;display:flex;align-items:center;overflow:hidden;flex-shrink:0}
#break b{background:red;padding:0 8px;height:100%;display:flex;align-items:center;font-size:8px}
#break span{color:#fff;font-size:10px;white-space:nowrap;padding-left:10px}
#btn{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#00ff88;color:#000;border:0;padding:20px 40px;border-radius:30px;font-weight:900;font-size:18px;z-index:999}
</style>
</head>
<body>

<div id="top"><b>🏫 ACADEMY</b><span id="desc">ALE FOOTBALL ACADEMY - 0703182307 - TILL 3624692</span><div id="time">00:00</div></div>

<div id="video"><div id="player"></div></div>

<div id="ads"><div>📢</div><div id="adText">TILL 3624692 - ADVERTISE WITH US</div></div>

<div id="break"><b>BREAKING</b><span id="tick">ALE TV - PUBLIC TV - TILL 3624692</span></div>

<button id="btn" onclick="playTV()">▶️ BONYEZA HAPA TV ICHEZE</button>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
let player;
function onYouTubeIframeAPIReady(){
 player=new YT.Player('player',{
  videoId:'jNQXAC9IVRw',
  width:'100%',
  height:'100%',
  playerVars:{autoplay:1,mute:1,controls:1,rel:0,playsinline:1},
  events:{
   onReady:e=>{
    e.target.playVideo();
   }
  }
 });
}
function playTV(){
 document.getElementById('btn').style.display='none';
 if(player){
  player.playVideo();
  player.unMute();
  player.setVolume(100);
 }
}

// TIME + ADS ROTATION
setInterval(()=>{
 document.getElementById('time').innerText=new Date().toLocaleTimeString('en-GB',{timeZone:'Africa/Nairobi',hour12:false});
},1000);

let ads=["TILL 3624692 - ADVERTISE WITH US - 100K VIEWERS","ALE ACADEMY - JOIN NOW 0703182307","TILL 3624692 - SUPPORT ALE TV","ALE TV PUBLIC - KISUMU NAIROBI MOMBASA SAME TIME"];
let i=0;
setInterval(()=>{
 document.getElementById('adText').innerText=ads[i%ads.length];
 i++;
},3000);
</script>
</body>
</html>
