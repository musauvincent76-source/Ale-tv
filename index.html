<!DOCTYPE html><html><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>ALE TV - LIVE WORLDWIDE</title>
<style>body{background:#000;color:#fff;margin:0;font-family:sans-serif}.top{padding:12px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid red;position:sticky;top:0;background:#000;z-index:10}.logo{font-weight:900;font-size:18px}.logo span{color:red}.live{background:red;padding:5px 10px;border-radius:12px;font-size:10px;font-weight:800;animation:b 1s infinite}@keyframes b{0%,100%{opacity:1}50%{opacity:.5}}#player{position:relative;background:#000;aspect-ratio:16/9;width:100%;overflow:hidden}#yt{width:100%;height:100%}#player iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0}.over{position:absolute;pointer-events:none;z-index:5}.logo-tv{top:8px;left:8px;background:rgba(0,0,0,.7);border:1px solid red;padding:4px 8px;border-radius:4px;font-size:10px;font-weight:900}.logo-tv span{color:red}.hide-yt{bottom:0;right:0;width:85px;height:26px;background:#000}.ticker{background:red;color:#fff;padding:7px 0;font-size:12px;font-weight:900}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}.card{background:#111;border:1px solid #222;border-radius:10px;overflow:hidden}.card img{width:100%;aspect-ratio:16/9;object-fit:cover}.card b{font-size:11px;padding:6px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.badge{position:absolute;top:5px;left:5px;background:gold;color:#000;font-size:8px;padding:3px 5px;border-radius:4px;font-weight:900}.thumb{position:relative}.lock{position:absolute;inset:0;background:rgba(0,0,0,.94);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:10;text-align:center;padding:20px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.96);display:none;align-items:center;justify-content:center;padding:20px;z-index:99}.box{background:#111;border:2px solid gold;border-radius:14px;padding:20px;text-align:center;max-width:350px;width:100%}</style></head><body>
<div class=top><div class=logo>ALE <span>TV</span></div><div style="display:flex;gap:8px;align-items:center"><div id=time style="font-family:monospace;background:#111;border:1px solid #333;padding:5px 8px;border-radius:6px;font-size:11px;color:#0f0">00:00:00</div><div class=live>● LIVE WORLDWIDE</div></div></div>
<div id=player><div id=yt></div><div class="over logo-tv">ALE <span>TV</span></div><div class="over hide-yt"></div>
<div id=lock class=lock><h2 style=color:gold;margin:0>🔒 VIDEO YA KULIPIA</h2><div style=background:#000;border:1px solid gold;border-radius:8px;padding:10px;width:90%;margin:10px 0><p style=color:#888;font-size:10px;margin:0>LIPA TILL NUMBER</p><p style=color:#0f0;font-size:28px;font-weight:900;margin:5px 0>3624692</p></div><button onclick=openPay() style=background:gold;color:#000;padding:14px;border:0;border-radius:8px;font-weight:900;width:92%>🔓 NIMELIPA - WEKA CODE</button></div></div>
<div class=ticker><marquee scrollamount=7>🔴 ALE TV LIVE WORLDWIDE - KILA MTU ANAONA VIDEO MOJA - LIPA 30 KES TILL 3624692 - BURUDANI 24/7 🔴</marquee></div>
<div class=grid id=grid></div>
<div id=payModal class=modal><div class=box><h3 style=color:gold;margin:0>THIBITISHA MALIPO</h3><p style=font-size:11px;color:#ccc>1. Lipa 30 KES TILL <b style=color:#0f0>3624692</b></p><input id=code placeholder="WEKA M-PESA CODE (QGH...)" style=width:100%;padding:14px;background:#000;color:#0f0;border:2px solid gold;border-radius:8px;text-align:center;font-weight:900;text-transform:uppercase><button onclick=confirmPay() style=width:100%;margin-top:12px;background:gold;color:#000;padding:14px;border:0;border-radius:8px;font-weight:900>✅ FUNGUA</button><button onclick=closePay() style=background:none;border:0;color:#666;margin-top:10px>❌ Funga</button></div></div>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
// HIZI NDO VIDEO DUNIANI KOTE ZITAONA - EDIT HAPA
let videos=[
{id:"dQw4w9WgXcQ",title:"ALE TV INTRO - KARIBU",paid:false},
{id:"jNQXAC9IVRw",title:"BURUDANI YA LEO",paid:false},
{id:"9bZkp7q19f0",title:"VIDEO YA KULIPIA - 30 KES",paid:true}
];
let unlocked=JSON.parse(localStorage.getItem('ale_unlocked')||'[]');let usedCodes=JSON.parse(localStorage.getItem('ale_usedCodes')||'[]');let cur=null,curIndex=0,ytPlayer=null;
function render(){let g=document.getElementById('grid');let h='';for(let i=0;i<videos.length;i++){let v=videos[i];h+=`<div class=card onclick=playIdx(${i})><div class=thumb><img src=https://img.youtube.com/vi/${v.id}/mqdefault.jpg><span class=badge>${v.paid?'PAID 30':'FREE'}</span></div><b>${v.title}</b></div>`}g.innerHTML=h}
function onYouTubeIframeAPIReady(){ytPlayer=new YT.Player('yt',{height:'100%',width:'100%',playerVars:{autoplay:1,modestbranding:1,rel:0,controls:1},events:{'onReady':()=>{if(videos.length)playIdx(0)},'onStateChange':(e)=>{if(e.data==0){let n=curIndex+1;if(n>=videos.length)n=0;playIdx(n)}}}})}
function playIdx(i){curIndex=i;cur=videos[i];if(!cur)return;let locked=cur.paid&&unlocked.indexOf(cur.id)==-1;if(ytPlayer&&ytPlayer.loadVideoById)ytPlayer.loadVideoById(cur.id);document.getElementById('lock').style.display=locked?'flex':'none'}
function openPay(){document.getElementById('payModal').style.display='flex'}function closePay(){document.getElementById('payModal').style.display='none'}
function confirmPay(){let c=document.getElementById('code').value.trim().toUpperCase();if(c.length<6)return alert('Weka CODE kamili');if(usedCodes.indexOf(c)!==-1){unlocked.push(cur.id);localStorage.setItem('ale_unlocked',JSON.stringify(unlocked));closePay();document.getElementById('lock').style.display='none';return}usedCodes.push(c);unlocked.push(cur.id);localStorage.setItem('ale_usedCodes',JSON.stringify(usedCodes));localStorage.setItem('ale_unlocked',JSON.stringify(unlocked));closePay();document.getElementById('lock').style.display='none';alert('✅ Asante! Video imefunguliwa')}
setInterval(()=>{let el=document.getElementById('time');if(el)el.innerText=new Date().toLocaleTimeString()},1000);render();
</script></body></html>
