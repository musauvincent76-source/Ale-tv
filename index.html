<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ALE TV HD</title><style>
*{box-sizing:border-box;margin:0;padding:0}body{background:#000;color:#fff;font-family:Arial;height:100vh;overflow:hidden}
#h{height:50px;background:linear-gradient(90deg,#ff8c00,#ffb347);display:flex;justify-content:space-between;align-items:center;padding:0 14px;position:fixed;top:0;left:0;right:0;z-index:10}
#stage{position:fixed;top:50px;left:0;right:0;bottom:44px;background:#000}
#off{width:100%;height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;background:radial-gradient(#111,#000)}
#playerWrap{width:100%;height:100%;position:relative;display:none}
#block{position:absolute;inset:0;z-index:2}
#soundPop{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.85);border:2px solid #ff8c00;color:#fff;padding:12px 20px;border-radius:30px;font-weight:900;font-size:14px;z-index:10;display:none;cursor:pointer;animation:pulse 1.5s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 #ff8c00}70%{box-shadow:0 0 0 10px rgba(255,140,0,0)}100%{box-shadow:0 0 0 0 rgba(255,140,0,0)}}
#nextInfo{position:absolute;top:10px;right:10px;background:rgba(0,0,0,0.8);border:1px solid #ff8c00;padding:8px 12px;border-radius:10px;font-size:11px;z-index:10;display:none}
#footer{position:fixed;bottom:0;left:0;right:0;height:44px;background:#0a0a0a;border-top:3px solid #ff8c00;display:flex;align-items:center;overflow:hidden}
#tk{white-space:nowrap;animation:scroll 60s linear infinite;padding-left:100%}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-100%)}}
</style>
<script src="https://www.youtube.com/iframe_api"></script>
</head><body>
<div id="h"><b style="color:#000">ALE TV HD</b><div style="display:flex;gap:8px;align-items:center"><span id="liveBadge" style="background:red;color:#fff;padding:5px 12px;border-radius:20px;font-size:11px">● LIVE</span><span id="nextCount" style="background:#000;color:#ff8c00;padding:5px 10px;border-radius:20px;font-size:10px;display:none"></span></div></div>

<div id="stage">
<div id="off"><div style="font-size:50px">📺</div><div style="color:#ff8c00;font-weight:900;margin-top:10px">ALE TV HD INAANDAA...</div></div>
<div id="playerWrap">
<div id="block"></div>
<div id="yt"></div>
<div id="soundPop" onclick="unMute()">🔊 BONYEZA HAPA KUWASHA SAUTI</div>
<div id="nextInfo">⏭ Inayofuata inaanza sekunde <span id="sec">8</span>...</div>
</div>
</div>

<div id="footer"><div id="tk">★ ALE TV HD ★ BURUDANI 24/7 ★</div></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";import{getDatabase,ref,onValue}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
const db=getDatabase(initializeApp({apiKey:"AIzaSyDuf-Is10hDtjNJU7hzDqJmLT2czSXzODg",authDomain:"ale-tv.firebaseapp.com",databaseURL:"https://ale-tv-default-rtdb.firebaseio.com",projectId:"ale-tv"}));

let player=null, liveData=null, videosList=[], currentIndex=0, timer=null, isMuted=true, autoNextArmed=false;

function makePlayer(videoId, startSec=0){
  if(player){ player.destroy(); }
  document.getElementById('playerWrap').style.display='block';
  document.getElementById('off').style.display='none';
  player = new YT.Player('yt', {
    width:'100%', height:'100%',
    videoId: videoId,
    playerVars:{autoplay:1, controls:0, rel:0, modestbranding:1, playsinline:1, start:startSec, mute:1},
    events:{
      onReady:(e)=>{ e.target.playVideo(); isMuted=true; document.getElementById('soundPop').style.display='block'; checkTime(); },
      onStateChange:(e)=>{
        if(e.data==0){ // imeisha
          playNext();
        }
      }
    }
  });
}

window.unMute=()=>{
  if(player){ player.unMute(); player.setVolume(100); isMuted=false; document.getElementById('soundPop').style.display='none'; }
}

function checkTime(){
  clearInterval(timer);
  timer=setInterval(()=>{
    if(!player ||!player.getDuration) return;
    let dur=player.getDuration();
    let cur=player.getCurrentTime();
    let remain=dur-cur;
    if(dur>0 && remain<=8 && remain>0 &&!autoNextArmed){
      autoNextArmed=true;
      document.getElementById('nextInfo').style.display='block';
      let s=8;
      let countInt=setInterval(()=>{
        s--; document.getElementById('sec').innerText=s;
        if(s<=0) clearInterval(countInt);
      },1000);
      // Preload next video kwa background - inaanza bila delay
      setTimeout(()=>{ playNext(); }, 5000);
    }
    if(remain>9) autoNextArmed=false;
  },500);
}

function playNext(){
  clearInterval(timer);
  document.getElementById('nextInfo').style.display='none';
  autoNextArmed=false;
  if(videosList.length==0) return;
  currentIndex=(currentIndex+1)%videosList.length;
  let next=videosList[currentIndex];
  if(!next.videoId) { playNext(); return; }
  document.getElementById('tk').innerText=`★ SASA: ${next.title} ★ ${next.desc} ★ ALE TV HD ★`;
  makePlayer(next.videoId,0);
}

onValue(ref(db,'videos'),s=>{
  let d=s.val(); if(!d) return;
  videosList=Object.values(d).sort((a,b)=>a.createdAt-b.createdAt);
});

onValue(ref(db,'live'),s=>{
  liveData=s.val();
  if(!liveData) return;
  // kama admin ameweka LIVE, icheze hiyo kwanza
  let start=Math.floor((Date.now()-liveData.startAt)/1000);
  if(start<0) start=0;
  // tafuta index ya hiyo video kwenye playlist
  let idx=videosList.findIndex(v=>v.videoId===liveData.videoId);
  if(idx>=0) currentIndex=idx;

  document.getElementById('tk').innerText=`★ ${liveData.title} ★ ${liveData.desc} ★`;

  if(liveData.type==='youtube' && liveData.videoId){
    if(typeof YT!=='undefined' && YT.Player){
      makePlayer(liveData.videoId, liveData.isLiveNow?0:start);
    }else{
      window.onYouTubeIframeAPIReady=()=>makePlayer(liveData.videoId, liveData.isLiveNow?0:start);
    }
  }
});

window.onYouTubeIframeAPIReady=()=>{
  if(liveData && liveData.videoId) makePlayer(liveData.videoId,0);
}
</script></body></html>
