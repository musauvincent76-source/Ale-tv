<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALE TV HD - NEW</title>
<script src="https://www.youtube.com/iframe_api"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@600;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#070709;color:#fff;font-family:Inter,Arial;height:100vh;display:flex;flex-direction:column;overflow:hidden}
#top{height:56px;background:rgba(10,10,12,0.9);backdrop-filter:blur(20px);border-bottom:1px solid #1e1e22;display:flex;align-items:center;justify-content:space-between;padding:0 16px}
#logo{font-weight:800;font-size:20px;letter-spacing:-0.5px}
#logo span{color:#ff7a00}
#right{display:flex;align-items:center;gap:10px}
#clock{font-size:12px;color:#888;background:#151519;padding:6px 12px;border-radius:100px;font-weight:600}
#live{font-size:11px;background:#ff0000;padding:6px 14px;border-radius:100px;font-weight:800;animation:blink 1.5s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.7}}

#main{flex:1;display:flex;flex-direction:column;background:#000;position:relative}
#videoWrap{flex:1;position:relative;background:#000;overflow:hidden}
#yt{width:100%;height:100%}
#off{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:2;background:radial-gradient(circle at center,#1a1a1f 0%,#000 70%)}
#off h1{font-size:28px;font-weight:800;letter-spacing:-1px}
#off p{color:#666;font-size:12px;margin-top:6px}
#loader{width:40px;height:40px;border:3px solid #222;border-top-color:#ff7a00;border-radius:50%;animation:spin 0.8s linear infinite;margin-top:20px}
@keyframes spin{to{transform:rotate(360deg)}}

#info{height:88px;background:linear-gradient(0deg,#0c0c0f 0%,rgba(0,0,0,0) 100%);position:absolute;bottom:0;left:0;right:0;padding:16px;z-index:3;display:flex;align-items:flex-end;gap:12px}
#infoIcon{width:48px;height:48px;background:linear-gradient(135deg,#ff7a00,#ff3d00);border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#000}
#infoText{flex:1}
#infoText b{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:70vw}
#infoText small{font-size:11px;color:#ff7a00;text-transform:uppercase;letter-spacing:1px}

#tickerBar{height:36px;background:#ff7a00;color:#000;display:flex;align-items:center;padding:0 14px;font-size:11px;font-weight:800;letter-spacing:0.5px}
#tickerText{white-space:nowrap;animation:marquee 25s linear infinite}
@keyframes marquee{from{transform:translateX(100%)}to{transform:translateX(-100%)}}
</style>
</head>
<body>

<div id="top">
<div id="logo">ALE <span>TV</span></div>
<div id="right">
<div id="clock">00:00:00</div>
<div id="live">LIVE</div>
</div>
</div>

<div id="main">
<div id="videoWrap">
<div id="off">
<h1>ALE TV HD</h1>
<p id="offP">Inapakia matangazo...</p>
<div id="loader"></div>
</div>
<div id="yt"></div>
<div id="info">
<div id="infoIcon">HD</div>
<div id="infoText">
<b id="title">ALE TV HD</b>
<small id="cat">Burudani 24/7</small>
</div>
</div>
</div>
<div id="tickerBar"><div id="tickerText">🔥 ALE TV HD - BURUDANI BILA KUKOMA | MAMA AFRICA | HABARI | MUZIKI | LIVE 24/7</div></div>
</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";import{getDatabase,ref,onValue}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
const db=getDatabase(initializeApp({apiKey:"AIzaSyDuf-Is10hDtjNJU7hzDqJmLT2czSXzODg",authDomain:"ale-tv.firebaseapp.com",databaseURL:"https://ale-tv-default-rtdb.firebaseio.com",projectId:"ale-tv"}));
let player=null, videos=[], cur=0, started=false;

setInterval(()=>{document.getElementById('clock').innerText=new Date().toLocaleTimeString('en-GB',{hour12:false})},1000);

function play(id, s=0){
 if(!id) return;
 if(player) try{player.destroy()}catch{}
 document.getElementById('off').style.display='none';
 started=true;
 player=new YT.Player('yt',{width:'100%',height:'100%',videoId:id,
 playerVars:{autoplay:1,controls:1,modestbranding:1,fs:1,playsinline:1,mute:1,start:s,rel:0},
 events:{onReady:e=>{e.target.playVideo(); setTimeout(()=>{e.target.unMute();},800);},
 onStateChange:e=>{if(e.data==0){cur=(cur+1)%videos.length; document.getElementById('title').innerText=videos[cur].title; play(videos[cur].videoId)}}}
 });
}

onValue(ref(db,'videos'),snap=>{
 let d=snap.val(); if(!d) {document.getElementById('offP').innerText='Hakuna video - weka admin'; return;}
 videos=Object.values(d).sort((a,b)=>a.createdAt-b.createdAt);
 if(!started){ document.getElementById('title').innerText=videos[0].title; document.getElementById('cat').innerText=videos[0].cat||'BURUDANI'; play(videos[0].videoId); }
});

onValue(ref(db,'live'),snap=>{
 let v=snap.val(); if(!v?.videoId) return;
 let idx=videos.findIndex(x=>x.videoId===v.videoId); if(idx>=0) cur=idx;
 document.getElementById('title').innerText=v.title; document.getElementById('cat').innerText=v.cat||'LIVE';
 let st=Math.floor((Date.now()-v.startAt)/1000); if(st<0) st=0;
 play(v.videoId, v.isLiveNow?0:st);
});
</script>
</body>
 </html>
