@keyframes marq{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}

#overlay{position:fixed;inset:0;background:#000;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center}

<script src="https://www.youtube.com/iframe_api"></script>
<script>
let player, videos=[];
const BIRTH = Date.UTC(2025,0,1)/1000;
const SLOT = 240;

function getId(v){
 if(!v) return '';
 v=v.trim();
 if(v.length==11 &&!v.includes('/') &&!v.includes('.')) return v;
 if(v.includes('youtu.be/')) return v.split('youtu.be/')[1].split(/[?&#]/)[0];
 try{ let u=new URL(v); if(u.searchParams.get('v')) return u.searchParams.get('v'); }catch{}
 let m=v.match(/([a-zA-Z0-9_-]{11})/);
 return m?m[1]:'';
}

// SOMA ADMIN - ZOTE POSSIBLE KEYS
function fromAdmin(){
 let all=[];
 let keys=['azamtv_ale_final_2026','ale_final_videos','ale_videos','ale_playlist'];
 for(let k of keys){
  try{
   let raw=localStorage.getItem(k);
   if(!raw) continue;
   let j=JSON.parse(raw);
   if(Array.isArray(j)){
    j.forEach(x=>{
     let id=getId(x.url||x.ytid||x.id||x);
     if(id) all.push(id);
    });
   } else if(j && j.playlist && Array.isArray(j.playlist)){
    j.playlist.forEach(p=>{
     let id=getId(p.url||p.ytid||p.id||'');
     if(id) all.push(id);
    });
   }
  }catch{}
 }
 // Remove duplicates
 all=[...new Set(all)];
 document.getElementById('debug').innerText='ADMIN videos found: '+(all.length?all.join(', '):'Hakuna - tumia default');
 return all;
}

function worldPos(){
 if(!videos.length) return {i:0,s:0};
 let now=Date.now()/1000;
 let elapsed=Math.floor(now-BIRTH);
 let total=videos.length*SLOT;
 let p=elapsed%total;
 return {i:Math.floor(p/SLOT), s:p%SLOT};
}

function onYouTubeIframeAPIReady(){
 videos=fromAdmin();
 if(!videos.length){
  videos=['jNQXAC9IVRw']; // default kama admin haina kitu
 }
 let w=worldPos();
 player=new YT.Player('player',{
  videoId:videos[w.i],
  playerVars:{autoplay:1,mute:1,controls:1,rel:0,playsinline:1,start:w.s},
  events:{
   onReady:e=>{
    e.target.seekTo(w.s,true);
    e.target.playVideo();
    console.log('Playing:',videos[w.i],' seek:',w.s);
   },
   onStateChange:e=>{
    if(e.data==0){
     let nw=worldPos();
     player.loadVideoById({videoId:videos[nw.i],startSeconds:nw.s});
    }
   },
   onError:e=>{
    console.log('YT Error',e.data);
    document.getElementById('debug').innerText='YT Error '+e.data+' - next video...';
    let nw=worldPos();
    let next=(nw.i+1)%videos.length;
    player.loadVideoById({videoId:videos[next],startSeconds:0});
   }
  }
 });
}

function startTV(){
 document.getElementById('overlay').style.display='none';
 if(player){ player.unMute(); player.setVolume(100); player.playVideo(); }
}

// PUBLIC SYNC - SAME SECONDS
setInterval(()=>{
 if(!player||!videos.length) return;
 let w=worldPos();
 try{
  let curIdx=videos.indexOf(player.getVideoData().video_id);
  if(curIdx!==w.i && Math.abs(curIdx-w.i)>=1){
   // muda wa video mpya
   player.loadVideoById({videoId:videos[w.i],startSeconds:w.s});
  } else {
   let ct=player.getCurrentTime();
   if(Math.abs(ct-w.s)>15) player.seekTo(w.s,true);
  }
 }catch{}
},20000);

setInterval(()=>{
 document.getElementById('clock').innerText=new Date().toLocaleTimeString('en-GB',{timeZone:'Africa/Nairobi',hour12:false});
 let fresh=fromAdmin();
 if(fresh.length && fresh.length!==videos.length){
  videos=fresh;
 }
 let d=localStorage.getItem('ale_academy_desc')||'ALE FOOTBALL ACADEMY - 0703182307 - TILL 3624692';
 document.getElementById('tick').innerText=(d+' • TILL 3624692 • PUBLIC SYNC • ').repeat(2).toUpperCase();
},1000);

// GOOGLE ADS - RANGI MINGI + INABADILIKA KILA 3 SEC
let ads=[
 {icon:"📢",label:"Ads",url:"ale-tv.com/ads",title:"Advertise With ALE TV - TILL 3624692",desc:"🔴 ADVERTISE NOW - TILL 3624692 - 100K VIEWERS DAILY!",call:"Till 3624692",bg:"linear-gradient(270deg,#4285f4,#34a853,#fbbc05,#ea4335)",tags:["Public","100K views"]},
 {icon:"🏫",label:"JOIN",url:"alefootballacademy.co.ke",title:"ALE Football Academy - Registration Open 2026",desc:"🟡 JOIN ALE ACADEMY NOW - 0703182307 - TRAINING 4-18 YEARS ⚽",call:"0703182307",bg:"linear-gradient(270deg,#fbbc05,#ff6d00,#fbbc05)",tags:["Youth","Football"]},
 {icon:"💰",label:"TILL",url:"mpesa - Till 3624692",title:"Support ALE TV - MPESA TILL 3624692",desc:"💰 TILL 3624692 - SUPPORT ALE TV - ASANTE SANA - GOD BLESS 🙏",call:"Support",bg:"linear-gradient(270deg,#34a853,#00e676,#34a853)",tags:["Support","Thanks"]},
 {icon:"🌍",label:"LIVE",url:"ale-tv.com/live",title:"ALE TV Public - Same Time Everywhere",desc:"🌍 PUBLIC TV - KISUMU • NAIROBI • MOMBASA • UGANDA • TANZANIA - SAME TIME!",call:"Live Now",bg:"linear-gradient(270deg,#ea4335,#ff6d00,#ea4335)",tags:["Live","Public"]},
 {icon:"⚽",label:"WHAT",url:"ale-tv.com/whatwedo",title:"What We Do - Football • Gospel • News • Live 24/7",desc:"🟢 WHAT WE DO: Football ⚽ Gospel 🙏 News 📰 Live Matches 🔴 - ALE TV!",call:"Watch",bg:"linear-gradient(270deg,#7c4dff,#4285f4,#7c4dff)",tags:["Football","Gospel"]},
 {icon:"👤",label:"ALEX",url:"alex musau",title:"Alex Musau - Founder ALE TV - 0703182307",desc:"👤 I AM ALEX MUSAU - FOUNDER ALE TV - CALL 0703182307 - TILL 3624692",call:"Founder",bg:"linear-gradient(270deg,#000,#4285f4,#000)",tags:["Founder","Alex"]},
];
let ai=0;
setInterval(()=>{
 let a=ads[ai%ads.length];
 document.getElementById('googleAds').style.background=a.bg;
 document.getElementById('googleAds').style.backgroundSize="600% 600%";
 document.getElementById('gIcon').innerText=a.icon;
 document.getElementById('gLabel').innerText=a.label;
 document.getElementById('gUrl').innerText=a.url;
 document.querySelector('#gCenter #gTitle').innerText=a.title;
 let dEl=document.querySelector('#gCenter #gDesc');
 dEl.style.animation='none'; void dEl.offsetWidth;
 dEl.innerText=a.desc;
 dEl.style.animation='scrollX 8s linear infinite';
 document.getElementById('gCall').innerText=a.call;
 document.querySelector('#gBottom span').innerText=a.tags[0];
 document.querySelector('#gBottom span:nth-child(2)').innerText=a.tags[1];
 ai++;
},3000);
</script>
