<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ALE TV</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;overflow:hidden}#tv{position:relative;width:100vw;height:100vh}#tv iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0;pointer-events:none}#block{position:absolute;top:0;left:0;width:100%;height:100%;z-index:999;background:transparent}#bar{position:absolute;top:0;left:0;width:100%;height:60px;background:linear-gradient(to bottom,rgba(0,0,0,.9),transparent);z-index:1000;color:#fff;display:flex;align-items:center;padding:0 15px}</style></head><body><div id="tv"><div id="bar"><b style="color:#ff6a00">ALE TV</b>&nbsp;LIVE</div><iframe id="p" allow="autoplay"></iframe><div id="block"></div></div><script>let id=localStorage.getItem('ale_current_video')||'MvtfgPnvq-U';try{let v=JSON.parse(localStorage.getItem('ale_videos')||'[]');if(v[0])id=v[0].id||v[0].youtubeId||id}catch(e){}document.getElementById('p').src='https://www.youtube.com/embed/'+id+'?autoplay=1&controls=0&disablekb=1&fs=0&rel=0';document.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('keydown',e=>e.preventDefault());</script></body></html>
