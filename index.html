<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALE TV</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:sans-serif}
.topbar{background:#111;padding:10px;border-bottom:2px solid #f59e0b;display:flex;justify-content:space-between}
.logo{color:#f59e0b;font-weight:900}
#player{width:100%;height:75vh;background:#000;position:relative}
#main{width:100%;height:100%}
#hint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#f59e0b;color:#000;padding:12px 20px;border-radius:30px;font-weight:900;display:none;z-index:9}
.ticker{position:absolute;bottom:0;left:0;right:0;background:#b80000;height:30px;line-height:30px;overflow:hidden;white-space:nowrap}
.ticker span{animation:scroll 30s linear infinite;display:inline-block;padding-left:100%}
@keyframes scroll{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}
</style></head><body>
<div class="topbar"><div class="logo">🔥 ALE TV</div><div style="background:red;padding:4px 10px;border-radius:20px;font-size:12px">● LIVE</div></div>
<div id="player"><div id="main"></div><div id="hint" onclick="playNow()">👆 TAP PLAY</div><div class="ticker"><span id="tick">🔥 ALE TV LIVE 🔥</span></div></div>
<div style="padding:10px;background:#111"><h3 id="title" style="margin:0">Inapakia...</h3></div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
let videos=JSON.parse(localStorage.getItem('ale_videos')||'[{"id":"jNQXAC9IVRw","title":"Me at the zoo","cat":"LIVE"}]');
let current={idx:0,seek:0};
let player=null;

function getSync(){
 let total=videos.length*240;
 let now=Math.floor(Date.now()/1000)%total;
 return {idx:Math.floor(now/240), seek:now%240};
}

function showInfo(v){
 document.getElementById('title').innerText=v.title;
 document.getElementById('tick').innerText='🔥 '+v.title+' 🔥';
}

function onYouTubeIframeAPIReady(){
 current=getSync();
 let v=videos[current.idx];
 showInfo(v);
 player=new YT.Player('main',{
  videoId:v.id,
  playerVars:{autoplay:1,mute:1,controls:1,rel:0,playsinline:1,origin:location.origin,start:current.seek},
  events:{
   onReady:e=>{e.target.playVideo();},
   onStateChange:e=>{
    if(e.data==1) document.getElementById('hint').style.display='none';
    if(e.data==2) document.getElementById('hint').style.display='block';
    if(e.data==0){ // ikiisha - nenda kwa sync ya dunia
      current=getSync();
      showInfo(videos[current.idx]);
      player.loadVideoById({videoId:videos[current.idx].id,startSeconds:current.seek});
    }
   }
  }
 });
}

function playNow(){
 let n=getSync();
 if(n.idx==current.idx){
  player.seekTo(n.seek,true);
  player.playVideo();
 }else{
  current=n;
  showInfo(videos[n.idx]);
  player.loadVideoById({videoId:videos[n.idx].id,startSeconds:n.seek});
 }
 document.getElementById('hint').style.display='none';
}

document.getElementById('player').addEventListener('click',()=>{
 if(!player) return;
 let s=player.getPlayerState();
 if(s==1) player.pauseVideo();
 else playNow();
});

// IKIRUDI APP - SYNC PAPO HAPO
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState=='visible') playNow(); });
</script>
</body></html>
