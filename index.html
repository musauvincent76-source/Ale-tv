<div id="over"><button onclick="startTV()">▶️ BONYEZA HAPA KUANZA TV</button><div id="dbg">Inasoma ADMIN...</div></div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
let player, videos=[], curIdx=-1;
const KEY='azamtv_ale_final_2026';
const BIRTH=Date.UTC(2025,0,1)/1000;
const SLOT=240;

function getId(v){if(!v)return'';v=v.trim();if(v.length==11&&!v.includes('/')&&!v.includes('.'))return v;if(v.includes('youtu.be/'))return v.split('youtu.be/')[1].split(/[?&#]/)[0];try{let u=new URL(v);if(u.searchParams.get('v'))return u.searchParams.get('v');}catch{}let m=v.match(/([a-zA-Z0-9_-]{11})/);return m?m[1]:'';}

function fromAdmin(){
 try{
  let raw=localStorage.getItem(KEY);
  if(!raw){ document.getElementById('dbg').innerText='ADMIN empty - weka video'; return []; }
  let st=JSON.parse(raw);
  if(!st.playlist ||!st.playlist.length){ document.getElementById('dbg').innerText='ADMIN haina playlist'; return []; }
  // Chukua LIVE kwanza
  let live = st.playlist.find(p=>p.status==='now');
  let list = live? [live,...st.playlist.filter(p=>p.id!==live.id)] : st.playlist;
  let ids = list.map(p=>getId(p.ytid||p.url||p.id||'')).filter(x=>x);
  ids=[...new Set(ids)];
  document.getElementById('dbg').innerText='ADMIN: '+ids.length+' videos - LIVE: '+(live?live.ytid:'first');
  return ids;
 }catch(e){ document.getElementById('dbg').innerText='Error kusoma ADMIN'; return []; }
}

function worldPos(){
 if(!videos.length) return {i:0,s:0};
 let now=Date.now()/1000, elapsed=Math.floor(now-BIRTH), total=videos.length*SLOT, p=elapsed%total;
 return {i:Math.floor(p/SLOT), s:p%SLOT};
}

function onYouTubeIframeAPIReady(){
 videos=fromAdmin();
 if(!videos.length) videos=['jNQXAC9IVRw']; // fallback tu
 let w=worldPos();
 // Kama ADMIN ina LIVE, cheza LIVE kwanza, sio worldPos
 try{
  let raw=JSON.parse(localStorage.getItem(KEY)||'null');
  let live=raw && raw.playlist? raw.playlist.find(p=>p.status==='now') : null;
  if(live){
   let id=getId(live.ytid||live.url||'');
   if(id){ curIdx=videos.indexOf(id); if(curIdx==-1) curIdx=0; videos=[id,...videos.filter(x=>x!==id)]; w={i:0,s:0}; }
  }
 }catch{}
 player=new YT.Player('player',{videoId:videos[w.i],playerVars:{autoplay:1,mute:1,controls:1,rel:0,playsinline:1,start:w.s},
  events:{
   onReady:e=>{ e.target.seekTo(w.s,true); e.target.playVideo(); },
   onStateChange:e=>{ if(e.data==0){ let nw=worldPos(); player.loadVideoById({videoId:videos[nw.i],startSeconds:nw.s}); curIdx=nw.i; } },
   onError:e=>{ let nxt=(curIdx+1)%videos.length; player.loadVideoById({videoId:videos[nxt],startSeconds:0}); }
  }
 });
}

function startTV(){
 document.getElementById('over').style.display='none';
 if(player){ player.unMute(); player.setVolume(100); player.playVideo(); }
}

// PUBLIC SYNC - RUDI ONLINE SAME SECONDS
setInterval(()=>{
 if(!player||!videos.length) return;
 try{
  let raw=JSON.parse(localStorage.getItem(KEY)||'null');
  let live=raw && raw.playlist? raw.playlist.find(p=>p.status==='now') : null;
  if(live){
   let liveId=getId(live.ytid||live.url||'');
   let currentId=player.getVideoData().video_id;
   if(liveId && liveId!==currentId){
    player.loadVideoById({videoId:liveId,startSeconds:0});
    return;
   }
  }
 }catch{}
 let w=worldPos();
 if(w.i!==curIdx){
  try{ curIdx=w.i; player.loadVideoById({videoId:videos[w.i],startSeconds:w.s}); }catch{}
 } else {
  try{ let ct=player.getCurrentTime(); if(Math.abs(ct-w.s)>15) player.seekTo(w.s,true); }catch{}
 }
},10000);

setInterval(()=>{
 document.getElementById('clock').innerText=new Date().toLocaleTimeString('en-GB',{timeZone:'Africa/Nairobi',hour12:false});
 let fresh=fromAdmin();
 if(fresh.length && fresh.join(',')!==videos.join(',')){
  // kama admin imebadilisha, update lakini usi-reload kama ni same LIVE
  let sameLive = fresh[0]===videos[0];
  if(!sameLive) videos=fresh;
 }
},2000);

let ads=[
 {ic:"📢",lb:"Ads",u:"ale-tv.com/ads",t:"Advertise With ALE TV - TILL 3624692",d:"🔴 ADVERTISE NOW - TILL 3624692 - 100K VIEWERS DAILY!",c:"Till 3624692",bg:"linear-gradient(270deg,#4285f4,#34a853,#fbbc05,#ea4335)",tg:["Public","100K"]},
 {ic:"🏫",lb:"JOIN",u:"alefootballacademy.co.ke",t:"ALE Football Academy - Registration Open 2026",d:"🟡 JOIN ALE ACADEMY - 0703182307 - TRAINING 4-18 YEARS ⚽",c:"0703182307",bg:"linear-gradient(270deg,#fbbc05,#ff6d00,#fbbc05)",tg:["Youth","Football"]},
 {ic:"💰",lb:"TILL",u:"MPESA Till 3624692",t:"Support ALE TV - MPESA TILL 3624692",d:"💰 TILL 3624692 - SUPPORT ALE TV - ASANTE SANA 🙏",c:"Support",bg:"linear-gradient(270deg,#34a853,#00e676,#34a853)",tg:["Support","Thanks"]},
 {ic:"🌍",lb:"LIVE",u:"ale-tv.com/live",t:"ALE TV Public - Same Time Everywhere",d:"🌍 KISUMU • NAIROBI • MOMBASA • UGANDA • TANZANIA - SAME TIME!",c:"Live",bg:"linear-gradient(270deg,#ea4335,#ff6d00,#ea4335)",tg:["Live","Public"]},
];
let ai=0; setInterval(()=>{
 let a=ads[ai%ads.length];
 document.getElementById('gAds').style.background=a.bg; document.getElementById('gAds').style.backgroundSize="600% 600%";
 document.getElementById('gIcon').innerText=a.ic; document.getElementById('gLab').innerText=a.lb;
 document.getElementById('gUrl').innerText=a.u; document.getElementById('gTitle').innerText=a.t;
 let de=document.getElementById('gDesc'); de.style.animation='none'; void de.offsetWidth; de.innerText=a.d; de.style.animation='sx 8s linear infinite';
 document.getElementById('gCall').innerText=a.c; ai++;
},3500);
</script>
