<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALE TV</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:sans-serif}
#wrap{position:relative;width:100%;background:#000}
#player{width:100%;aspect-ratio:16/9;background:#000}
#player iframe{width:100%;height:100%;pointer-events:none!important}
#overlay{position:absolute;inset:0;z-index:9;background:transparent}
#live{position:absolute;top:10px;left:10px;background:red;color:#fff;padding:4px 8px;border-radius:4px;font-size:11px;font-weight:900;z-index:10;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.5}}
#tickerWrap{position:absolute;bottom:0;left:0;right:0;height:34px;background:#f59e0b;z-index:8;overflow:hidden;display:flex;align-items:center}
#ticker{flex:1;white-space:nowrap;overflow:hidden;color:#000;font-weight:900;font-size:13px}
#ticker span{display:inline-block;padding-left:100%;animation:scroll 25s linear infinite}
@keyframes scroll{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}
#clockBox{position:absolute;bottom:34px;left:0;z-index:11;background:#000;color:#f59e0b;border:2px solid #f59e0b;border-bottom:0;border-left:0;padding:5px 12px;border-radius:0 10px 0 0;font-weight:900;font-size:15px}
</style></head><body>

<div id="wrap">
<div id="player"></div>
<div id="overlay"></div>
<div id="live">🔴 LIVE</div>
<div id="clockBox">00:00:00</div>
<div id="tickerWrap"><div id="ticker"><span id="tick">ALE TV LIVE...</span></div></div>
</div>

<script>
function getV(){return JSON.parse(localStorage.getItem('ale_videos')||'[]')}

// BIRTH YA CHANNEL - ndio TV iende kama Citizen, hata ukizima simu
function getChannelBirth(){
 let b=localStorage.getItem('ale_channel_birth');
 if(!b){ b=Date.now(); localStorage.setItem('ale_channel_birth',b); }
 return parseInt(b);
}

let player, cur=null, videos=[], currentIdx=0;
const SLOT = 600; // kila video inapewa dakika 10 kwa TV, ndio kila mtu apate tofauti

function findWhatIsOnNow(){
 videos=getV(); if(!videos.length) return {idx:0, seek:0};
 let birth=getChannelBirth();
 let now=Date.now();
 let elapsedSec=Math.floor((now-birth)/1000);
 let idx=Math.floor(elapsedSec/SLOT) % videos.length;
 let seekInSlot=elapsedSec % SLOT;
 // na pia seek ya ndani ya video yenyewe
 let k='ale_start_'+videos[idx].id;
 let s=localStorage.getItem(k);
 if(!s){ localStorage.setItem(k, now - (seekInSlot*1000)); }
 let realSeek = seekInSlot;
 return {idx, seek: realSeek};
}

function playNow(){
 let what=findWhatIsOnNow();
 currentIdx=what.idx;
 cur=videos[currentIdx];
 if(!cur) return;
 document.getElementById('tick').innerText='🔴 '+cur.title+' | '+(localStorage.getItem('ale_ticker_custom')||'ALE TV LIVE')+' | '+cur.title;
 if(player && player.loadVideoById){
   player.loadVideoById({videoId:cur.id,startSeconds:what.seek});
 }else{ createPlayer(cur.id, what.seek); }
}

function createPlayer(vId,seek){
 if(!window.YT){ let t=document.createElement('script'); t.src="https://www.youtube.com/iframe_api"; document.head.appendChild(t); window.onYouTubeIframeAPIReady=()=>{ doCreate(vId,seek); }; }
 else{ doCreate(vId,seek); }
}
function doCreate(vId,seek){
 player=new YT.Player('player',{
  videoId:vId,
  playerVars:{autoplay:1,mute:1,controls:0,disablekb:1,fs:0,rel:0,modestbranding:1,playsinline:1,start:seek,origin:window.location.origin},
  events:{
   onReady:e=>{
     e.target.seekTo(seek,true); e.target.playVideo();
     setTimeout(()=>{try{e.target.unMute();e.target.setVolume(100);}catch{}},800);
     let c=0; let f=setInterval(()=>{c++; try{if(player.getPlayerState()!=1)player.playVideo(); else clearInterval(f);}catch{} if(c>20)clearInterval(f);},400);
   },
   onStateChange:e=>{
     if(e.data==0){ playNow(); } // imeisha enda kwa ile iko ON sasa, si next ya list
     if(e.data==2){ setTimeout(()=>{ let w=findWhatIsOnNow(); player.seekTo(w.seek,true); player.playVideo(); },300); }
   }
  }
 });
}

setInterval(()=>{ document.getElementById('clockBox').innerText=new Date().toLocaleTimeString('en-KE',{hour12:false,timeZone:'Africa/Nairobi'}); },1000);

// kila sec 5 angalia kama TV imehamia video nyingine dunia mzima
setInterval(()=>{
 if(!videos.length) return;
 let w=findWhatIsOnNow();
 if(w.idx!==currentIdx){ playNow(); }
 else{
  try{
   let diff=Math.abs(player.getCurrentTime()-w.seek);
   if(diff>8){ player.seekTo(w.seek,true); }
  }catch{}
 }
},3000);

document.addEventListener('visibilitychange',()=>{ if(!document.hidden) playNow(); });

let v=getV(); if(v.length) playNow();
</script>
</body></html>
