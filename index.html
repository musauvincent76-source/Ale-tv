<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALE TV - LIVE WORLD</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:sans-serif}
#playerWrap{position:relative;width:100%;aspect-ratio:16/9;background:#000;overflow:hidden}
#playerWrap iframe{width:100%;height:100%;border:0}
#overlay{position:absolute;top:0;left:0;right:0;bottom:0;z-index:5} /* mtu asiguse */
#ticker{position:absolute;bottom:0;left:0;right:0;background:rgba(245,158,11,0.95);color:#000;font-weight:900;padding:6px;font-size:12px;white-space:nowrap;overflow:hidden;z-index:6}
#liveBadge{position:absolute;top:10px;left:10px;background:red;color:#fff;padding:4px 8px;border-radius:4px;font-size:10px;font-weight:900;z-index:6;animation:blink 1s infinite}
@keyframes blink{50%{opacity:0.5}}
</style></head><body>

<div id="playerWrap">
<div id="player"></div>
<div id="overlay"></div>
<div id="liveBadge">🔴 LIVE - WORLD SYNC</div>
<div id="ticker"><span id="tickText">ALE TV LIVE - Kila mtu anaona kitu kimoja same time...</span></div>
</div>

<h3 style="padding:10px;color:#f59e0b">📺 Sasa Hivi - Kama Citizen TV</h3>
<div id="info" style="padding:0 10px 10px;font-size:13px;color:#aaa"></div>

<script>
function getV(){return JSON.parse(localStorage.getItem('ale_videos')||'[]')}
let player, currentVideo=null;

function getWorldSync(videoId){
  // Hapa ndipo Siri iko: tuna-save wakati video ilianza kwa mara ya kwanza
  let key = 'ale_start_'+videoId;
  let start = localStorage.getItem(key);
  if(!start){
    start = Date.now();
    localStorage.setItem(key, start);
  }
  start = parseInt(start);
  let elapsed = Math.floor((Date.now() - start)/1000); // seconds zimepita tangu ianze
  return elapsed;
}

function loadYT(){
  if(!window.YT){
    let s=document.createElement('script'); s.src='https://www.youtube.com/iframe_api';
    document.head.appendChild(s);
  }
}

window.onYouTubeIframeAPIReady=()=>{
  let vids=getV();
  if(vids.length==0){document.getElementById('info').innerText='Hakuna video admin'; return}
  
  currentVideo=vids[vids.length-1]; // ya mwisho ndio live
  let seek = getWorldSync(currentVideo.id);
  
  // Kama video ni 10 min na elapsed ni 15 min, irudi mwanzo
  // Kama ni LIVE stream, YouTube itajua
  
  document.getElementById('info').innerHTML=`<b>${currentVideo.title}</b><br>Imecheza kwa: ${Math.floor(seek/60)} min ${seek%60} sec - Kila mtu anaona hapa!`;
  document.getElementById('tickText').innerText=`🔴 LIVE: ${currentVideo.title} - ${currentVideo.desc||''} | ALE TV - WORLD SYNC`;

  player=new YT.Player('player',{
    videoId:currentVideo.id,
    playerVars:{
      autoplay:1, mute:1, controls:0, disablekb:1, fs:0, rel:0,
      playsinline:1, origin:window.location.origin
    },
    events:{
      onReady:(e)=>{
        // Hii ndio dawa mkuu - inaenda mahali dunia iko, si mahali uliacha!
        e.target.seekTo(seek, true);
        e.target.playVideo();
        // Baada ya 1 sec jaribu kutoa mute kama browser inaruhusu
        setTimeout(()=>{try{e.target.unMute();}catch{}},1000);
      },
      onStateChange:(e)=>{
        // Mtu akijaribu kupause, mrudishe play!
        if(e.data==2){ // paused
          setTimeout(()=>{ 
            let newSeek=getWorldSync(currentVideo.id);
            player.seekTo(newSeek, true);
            player.playVideo();
          },500);
        }
      }
    }
  });
};

loadYT();

// Kila 10 sec, songesha ticker kama TV ya kweli
setInterval(()=>{
  if(currentVideo && player && player.getCurrentTime){
    let realSeek=getWorldSync(currentVideo.id);
    let playerTime=player.getCurrentTime();
    // Kama player iko nyuma zaidi ya 15 sec, msongeze mbele!
    if(Math.abs(realSeek-playerTime)>15){
      player.seekTo(realSeek, true);
    }
  }
},10000);
</script>
</body></html>
