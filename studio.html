<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ALE TV KE - STUDIO LIVE</title><script src="https://unpkg.com/peerjs@1.5.3/dist/peerjs.min.js"></script><style>*{box-sizing:border-box;margin:0;padding:0}body{background:#070f26;color:#fff;font-family:Inter,sans-serif}header{background:#0a1330;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #ff6600}.logo{display:flex;gap:10px;align-items:center}.icon{width:36px;height:36px;background:linear-gradient(135deg,#ff6a00,#0066ff);border-radius:8px;display:grid;place-items:center}.badge{padding:5px 12px;border-radius:20px;font-size:12px;background:#222;border:1px solid #333}.badge.live{background:#ff2a2a;color:#fff}.main{padding:16px;max-width:1100px;margin:0 auto}.box{background:#0e1b3d;border:1px solid #1c2f5e;border-radius:16px;padding:16px;margin-bottom:16px}.invite{background:#0a1430;border:1px dashed #ff6a00;border-radius:12px;padding:12px;margin-top:10px}input{width:100%;padding:11px 14px;border-radius:25px;border:1px solid #203464;background:#0a1430;color:#fff;outline:none;margin-top:6px}.btn{background:#ff6a00;border:0;padding:11px 18px;border-radius:25px;font-weight:800;color:#fff;cursor:pointer}.btn-small{padding:7px 12px;border-radius:20px;border:1px solid #2a3d6a;background:#12224a;color:#fff;cursor:pointer;margin:3px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:14px}.vbox{background:#000;border-radius:14px;overflow:hidden;position:relative;aspect-ratio:16/9;border:2px solid #1c2f5e}.vbox video{width:100%;height:100%;object-fit:cover}.tag{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.7);padding:4px 10px;border-radius:20px;font-size:11px}.pending{display:flex;justify-content:space-between;align-items:center;background:#111e3f;padding:10px;border-radius:10px;margin-top:8px}</style></head><body><header><div class="logo"><div class="icon">📺</div><div><b style="color:#ff6a00">ALE</b><b style="color:#fff"> TV KE</b> <span style="font-size:10px;letter-spacing:2px;color:#9ab">STUDIO LIVE</span></div></div><div style="display:flex;gap:8px"><span id="badge" class="badge">● OFFLINE</span><a href="admin.html" style="background:#1a2a50;color:#fff;padding:6px 12px;border-radius:15px;text-decoration:none;font-size:12px">Admin</a></div></header><div class="main"><div class="box"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;align-items:center"><div><b style="font-size:18px">🔴 STUDIO LIVE HOST</b><br><small style="color:#8aa">Wewe ndio host. Front/Back camera, guest approve.</small></div><button class="btn" onclick="startLive()" id="startBtn">▶️ ANZA LIVE</button></div><div id="inviteArea" style="display:none" class="invite"><small style="color:#ff6a00">LINK YA GUESTS (Share WhatsApp):</small><input id="inviteLink" readonly><div style="display:flex;gap:6px;margin-top:8px"><button class="btn-small" onclick="copyLink()" style="background:#ff6a00;border:0">📋 COPY</button><button class="btn-small" onclick="toggleCam()">🔄 Front/Back</button><button class="btn-small" onclick="toggleMic()" id="micBtn">🎤 Mute</button><button class="btn-small" onclick="endLive()" style="background:#3a1020;color:#ff8a8a">⏹️ Maliza</button></div><small id="viewerCount" style="color:#5a8a6a;display:block;margin-top:6px">Viewers: 0 • TV inaonyesha live sasa</small></div></div><div class="grid" id="videos"></div><div class="box"><b>⏳ Maombi ya Kuingia</b><div id="pendingList"><small style="color:#5a6a8a">Hakuna maombi</small></div></div></div><script>let peer=null,localStream=null,roomId=null,facing='user',peers={},pending={},guestStreams={},viewers={};function id(){return 'aletv-'+Math.random().toString(36).substring(2,7);}async function startLive(){roomId=id();peer=new Peer('ALEHOST-'+roomId);peer.on('open',async()=>{document.getElementById('badge').innerText='🔴 LIVE - '+roomId;document.getElementById('badge').className='badge live';document.getElementById('inviteArea').style.display='block';document.getElementById('startBtn').style.display='none';let base=location.origin+location.pathname.replace('studio.html','');document.getElementById('inviteLink').value=base+'join.html?room='+roomId;localStorage.setItem('aletv_studio_live',JSON.stringify({room:roomId,active:true}));localStorage.setItem('aletv_studio_room',roomId);await startCam('user');});peer.on('connection',conn=>{conn.on('data',d=>{if(d.type==='join_request'){pending[conn.peer]={conn,name:d.name||'Guest'};renderPending();}if(d.type==='viewer'){viewers[conn.peer]=conn;document.getElementById('viewerCount').innerText='Viewers: '+Object.keys(viewers).length;setTimeout(()=>{if(localStream)peer.call(conn.peer,localStream);Object.values(guestStreams).forEach(gs=>{if(gs.stream)peer.call(conn.peer,gs.stream);});},500);conn.on('close',()=>{delete viewers[conn.peer];document.getElementById('viewerCount').innerText='Viewers: '+Object.keys(viewers).length;});}});});peer.on('call',call=>{if(!peers[call.peer]&&!viewers[call.peer]){call.close();return;}call.answer(localStream);call.on('stream',s=>{addVideo(call.peer,s,peers[call.peer]?.name||'Guest');if(peers[call.peer]){guestStreams[call.peer]={stream:s,name:peers[call.peer]?.name};Object.keys(viewers).forEach(vid=>{peer.call(vid,s);});}});});}async function startCam(f){facing=f;if(localStream)localStream.getTracks().forEach(t=>t.stop());localStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:f},audio:true});addVideo('local',localStream,'Host',true);Object.keys(peers).forEach(pid=>{try{peer.call(pid,localStream);}catch{}});Object.keys(viewers).forEach(vid=>{try{peer.call(vid,localStream);}catch{}});}function addVideo(id,stream,name,muted=false){let g=document.getElementById('videos');let ex=document.getElementById('v-'+id);if(ex){ex.querySelector('video').srcObject=stream;return;}let d=document.createElement('div');d.className='vbox';d.id='v-'+id;d.innerHTML=`<video autoplay playsinline ${muted?'muted':''}></video><div class=tag>${name}</div>`;g.appendChild(d);d.querySelector('video').srcObject=stream;}function renderPending(){let b=document.getElementById('pendingList');let ks=Object.keys(pending);if(!ks.length){b.innerHTML='<small style=color:#5a6a8a>Hakuna maombi</small>';return;}b.innerHTML=ks.map(k=>`<div class=pending><span>🙋 ${pending[k].name}</span><span><button onclick="approve('${k}')" style="background:#0fda7a;border:0;padding:6px 12px;border-radius:15px;font-weight:800">✅ Approve</button><button onclick="reject('${k}')" style="background:#ff2a2a;border:0;padding:6px 12px;border-radius:15px;color:#fff;margin-left:5px">X</button></span></div>`).join('');}function approve(pid){let g=pending[pid];if(!g)return;g.conn.send({type:'approved'});peers[pid]={conn:g.conn,name:g.name};let call=peer.call(pid,localStream);call.on('stream',s=>{addVideo(pid,s,g.name);guestStreams[pid]={stream:s,name:g.name};Object.keys(viewers).forEach(vid=>{peer.call(vid,s);});});delete pending[pid];renderPending();}function reject(pid){let g=pending[pid];if(g){g.conn.send({type:'rejected'});g.conn.close();}delete pending[pid];renderPending();}function toggleCam(){startCam(facing==='user'?'environment':'user');}function toggleMic(){let t=localStream.getAudioTracks()[0];if(t){t.enabled=!t.enabled;document.getElementById('micBtn').innerText=t.enabled?'🎤 Mute':'🔇 Unmute';}}function endLive(){if(peer)peer.destroy();if(localStream)localStream.getTracks().forEach(tr=>tr.stop());localStorage.removeItem('aletv_studio_live');localStorage.removeItem('aletv_studio_room');document.getElementById('videos').innerHTML='';document.getElementById('inviteArea').style.display='none';document.getElementById('startBtn').style.display='block';document.getElementById('badge').innerText='● OFFLINE';document.getElementById('badge').className='badge';}function copyLink(){navigator.clipboard.writeText(document.getElementById('inviteLink').value);alert('Copied!');}</script></body></html>
